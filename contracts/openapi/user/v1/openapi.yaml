    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/CommunityId'
    get:
      tags: [communities]
      operationId: recoverCommunityEvents
      summary: Recover identifier-only community events after a durable sequence
      description: |
        Requires the authenticated user's current ACTIVE membership. PostgreSQL is authoritative;
        WebSocket and RabbitMQ delivery are hints. A retained-gap conflict instructs the client to
        reload canonical feed/comment state before resuming from the latest sequence.
      parameters:
        - name: afterSequence
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Ordered events after the supplied sequence, bounded by a captured head.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityRealtimeEventPage'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '409':
          description: Cursor is ahead of the head or older than retained history.
          headers:
            X-Community-Latest-Sequence:
              schema:
                type: integer
                minimum: 0
            X-Community-Retained-From-Sequence:
              description: Present only when the requested gap has expired.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CommunityEventGapExpiredResponse'
                  - $ref: ../../common/components.yaml#/components/schemas/ApiError
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
