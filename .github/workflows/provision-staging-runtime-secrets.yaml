name: Provision staging runtime-secret isolation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Start the reviewed transition or recover its durable marker
        required: true
        type: choice
        options: [TRANSITION, RECOVER]
      expected_active_release:
        description: Exact currently serving 40-character staging release
        required: true
        type: string
      confirmation:
        description: Type the exact transition or recovery confirmation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-latest
    steps:
      - name: Validate request
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REQUEST_REF: ${{ github.ref }}
        run: |
          set -eu
          test "$REQUEST_REF" = refs/heads/main
          printf '%s' "$EXPECTED_ACTIVE_RELEASE" | grep -Eq '^[0-9a-f]{40}$'
          case "$OPERATION:$CONFIRMATION" in
            TRANSITION:TRANSITION_STAGING_RUNTIME_SECRETS | RECOVER:RECOVER_STAGING_RUNTIME_SECRETS) ;;
            *) echo '::error::Exact operation confirmation is required.'; exit 1 ;;
          esac

  operate:
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      SSH_OPTIONS: -o ConnectTimeout=10 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=2
    steps:
      - uses: actions/checkout@v4
      - name: Join staging tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.STAGING_HOST }}
      - name: Configure audited SSH
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Attest public release before transition writes
        if: ${{ inputs.operation == 'TRANSITION' }}
        env:
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
        run: |
          set -euo pipefail
          manifest=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 15 https://lk.nano.padlhub.su/manifest.json)
          printf '%s' "$manifest" | EXPECTED_ACTIVE_RELEASE="$EXPECTED_ACTIVE_RELEASE" node -e '
            let value=""; process.stdin.on("data", chunk => { value += chunk; });
            process.stdin.on("end", () => { if (JSON.parse(value).release !== process.env.EXPECTED_ACTIVE_RELEASE) process.exit(1); });
          '
      - id: remote
        name: Create isolated remote tool directory
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          set -euo pipefail
          remote_dir=$(ssh $SSH_OPTIONS "phub-deploy@$HOST" 'umask 077; value=$(mktemp -d /tmp/phub-runtime-secret.XXXXXX); chmod 700 "$value"; printf "%s" "$value"')
          case "$remote_dir" in
            /tmp/phub-runtime-secret.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;;
            *) echo '::error::Remote tool directory is malformed.'; exit 1 ;;
          esac
          case "$remote_dir" in *$'\n'*) echo '::error::Remote tool directory is multiline.'; exit 1 ;; esac
          printf 'directory=%s\n' "$remote_dir" >> "$GITHUB_OUTPUT"
      - name: Transfer reviewed tools
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          REMOTE_DIR: ${{ steps.remote.outputs.directory }}
        run: |
          set -euo pipefail
          scp $SSH_OPTIONS \
            deploy/compose.staging.yaml \
            deploy/jetson/provision-runtime-secret-files.mjs \
            deploy/jetson/transition-runtime-secret-contours.sh \
            "phub-deploy@$HOST:$REMOTE_DIR/"
          ssh $SSH_OPTIONS "phub-deploy@$HOST" "chmod 500 '$REMOTE_DIR/transition-runtime-secret-contours.sh'; chmod 400 '$REMOTE_DIR/provision-runtime-secret-files.mjs' '$REMOTE_DIR/compose.staging.yaml'"
      - name: Transition realtime, API and worker in a bounded maintenance window
        if: ${{ inputs.operation == 'TRANSITION' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          REMOTE_DIR: ${{ steps.remote.outputs.directory }}
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
        run: |
          set -euo pipefail
          install -d -m 700 runtime-secret-transition
          ssh $SSH_OPTIONS "phub-deploy@$HOST" \
            "sh '$REMOTE_DIR/transition-runtime-secret-contours.sh' transition '$EXPECTED_ACTIVE_RELEASE' TRANSITION_STAGING_RUNTIME_SECRETS '$REMOTE_DIR/compose.staging.yaml' '$REMOTE_DIR/provision-runtime-secret-files.mjs'" \
            | tee runtime-secret-transition/transition.txt
      - name: Verify isolated files without exposing values
        if: ${{ inputs.operation == 'TRANSITION' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh $SSH_OPTIONS "phub-deploy@$HOST" \
            'sh -s -- /etc/phub/staging.env /etc/phub/realtime.env phub-deploy false' \
            < deploy/jetson/verify-runtime-env-isolation.sh
      - name: Attest candidate runtime before finalize
        if: ${{ inputs.operation == 'TRANSITION' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
        run: |
          set -euo pipefail
          install -d -m 700 runtime-secret-transition
          manifest_file=runtime-secret-transition/candidate-migrations.manifest
          find packages/database/migrations -maxdepth 1 -type f -name '*.sql' -print | LC_ALL=C sort | while IFS= read -r migration; do
            checksum=$(sha256sum "$migration")
            printf '%s|%s\n' "${checksum%% *}" "$(basename "$migration")"
          done > "$manifest_file"
          ssh $SSH_OPTIONS "phub-deploy@$HOST" sh -s -- \
            "$EXPECTED_ACTIVE_RELEASE" "$GITHUB_SHA" "$(git rev-parse 'HEAD^{tree}')" \
            "$(base64 -w 0 "$manifest_file")" "$(base64 -w 0 deploy/compose.staging.yaml)" \
            < deploy/jetson/verify-media-staging-baseline.sh \
            | tee runtime-secret-transition/media-attestation.txt
      - name: Attest public ingress before irreversible finalize
        if: ${{ inputs.operation == 'TRANSITION' }}
        env:
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
        run: |
          set -euo pipefail
          for path in /healthz /health/live /health/ready; do
            curl --fail --silent --show-error --connect-timeout 10 --max-time 15 --output /dev/null "https://lk.nano.padlhub.su$path"
          done
          manifest=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 15 https://lk.nano.padlhub.su/manifest.json)
          printf '%s' "$manifest" | EXPECTED_ACTIVE_RELEASE="$EXPECTED_ACTIVE_RELEASE" node -e '
            let value=""; process.stdin.on("data", chunk => { value += chunk; });
            process.stdin.on("end", () => { if (JSON.parse(value).release !== process.env.EXPECTED_ACTIVE_RELEASE) process.exit(1); });
          '
      - name: Finalize verified transition
        if: ${{ inputs.operation == 'TRANSITION' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          REMOTE_DIR: ${{ steps.remote.outputs.directory }}
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
        run: |
          set -euo pipefail
          ssh $SSH_OPTIONS "phub-deploy@$HOST" \
            "sh '$REMOTE_DIR/transition-runtime-secret-contours.sh' finalize '$EXPECTED_ACTIVE_RELEASE' TRANSITION_STAGING_RUNTIME_SECRETS '$REMOTE_DIR/compose.staging.yaml' '$REMOTE_DIR/provision-runtime-secret-files.mjs'" \
            | tee -a runtime-secret-transition/transition.txt
      - name: Recover explicitly selected interrupted transition
        if: ${{ inputs.operation == 'RECOVER' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          REMOTE_DIR: ${{ steps.remote.outputs.directory }}
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
        run: |
          set -euo pipefail
          install -d -m 700 runtime-secret-transition
          ssh $SSH_OPTIONS "phub-deploy@$HOST" \
            "sh '$REMOTE_DIR/transition-runtime-secret-contours.sh' recover '$EXPECTED_ACTIVE_RELEASE' RECOVER_STAGING_RUNTIME_SECRETS '$REMOTE_DIR/compose.staging.yaml' '$REMOTE_DIR/provision-runtime-secret-files.mjs'" \
            | tee runtime-secret-transition/recovery.txt
      - name: Recover after failure or cancellation
        if: ${{ always() && inputs.operation == 'TRANSITION' && (failure() || cancelled()) }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          REMOTE_DIR: ${{ steps.remote.outputs.directory }}
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
        run: |
          set -euo pipefail
          install -d -m 700 runtime-secret-transition
          if ssh $SSH_OPTIONS "phub-deploy@$HOST" 'test -e /etc/phub/.runtime-secret-isolation.transition.json || test -L /etc/phub/.runtime-secret-isolation.transition.json || test -e /etc/phub/.runtime-secret-isolation.transition.json.next || test -L /etc/phub/.runtime-secret-isolation.transition.json.next'; then
            ssh $SSH_OPTIONS "phub-deploy@$HOST" \
              "sh '$REMOTE_DIR/transition-runtime-secret-contours.sh' recover '$EXPECTED_ACTIVE_RELEASE' RECOVER_STAGING_RUNTIME_SECRETS '$REMOTE_DIR/compose.staging.yaml' '$REMOTE_DIR/provision-runtime-secret-files.mjs'" \
              | tee -a runtime-secret-transition/recovery.txt
          else
            printf '%s\n' 'runtime_secret_transition recovery=no-marker status=not-required' | tee -a runtime-secret-transition/recovery.txt
          fi
      - name: Remove remote tools
        if: ${{ always() }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          REMOTE_DIR: ${{ steps.remote.outputs.directory }}
        run: |
          case "$REMOTE_DIR" in
            /tmp/phub-runtime-secret.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9])
              ssh $SSH_OPTIONS "phub-deploy@$HOST" "find '$REMOTE_DIR' -type f -delete; rmdir '$REMOTE_DIR'"
              ;;
            *) echo '::error::Refusing unexpected remote cleanup path.'; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: runtime-secret-transition-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-secret-transition
          if-no-files-found: ignore
          retention-days: 30
