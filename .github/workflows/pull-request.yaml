name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || (github.event_name == 'push' && github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: phub
          POSTGRES_USER: phub
          POSTGRES_PASSWORD: ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U phub -d phub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql://phub:ci-password@localhost:5432/phub
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      JWT_ISSUER: phub-identity
      JWT_AUDIENCE: phub-api
      JWT_REALTIME_AUDIENCE: phub-realtime
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      VIVA_MODE: mock
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate API contract types
        run: npm run contracts:generate
      - name: Verify immutable import and OpenAPI
        run: npm run contracts:lint
      - name: Check migration safety
        run: npm run db:migrate:check
      - name: Apply migrations to an empty database
        env:
          CHAT_PUSH_FOUNDATION_MAINTENANCE_ACK: CHAT_PUSH_FOUNDATION_EMPTY_DATABASE_V1
        run: npm run db:migrate
      - name: Formatting, lint and type safety
        run: npm run format:check && npm run lint && npm run typecheck
      - name: Unit and integration tests
        timeout-minutes: 10
        run: scripts/run-ci-tests-with-diagnostics.sh
      - name: Upload test and coverage diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-artifacts/test-and-coverage
            coverage
          if-no-files-found: error
          retention-days: 14
      - name: Build all artifacts
        run: npm run build
      - name: Validate local Compose model
        run: cp .env.example .env && docker compose config --quiet

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve the exact secret-scan range
        id: secret-range
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          EVENT_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          range_mode=merge_base
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_tip_sha="$EVENT_BASE_SHA"
              head_sha="$EVENT_HEAD_SHA"
              ;;
            push)
              range_mode=exact_push
              base_tip_sha="$EVENT_BEFORE_SHA"
              head_sha="$EVENT_AFTER_SHA"
              ;;
            *)
              echo "Unsupported secret-scan event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          [[ "$base_tip_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$base_tip_sha^{commit}"
          git cat-file -e "$head_sha^{commit}"
          if [[ "$range_mode" = exact_push ]]; then
            zero_sha=0000000000000000000000000000000000000000
            test "$GITHUB_REF" = refs/heads/main
            test "$base_tip_sha" != "$zero_sha"
            test "$head_sha" != "$zero_sha"
            test "$base_tip_sha" != "$head_sha"
            test "$head_sha" = "$GITHUB_SHA"
            git merge-base --is-ancestor "$base_tip_sha" "$head_sha"
            base_sha="$base_tip_sha"
            range_commit_count="$(git rev-list --count "$base_sha..$head_sha")"
            [[ "$range_commit_count" =~ ^[1-9][0-9]*$ ]]
          else
            base_sha="$(git merge-base "$base_tip_sha" "$head_sha")"
            [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$base_sha" "$head_sha"
          fi
          printf 'base_sha=%s\n' "$base_sha" >>"$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$head_sha" >>"$GITHUB_OUTPUT"
      - name: Scan exact range for secrets
        env:
          BASE_SHA: ${{ steps.secret-range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.secret-range.outputs.head_sha }}
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
        run: |
          set -euo pipefail
          docker pull "$GITLEAKS_IMAGE"
          test "$(docker image inspect "$GITLEAKS_IMAGE" --format '{{index .RepoDigests 0}}')" = "$GITLEAKS_IMAGE"
          octopus_merges="$(git rev-list --min-parents=3 "$BASE_SHA..$HEAD_SHA")"
          if [[ -n "$octopus_merges" ]]; then
            printf 'Octopus merges are not supported by the exact secret scan:\n%s\n' "$octopus_merges" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/gitleaks"
          scan_repository="$RUNNER_TEMP/gitleaks/repository.git"
          ignore_file="$RUNNER_TEMP/gitleaks/.gitleaksignore"
          git clone --bare --no-local "$PWD" "$scan_repository"
          git --git-dir="$scan_repository" cat-file -e "$BASE_SHA^{commit}"
          git --git-dir="$scan_repository" cat-file -e "$HEAD_SHA^{commit}"
          git show "$HEAD_SHA:.gitleaksignore" >"$ignore_file"
          test -s "$ignore_file"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$RUNNER_TEMP/gitleaks:/workspace" \
            "$GITLEAKS_IMAGE" detect \
            --source=/workspace/repository.git \
            --gitleaks-ignore-path=/workspace/.gitleaksignore \
            --redact \
            --verbose \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=/workspace/results.sarif \
            --log-opts="--diff-merges=remerge $BASE_SHA..$HEAD_SHA"
      - name: Upload secret-scan diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-scan-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gitleaks/results.sarif
          if-no-files-found: error
          retention-days: 90

  docker-selection:
    name: docker-selection
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.select.outputs.services }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select affected Docker services
        id: select
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          all_services='["web","api","worker","realtime","migrator"]'

          if [[ "$GITHUB_EVENT_NAME" = pull_request ]]; then
            [[ "$EVENT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$EVENT_BASE_SHA^{commit}"
            git cat-file -e "$EVENT_HEAD_SHA^{commit}"
            base_sha="$(git merge-base "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA")"
            services="$(
              git diff --no-renames --name-only -z "$base_sha" "$EVENT_HEAD_SHA" \
                | node scripts/select-pr-docker-services.js
            )"
          else
            services="$all_services"
          fi

          jq -e '
            type == "array"
            and all(.[]; . == "web" or . == "api" or . == "worker" or . == "realtime" or . == "migrator")
            and length == (unique | length)
          ' <<<"$services" >/dev/null
          printf 'services=%s\n' "$services" >>"$GITHUB_OUTPUT"
          printf 'Selected Docker services: `%s`\n' "$services" >>"$GITHUB_STEP_SUMMARY"

  docker-image:
    name: docker-build (${{ matrix.service }})
    needs: docker-selection
    if: ${{ needs.docker-selection.result == 'success' && needs.docker-selection.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.docker-selection.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact Docker build source
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: phub-${{ matrix.service }}:pr-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=pr-amd64-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=pr-amd64-${{ matrix.service }}
      - name: Verify linux/amd64 runtime image
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: phub-${{ matrix.service }}:pr-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail

          platform="$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')"
          image_id="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          image_user="$(docker image inspect "$IMAGE" --format '{{.Config.User}}')"
          test "$platform" = 'linux/amd64'
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ -n "$BUILD_DIGEST" ]]; then
            [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi

          case "$SERVICE" in
            web)
              test -z "$image_user"
              docker run --rm --entrypoint /bin/sh "$IMAGE" -ec \
                'test -s /usr/share/nginx/html/index.html && nginx -t'
              container_id="$(docker run --rm -d -p 127.0.0.1::8080 "$IMAGE")"
              trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
              address="$(docker port "$container_id" 8080/tcp)"
              port="${address##*:}"
              [[ "$port" =~ ^[0-9]+$ ]]
              for attempt in {1..30}; do
                if curl --fail --silent --show-error "http://127.0.0.1:$port/healthz" \
                  | grep --quiet '^ok$'; then
                  break
                fi
                if [[ "$attempt" = 30 ]]; then
                  docker logs "$container_id"
                  exit 1
                fi
                sleep 1
              done
              curl --fail --silent --show-error "http://127.0.0.1:$port/" \
                | grep --quiet '<div id="phub-app"></div>'
              docker rm -f "$container_id" >/dev/null
              trap - EXIT
              ;;
            api|worker)
              test "$image_user" = 'appuser'
              docker run --rm --entrypoint /bin/sh "$IMAGE" -ec \
                "test \"\$(id -u)\" = 1001 && test -s /app/apps/$SERVICE/dist/main.js"
              docker run --rm --entrypoint node "$IMAGE" \
                --check "/app/apps/$SERVICE/dist/main.js"
              docker run --rm --entrypoint node "$IMAGE" --input-type=module -e \
                "import sharp from 'sharp';
                 if (process.platform !== 'linux' || process.arch !== 'x64') process.exit(1);
                 const output = await sharp({
                   create: {
                     width: 1,
                     height: 1,
                     channels: 4,
                     background: { r: 0, g: 0, b: 0, alpha: 1 },
                   },
                 }).webp().toBuffer();
                 if (output.length === 0) process.exit(1);"
              ;;
            realtime)
              test "$image_user" = 'appuser'
              docker run --rm --entrypoint /bin/sh "$IMAGE" -ec \
                'test "$(id -u)" = 1001 && test -s /app/apps/realtime/dist/main.js'
              docker run --rm --entrypoint node "$IMAGE" \
                --check /app/apps/realtime/dist/main.js
              docker run --rm --entrypoint node "$IMAGE" -e \
                "if (process.platform !== 'linux' || process.arch !== 'x64') process.exit(1)"
              ;;
            migrator)
              test "$image_user" = 'appuser'
              docker run --rm --entrypoint /bin/sh "$IMAGE" -ec \
                'test "$(id -u)" = 1001 && test -s /app/apps/migrator/dist/main.js && test -d /app/migrations'
              docker run --rm --entrypoint node "$IMAGE" \
                --check /app/apps/migrator/dist/main.js
              docker run --rm --entrypoint node "$IMAGE" -e \
                "if (process.platform !== 'linux' || process.arch !== 'x64') process.exit(1)"
              ;;
            *)
              echo "Unsupported service: $SERVICE" >&2
              exit 1
              ;;
          esac

          {
            echo "### phub-$SERVICE"
            echo "- platform: \`$platform\`"
            echo "- image ID: \`$image_id\`"
            if [[ -n "$BUILD_DIGEST" ]]; then
              echo "- BuildKit digest (not a published registry digest): \`$BUILD_DIGEST\`"
            else
              echo '- BuildKit digest: not emitted by the local Docker exporter'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: docker-build
    needs: [docker-selection, docker-image]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Docker selection and builds
        env:
          BUILD_RESULT: ${{ needs.docker-image.result }}
          SELECTED_SERVICES: ${{ needs.docker-selection.outputs.services }}
          SELECTION_RESULT: ${{ needs.docker-selection.result }}
        run: |
          set -euo pipefail
          test "$SELECTION_RESULT" = success
          if [[ "$SELECTED_SERVICES" = '[]' ]]; then
            test "$BUILD_RESULT" = skipped
          else
            test "$BUILD_RESULT" = success
          fi
