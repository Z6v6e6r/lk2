          '
      - name: Verify the exact recoverable foundation state
        if: ${{ inputs.deployment_profile == 'CHAT_PUSH_FOUNDATION_RECOVERY' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh "phub-deploy@$HOST" '
            set -eu
            backup_dir="/opt/phub/backups/releases/pre-${{ inputs.foundation_expected_candidate_sha }}-${{ inputs.foundation_original_run_id }}-${{ inputs.foundation_original_run_attempt }}"
            test -d "$backup_dir" && test ! -L "$backup_dir"
            for recovery_file in release.env backup.complete foundation.candidate-release.env \
              chat-push-foundation.recovery chat-push-foundation.catalog-digest \
              chat-push-foundation.database-backup chat-push-foundation.monitoring-digest \
              chat-push-foundation.phase; do
              test -f "$backup_dir/$recovery_file" && test ! -L "$backup_dir/$recovery_file"
            done
            test "$(sed -n s/^CANDIDATE_SHA=//p "$backup_dir/chat-push-foundation.recovery")" = "${{ inputs.foundation_expected_candidate_sha }}"
            test "$(sed -n s/^ORIGINAL_RUN_ID=//p "$backup_dir/chat-push-foundation.recovery")" = "${{ inputs.foundation_original_run_id }}"
            test "$(sed -n s/^ORIGINAL_RUN_ATTEMPT=//p "$backup_dir/chat-push-foundation.recovery")" = "${{ inputs.foundation_original_run_attempt }}"
            test -f /opt/phub/release.env && test ! -L /opt/phub/release.env
            if ! cmp /opt/phub/release.env "$backup_dir/release.env" >/dev/null \
              && ! cmp /opt/phub/release.env "$backup_dir/foundation.candidate-release.env" >/dev/null; then
              echo "Active release changed after the failed foundation run." >&2
              exit 1
            fi
            PHUB_APP_ROOT=/opt/phub sh /opt/phub/run-chat-push-foundation-release.sh \
              "${{ inputs.foundation_tenant_keys }}" \
              "${{ inputs.foundation_expected_candidate_sha }}" \
              "${{ inputs.foundation_original_run_id }}" \
              "${{ inputs.foundation_original_run_attempt }}" \
              "${{ inputs.foundation_expected_active_release_sha }}" \
              "$backup_dir" \
              prepare-recovery \
              "$backup_dir/foundation.candidate-release.env"
          '
      - name: Re-attest the media baseline before the first staging write
        if: ${{ inputs.deployment_profile == 'MEDIA_BINARY_ONLY' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
          EXPECTED_COMPATIBILITY_FLOOR: ${{ needs.media-baseline.outputs.compatibility_floor }}
          EXPECTED_ROUTING_FINGERPRINT: ${{ needs.media-baseline.outputs.routing_fingerprint }}
          EXPECTED_RUNTIME_CONFIG_FINGERPRINT: ${{ needs.media-baseline.outputs.runtime_config_fingerprint }}
        run: |
          set -euo pipefail
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT HUP INT TERM
          migration_manifest="$temporary/candidate-migrations.manifest"
          find packages/database/migrations -maxdepth 1 -type f -name '*.sql' -print \
            | LC_ALL=C sort \
            | while IFS= read -r migration; do
                checksum_line="$(sha256sum "$migration")"
                printf '%s|%s\n' "${checksum_line%% *}" "$(basename "$migration")"
              done > "$migration_manifest"
          migration_manifest_base64="$(base64 -w 0 "$migration_manifest")"
          candidate_compose_base64="$(base64 -w 0 deploy/compose.staging.yaml)"
          candidate_tree="$(git rev-parse 'HEAD^{tree}')"
          attestation="$temporary/attestation.txt"
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
            sh -s -- "$EXPECTED_ACTIVE_RELEASE" "$GITHUB_SHA" "$candidate_tree" \
            "$migration_manifest_base64" "$candidate_compose_base64" \
            < deploy/jetson/verify-media-staging-baseline.sh \
            | tee "$attestation"

          observed_routing="$(sed -n 's/^routing_fingerprint=//p' "$attestation" | tail -n 1)"
          observed_runtime="$(sed -n 's/^runtime_config_fingerprint=//p' "$attestation" | tail -n 1)"
          test "$observed_routing" = "$EXPECTED_ROUTING_FINGERPRINT"
          test "$observed_runtime" = "$EXPECTED_RUNTIME_CONFIG_FINGERPRINT"

          set +e
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
            'PHUB_MEDIA_ROLLBACK_MODE=pre-cutover sh -s' \
            < deploy/jetson/verify-media-rollback-safe.sh
          guard_status=$?
          set -e
          case "$guard_status:$EXPECTED_COMPATIBILITY_FLOOR" in
            0:ordinary) ;;
            42:client-media)
              ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
                'PHUB_ROLLBACK_COMPATIBILITY_FLOOR=client-media PHUB_MEDIA_ROLLBACK_MODE=compatible-client sh -s' \
                < deploy/jetson/verify-media-rollback-safe.sh
              ;;
            *)
