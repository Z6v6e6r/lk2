name: phub-staging

x-runtime: &runtime
  restart: unless-stopped
  networks:
    - application

x-realtime-runtime: &realtime-runtime
  <<: *runtime
  # Realtime deliberately receives no API access/refresh or integration secrets.
  # loadRealtimeConfig fails closed if those keys leak into this process.
  env_file:
    - path: ${REALTIME_RUNTIME_ENV_FILE:-/etc/phub/realtime.env}

x-worker-runtime: &worker-runtime
  <<: *runtime
  # The worker publishes outbox events but never issues API sessions, and loadWorkerConfig fails
  # closed when a deployed worker receives JWT_ACCESS_SECRET or JWT_REFRESH_SECRET. It therefore
  # reads a derived runtime contract that carries every API runtime key except those two signing
  # secrets, plus the required WORKER_RUNTIME_SECRET_ISOLATION_REQUIRED=true attestation.
  # deploy/jetson/derive-worker-runtime-env.sh derives that file from /etc/phub/staging.env, and
  # the deploy job refuses the release when the derived contract is absent or wrong. The entry stays
  # optional so an unrelated reviewed render (legacy contour tooling) does not depend on the file;
  # a worker started without it still fails closed in loadWorkerConfig on the missing runtime keys.
  env_file:
    - path: ${WORKER_RUNTIME_ENV_FILE:-/opt/phub/staging.worker.env}
      required: false
    - path: ${RUNTIME_AUTH_ENV_FILE:-/opt/phub/staging.auth.env}
      required: false
    - path: ${RUNTIME_OVERRIDE_ENV_FILE:-/opt/phub/staging.override.env}
      required: false
    - path: ${RUNTIME_GAMES_ENV_FILE:-/opt/phub/staging.games.env}
      required: false
    - path: ${RUNTIME_CHAT_PUSH_FOUNDATION_ENV_FILE:-/opt/phub/staging.chat-push-foundation.env}
      required: false

x-object-storage: &object-storage
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
  S3_REGION: us-east-1
  S3_BUCKET: phub-media
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  S3_FORCE_PATH_STYLE: 'true'
  # Staging buckets are infrastructure-owned and must pass the private/versioned/CORS/lifecycle
  # preflight before an application candidate starts. Runtime auto-provisioning would bypass it.
  S3_AUTO_CREATE_BUCKET: 'false'

services:
  web:
    <<: *runtime
    env_file: []
    image: ${REGISTRY}/phub-web@${WEB_IMAGE_DIGEST}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    <<: *runtime
    env_file:
      - path: ${RUNTIME_ENV_FILE:-/etc/phub/staging.env}
      - path: ${RUNTIME_AUTH_ENV_FILE:-/opt/phub/staging.auth.env}
        required: false
      - path: ${RUNTIME_OVERRIDE_ENV_FILE:-/opt/phub/staging.override.env}
        required: false
      - path: ${RUNTIME_GAMES_ENV_FILE:-/opt/phub/staging.games.env}
        required: false
      - path: ${RUNTIME_COMMUNITIES_ENV_FILE:-/opt/phub/staging.communities.env}
        required: false
      - path: ${RUNTIME_CHAT_PUSH_FOUNDATION_ENV_FILE:-/opt/phub/staging.chat-push-foundation.env}
        required: false
    image: ${REGISTRY}/phub-api@${API_IMAGE_DIGEST}
    environment:
      <<: *object-storage
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  realtime:
    <<: *realtime-runtime
    image: ${REGISTRY}/phub-realtime@${REALTIME_IMAGE_DIGEST}
    ports:
      - '127.0.0.1:3001:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *worker-runtime
    image: ${REGISTRY}/phub-worker@${WORKER_IMAGE_DIGEST}
    environment:
      <<: *object-storage
    networks:
      - application
      - cup-showcase

  migrator:
    <<: *runtime
    env_file: []
    environment:
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:-}
    image: ${REGISTRY}/phub-migrator@${MIGRATOR_IMAGE_DIGEST}
    restart: 'no'
    profiles: [migration]

networks:
  application:
    external: true
    name: phub-private
  cup-showcase:
    external: true
    name: phab-showcase_default
