  /{tenantKey}/profile/photo:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
    post:
      tags: [profiles]
      operationId: synchronizeUserProfilePhoto
      summary: Normalize and store a client-assisted profile photo
      description: |
        Accepts only bounded image bytes already fetched by the authenticated browser from the
        current direct Viva profile response. The provider URL and credentials are never accepted
        or persisted. PadlHub validates the image, stores an immutable WebP object and returns its
        stable first-party delivery URL.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: X-Profile-Photo-Grant
          in: header
          required: true
          description: Short-lived tenant-, user-, and PadlHub-session-bound grant issued with the direct Viva access token.
          schema:
            type: string
            minLength: 20
            maxLength: 4096
      requestBody:
        required: true
        content:
          image/avif:
            schema: { type: string, contentEncoding: binary }
          image/jpeg:
            schema: { type: string, contentEncoding: binary }
          image/png:
            schema: { type: string, contentEncoding: binary }
          image/webp:
            schema: { type: string, contentEncoding: binary }
      responses:
        '200':
          description: An identical current photo was replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePhotoSyncResult'
        '201':
          description: The normalized photo was stored and activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePhotoSyncResult'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '409':
          $ref: '#/components/responses/CommandConflict'
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '413':
          description: Image body exceeds the configured profile-photo limit.
        '415':
          description: Unsupported image media type.
        '422':
          description: Image bytes are invalid or unsafe to normalize.
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
    delete:
      tags: [profiles]
      operationId: removeUserProfilePhoto
      summary: Remove the normalized profile photo after an authoritative Viva null observation
      description: |
        Consumes the same short-lived user-bound observation grant as photo synchronization.
        The active stable mapping is removed atomically, the old immutable object is queued for
        bounded garbage collection, and the command is idempotent.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: X-Profile-Photo-Grant
          in: header
          required: true
          description: Short-lived tenant-, user-, and PadlHub-session-bound grant issued with the direct Viva access token.
          schema:
            type: string
            minLength: 20
            maxLength: 4096
      responses:
        '200':
          description: The removal command was replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePhotoRemoveResult'
        '201':
          description: The current mapping was removed or its absence was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePhotoRemoveResult'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '409':
          $ref: '#/components/responses/CommandConflict'
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
