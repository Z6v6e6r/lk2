      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        publicKey:
          type: string
          minLength: 20
          maxLength: 256
          description: Public URL-safe VAPID key. No private provider credential is exposed.
        reason:
          type: string
          enum:
            [
              GLOBAL_GATE_DISABLED,
              TENANT_GATE_DISABLED,
              PROVIDER_NOT_CONFIGURED,
              RUNTIME_UNAVAILABLE,
            ]
    WebPushEndpointRegistration:
      type: object
      additionalProperties: false
      required: [installationId, subscription]
      properties:
        installationId:
          type: string
          format: uuid
        subscription:
          $ref: '#/components/schemas/WebPushSubscription'
    WebPushSubscription:
      type: object
      additionalProperties: false
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: |
            Credential-free HTTPS capability URL on port 443. Its exact origin must be present in
            the server-managed Web Push endpoint allowlist; fragments are rejected.
        expirationTime:
          type: [integer, 'null']
          minimum: 0
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
              minLength: 40
              maxLength: 256
              pattern: '^[A-Za-z0-9_-]+={0,2}$'
            auth:
              type: string
              minLength: 16
              maxLength: 256
              pattern: '^[A-Za-z0-9_-]+={0,2}$'
