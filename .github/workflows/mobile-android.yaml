name: Android native verification

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Unsigned native verification; signed release remains unavailable
        type: choice
        options: [unsigned-verification, signed-release]
        default: unsigned-verification
  pull_request:
    paths:
      - '.github/workflows/mobile-android.yaml'
      - 'scripts/android-native-build.test.ts'
      - 'apps/mobile/**'
      - 'apps/web/**'
      - 'packages/api-sdk/**'
      - 'packages/api-contracts/**'
      - 'packages/auth/**'
      - 'packages/viva-client-adapter/**'
      - 'packages/ui/**'
      - 'contracts/openapi/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
  push:
    tags: ['mobile-v*']

permissions:
  contents: read

jobs:
  unsigned-native:
    name: Android unsigned build and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_PHUB_API_BASE_URL: ''
      VITE_PHUB_TENANT_KEY: ''
      PADLHUB_IOS_PUSH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Verify native build boundaries
        run: npx vitest run scripts/android-native-build.test.ts --maxWorkers=2
      - name: Build Web assets and synchronize Android only
        run: |
          test ! -e apps/mobile/android/app/google-services.json
          npm run contracts:generate
          npm run build -w @phub/mobile
          npm exec -w @phub/mobile -- cap sync android
      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Compile native application and run actual JVM tests without signing
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleRelease
      - name: Require complete native test reports and an unsigned application
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('apps/mobile/android/app/build/test-results/testDebugUnitTest')
          expected = {
              'ru.padlhub.app.AndroidGameJoinSessionTest': 7,
              'ru.padlhub.app.AndroidTournamentChatSessionTest': 6,
              'ru.padlhub.app.AndroidTrainingRegistrationSessionTest': 5,
              'ru.padlhub.app.AndroidYandexLoginCallbackUrlTest': 3,
              'com.getcapacitor.myapp.ExampleUnitTest': 1,
          }
          seen, total = set(), 0
          for path in root.glob('TEST-*.xml'):
              suite = ET.parse(path).getroot()
              count = int(suite.attrib['tests'])
              assert count >= expected.get(suite.attrib['name'], 1), path
              cases = suite.findall('testcase')
              assert len(cases) == count and len({case.attrib['name'] for case in cases}) == count, path
              assert all(not any(case.find(key) is not None for key in ('failure', 'error', 'skipped')) for case in cases), path
              assert all(int(suite.attrib.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped')), path
              seen.add(suite.attrib['name'])
              total += count
          assert set(expected) <= seen and total >= 22, (seen, total)
          print(f'ANDROID_NATIVE_JVM: {total} passed, zero failures/errors/skips')
          PYTEST
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > /tmp/android-apk-badging.txt
          grep -q "package: name='ru.padlhub.app'" /tmp/android-apk-badging.txt
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk" > /tmp/android-apk-signature.txt 2>&1; then
            echo '::error::Unexpected signed application'
            exit 1
          fi
          grep -q 'Missing META-INF/MANIFEST.MF' /tmp/android-apk-signature.txt
          sha256sum "$apk" > apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          {
            echo '### Android unsigned native verification'
            echo 'Gradle JVM tests and an unsigned native release APK completed; no device execution.'
            echo 'No signing material, Firebase configuration, provider session or store upload was used.'
            echo 'Device lifecycle, FCM delivery and signed store acceptance remain separate.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain unsigned build and native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-unsigned-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk.sha256
            apps/mobile/android/app/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: error
          retention-days: 14

  signed-release-gate:
    name: Signed Android release unavailable
    needs: unsigned-native
    if: ${{ github.event_name == 'push' || inputs.operation == 'signed-release' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '::error::ANDROID_SIGNED_RELEASE_NOT_IMPLEMENTED: unsigned verification is not signing or store acceptance.'
          exit 1
