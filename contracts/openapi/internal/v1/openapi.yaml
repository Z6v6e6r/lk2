openapi: 3.1.0
info:
  title: PadlHub Internal API
  version: 1.0.0
  description: Service-only boundary; never exposed to web, mobile, Tilda or CUP clients.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://internal.padlhub.ru/internal/api/v1
security:
  - PadlHubInternalJwt: []
tags:
  - name: games
    description: Service-only Games commands and outbox diagnostics.
  - name: player-levels
    description: Service-only authoritative CUP level projection ingestion.
  - name: participation
    description: Service-only participation authorization and writer acknowledgement.
paths:
  /{tenantKey}/game-commands:
    $ref: ./games.yaml#/paths/~1{tenantKey}~1game-commands
  /{tenantKey}/legacy-games/{legacyGameId}/roster-commands:
    $ref: ./games.yaml#/paths/~1{tenantKey}~1legacy-games~1{legacyGameId}~1roster-commands
  /{tenantKey}/game-events/{eventId}:
    $ref: ./games.yaml#/paths/~1{tenantKey}~1game-events~1{eventId}
  /{tenantKey}/player-level-projections:
    $ref: ./player-levels.yaml#/paths/~1{tenantKey}~1player-level-projections
  /{tenantKey}/participation-commands:
    $ref: ./participation-commands.yaml#/paths/~1{tenantKey}~1participation-commands
  /{tenantKey}/participation-commands/{commandId}:
    $ref: ./participation-commands.yaml#/paths/~1{tenantKey}~1participation-commands~1{commandId}
  /{tenantKey}/participation-commands/{commandId}/acknowledgements:
    $ref: ./participation-commands.yaml#/paths/~1{tenantKey}~1participation-commands~1{commandId}~1acknowledgements
components:
  securitySchemes:
    PadlHubInternalJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived service JWT with the dedicated phub-internal audience.
    LegacyLkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Original signed legacy LK user token; verified server-side by the CUP identity verifier.
    LegacyRosterIntegrationToken:
      type: apiKey
      in: header
      name: X-Phub-Legacy-Roster-Token
      description: Server-only Node-RED to PadlHub bridge credential; never exposed to a browser.
    CupPlayerLevelProjectionToken:
      type: apiKey
      in: header
      name: X-Cup-Player-Level-Token
      description: Server-only CUP to PadlHub projection credential; never exposed to a browser.
    ParticipationCommandToken:
      type: apiKey
      in: header
      name: X-Phub-Participation-Token
      description: Exact-tenant server credential for a trusted roster or booking writer.
