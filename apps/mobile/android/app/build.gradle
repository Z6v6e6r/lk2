apply plugin: 'com.android.application'

// Release signing is fail closed and identity anchored: a release build never falls back to debug
// signing, never produces an unsigned artifact and never accepts an unpinned key. Inputs come from
// the environment (CI) or the gitignored apps/mobile/android/keystore.properties. Every release
// packaging/signing task additionally requires ANDROID_RELEASE_CERT_SHA256, the owner-approved
// certificate fingerprint captured outside this build. See docs/runbooks/android-release-signing.md.
def releaseSigningPropertiesFile = rootProject.file('keystore.properties')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

def releaseSigningValue = { String environmentName, String propertyName ->
    def fromEnvironment = System.getenv(environmentName)
    if (fromEnvironment != null && !fromEnvironment.trim().isEmpty()) {
        return fromEnvironment.trim()
    }
    def fromPropertiesFile = releaseSigningProperties.getProperty(propertyName)
    if (fromPropertiesFile != null && !fromPropertiesFile.trim().isEmpty()) {
        return fromPropertiesFile.trim()
    }
    return null
}

def releaseSigningSources = [
    storeFile: ['ANDROID_KEYSTORE_PATH', 'storeFile'],
    storePassword: ['ANDROID_KEYSTORE_PASSWORD', 'storePassword'],
    keyAlias: ['ANDROID_KEY_ALIAS', 'keyAlias'],
    keyPassword: ['ANDROID_KEY_PASSWORD', 'keyPassword'],
]
def releaseSigningValues = [:]
def missingReleaseSigningInputs = []
releaseSigningSources.each { name, sources ->
    def value = releaseSigningValue(sources[0], sources[1])
    releaseSigningValues[name] = value
    if (value == null) {
        missingReleaseSigningInputs << name + ' (' + sources[0] + ')'
    }
}
def configuredReleaseKeystore = releaseSigningValues.storeFile == null
    ? null
    : rootProject.file(releaseSigningValues.storeFile)
def releaseSigningProblem = null
if (!missingReleaseSigningInputs.isEmpty()) {
    releaseSigningProblem = "Android release signing is not configured: missing " +
        missingReleaseSigningInputs.sort().join(', ') + "."
} else if (configuredReleaseKeystore == null || !configuredReleaseKeystore.isFile()) {
    releaseSigningProblem = "Android release signing is not configured: the keystore file " +
        configuredReleaseKeystore + " does not exist."
}
if (releaseSigningProblem != null) {
    releaseSigningProblem += " Provide ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD," +
        " ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as environment variables or create the" +
        " gitignored apps/mobile/android/keystore.properties. Refusing to build an unsigned or" +
        " debug-signed release. See docs/runbooks/android-release-signing.md."
}

// The Android debug certificate is never valid release material, even if someone pins its
// fingerprint as the anchor. The portable control is the CN=Android Debug subject check below; this
// constant is only an extra local-defence check for this workstation's SDK debug certificate (debug
// certificates are generated per machine) and must not be read as a universal debug fingerprint.
def androidDebugCertificateSha256 = '2207BD6EB90AEFE44DBD043A9CFACD17541313BEC3A5958D051BE807E00BEF93'
def normalizeCertificateSha256 = { String value ->
    if (value == null) {
        return null
    }
    def normalized = value.replaceAll('[:\\s]', '').toUpperCase()
    return normalized.matches('[0-9A-F]{64}') ? normalized : null
}
def certificateFingerprint = { byte[] encodedCertificate ->
    def digest = java.security.MessageDigest.getInstance('SHA-256').digest(encodedCertificate)
    return digest.collect { digestByte -> String.format('%02X', digestByte) }.join(':')
}
def observedReleaseCertificate = {
    def configuredKeyStoreTypes = [java.security.KeyStore.getDefaultType(), 'PKCS12', 'JKS']
    for (keyStoreType in configuredKeyStoreTypes) {
        try {
            def releaseKeyStore = java.security.KeyStore.getInstance(keyStoreType)
            configuredReleaseKeystore.withInputStream { stream ->
                releaseKeyStore.load(stream, releaseSigningValues.storePassword.toCharArray())
            }
            def releaseCertificate = releaseKeyStore.getCertificate(releaseSigningValues.keyAlias)
            if (releaseCertificate != null) {
                return releaseCertificate
            }
        } catch (Exception ignored) {
            // Try the next keystore type; the caller reports the final failure.
        }
    }
    return null
}
def releaseIdentityProblem = {
    if (releaseSigningProblem != null) {
        return releaseSigningProblem
    }
    def expectedCertificateSha256 = normalizeCertificateSha256(System.getenv('ANDROID_RELEASE_CERT_SHA256'))
    if (expectedCertificateSha256 == null) {
        return "Android release signing is missing the approved release certificate anchor" +
            " ANDROID_RELEASE_CERT_SHA256 (the owner-approved SHA-256 fingerprint of the release" +
            " certificate, captured outside this build). Refusing to build a release with an" +
            " unpinned key. See docs/runbooks/android-release-signing.md."
    }
    def releaseCertificate = observedReleaseCertificate()
    if (releaseCertificate == null) {
        return "Android release signing could not read the certificate for alias" +
            " '${releaseSigningValues.keyAlias}' from the release keystore. Refusing to build a" +
            " release. See docs/runbooks/android-release-signing.md."
    }
    def observedCertificateSha256 = certificateFingerprint(releaseCertificate.getEncoded())
    if (normalizeCertificateSha256(observedCertificateSha256) == androidDebugCertificateSha256 ||
        releaseCertificate.getSubjectDN().toString().contains('CN=Android Debug')) {
        return "Android release signing rejects the Android debug certificate; it is never valid" +
            " release signing material. Refusing to build a release. See" +
            " docs/runbooks/android-release-signing.md."
    }
    if (normalizeCertificateSha256(observedCertificateSha256) != expectedCertificateSha256) {
        return "Android release signing key mismatch: ANDROID_RELEASE_CERT_SHA256 expects" +
            " '${expectedCertificateSha256}' but the keystore certificate is" +
            " '${observedCertificateSha256}'. Refusing to build a release with a key that is not" +
            " the owner-approved release key. See docs/runbooks/android-release-signing.md."
    }
    return null
}

def requiresReleaseSigning = { String taskName ->
    return taskName == 'build' ||
        taskName.matches('(?i)^(assemble|bundle|package|sign|validateSigning).*release.*$')
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.allTasks.any { task -> requiresReleaseSigning(task.name) }) {
        def releaseProblem = releaseIdentityProblem()
        if (releaseProblem != null) {
            throw new GradleException(releaseProblem)
        }
    }
}

android {
    namespace = "ru.padlhub.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ru.padlhub.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 14
        versionName "1.13"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (releaseSigningProblem == null) {
            release {
                storeFile configuredReleaseKeystore
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningProblem == null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def appVersionCode = android.defaultConfig.versionCode
def appVersionName = android.defaultConfig.versionName

// Release metadata source for .github/workflows/mobile-android.yaml. It never reads signing material.
tasks.register('printAppVersion') {
    group = 'help'
    description = 'Prints versionCode and versionName for signed release build metadata.'
    doLast {
        println "versionCode=${appVersionCode}"
        println "versionName=${appVersionName}"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.0.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
