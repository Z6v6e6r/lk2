openapi: 3.1.0
info:
  title: PadlHub Internal API
  version: 1.0.0
  description: Service-only boundary; never exposed to web, mobile, Tilda or CUP clients.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://internal.padlhub.ru/internal/api/v1
security:
  - PadlHubInternalJwt: []
tags:
  - name: games
    description: Service-only Games commands and outbox diagnostics.
paths:
  /{tenantKey}/game-commands:
    $ref: ./games.yaml#/paths/~1{tenantKey}~1game-commands
  /{tenantKey}/legacy-games/{legacyGameId}/roster-commands:
    $ref: ./games.yaml#/paths/~1{tenantKey}~1legacy-games~1{legacyGameId}~1roster-commands
  /{tenantKey}/game-events/{eventId}:
    $ref: ./games.yaml#/paths/~1{tenantKey}~1game-events~1{eventId}
components:
  securitySchemes:
    PadlHubInternalJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived service JWT with the dedicated phub-internal audience.
    LegacyLkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Original signed legacy LK user token; verified server-side by the CUP identity verifier.
    LegacyRosterIntegrationToken:
      type: apiKey
      in: header
      name: X-Phub-Legacy-Roster-Token
      description: Server-only Node-RED to PadlHub bridge credential; never exposed to a browser.
