apply plugin: 'com.android.application'

// Explicit local signing inputs only. Absent inputs preserve the unsigned verification lane.
// No passwords are accepted as Gradle command-line properties or written into this checkout.
def offlineSigning = null
def offlineSigningPath = System.getenv('PHUB_ANDROID_SIGNING_INPUTS')
if (offlineSigningPath != null) {
    def privateFile = { String value ->
        def file = new File(value)
        if (!file.isAbsolute() || !file.isFile()) throw new GradleException('SIGNING_PRIVATE_FILE_REQUIRED')
        def path = file.toPath()
        for (def current = path; current != null; current = current.getParent()) {
            if (java.nio.file.Files.isSymbolicLink(current)) throw new GradleException('SIGNING_SYMLINK_REJECTED')
        }
        def permissions = java.nio.file.Files.getPosixFilePermissions(path)
        if (permissions != java.nio.file.attribute.PosixFilePermissions.fromString('rw-------') ||
            !java.nio.file.Files.getOwner(path).equals(java.nio.file.Files.getOwner(file.parentFile.toPath())) ||
            java.nio.file.Files.getPosixFilePermissions(file.parentFile.toPath()) !=
                java.nio.file.attribute.PosixFilePermissions.fromString('rwx------')) {
            throw new GradleException('SIGNING_PRIVATE_FILE_REQUIRED')
        }
        return file
    }
    offlineSigning = new groovy.json.JsonSlurper().parse(privateFile(offlineSigningPath))
    if (offlineSigning.schema != 'PHUB_ANDROID_OFFLINE_SIGNING_V1' ||
        offlineSigning.applicationId != 'ru.padlhub.app' ||
        !(offlineSigning.versionCode instanceof Integer) || offlineSigning.versionCode <= 0 ||
        !(offlineSigning.versionName ==~ /[0-9]+(\.[0-9]+){1,3}/)) {
        throw new GradleException('SIGNING_CONFIG_REJECTED')
    }
    offlineSigning.keystoreFile = privateFile(offlineSigning.keystore)
    offlineSigning.storePasswordValue = privateFile(offlineSigning.storePasswordFile).getText('UTF-8').replaceFirst(/\r?\n\z/, '')
    offlineSigning.keyPasswordValue = privateFile(offlineSigning.keyPasswordFile).getText('UTF-8').replaceFirst(/\r?\n\z/, '')
    if (!offlineSigning.storePasswordValue || !offlineSigning.keyPasswordValue ||
        offlineSigning.storePasswordValue.contains('\n') || offlineSigning.storePasswordValue.contains('\r') ||
        offlineSigning.keyPasswordValue.contains('\n') || offlineSigning.keyPasswordValue.contains('\r')) {
        throw new GradleException('SIGNING_PASSWORD_REQUIRED')
    }
}

android {
    namespace = "ru.padlhub.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ru.padlhub.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 14
        versionName "1.13"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (offlineSigning != null) {
        defaultConfig {
            versionCode offlineSigning.versionCode
            versionName offlineSigning.versionName
        }
        signingConfigs {
            offlineOwner {
                storeFile offlineSigning.keystoreFile
                storePassword offlineSigning.storePasswordValue
                keyAlias offlineSigning.alias
                keyPassword offlineSigning.keyPasswordValue
            }
        }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            if (offlineSigning != null) signingConfig signingConfigs.offlineOwner
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.0.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // JVM session tests need JSON behavior, not the Android SDK throwing stubs.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
