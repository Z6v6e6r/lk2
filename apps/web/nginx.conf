server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    # iOS reads this file to decide whether the site can be installed on the Home Screen, which is the
    # only context where it allows Web Push. nginx ships no MIME mapping for `.webmanifest`, so it is
    # declared here, and the file must not be pinned in a browser cache because an installed app has to
    # pick up a changed manifest on its next launch.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The service worker carries the notification behaviour itself, so it is revalidated on every launch
    # instead of waiting out a heuristic cache lifetime.
    location = /phub-notification-sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite fingerprints every build artifact under /assets, so those exact bytes can be cached for a
    # year without a revalidation.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The shell and the remaining root-level files are revalidated on every navigation. Without an
    # explicit policy a browser may reuse a heuristic-cached index.html after a release, which keeps
    # the SPA on the previous bundle until the person reloads the page.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
