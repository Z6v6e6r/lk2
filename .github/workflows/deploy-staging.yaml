          expected_checksum="${checksum_line%% *}"
          ssh "phub-deploy@$HOST" sh -s -- "$STAGING_RELEASE_BACKUP_DIR" <<'REMOTE'
            set -eu
            backup_dir="$1"
            if [ -f "$backup_dir/staging.override.env" ]; then
              cmp "$backup_dir/staging.override.env" /opt/phub/staging.override.env
            else
