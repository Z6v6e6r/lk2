      - name: Pull, migrate and deploy the same image digests
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "phub-deploy@$HOST" '
            set -eu
            deployment_profile="${{ inputs.deployment_profile }}"
            trap "docker logout ghcr.io >/dev/null 2>&1 || true" EXIT
            docker login ghcr.io --username "${{ github.actor }}" --password-stdin
            cd /opt/phub
            if [ "$deployment_profile" != COMMUNITIES_LEGACY_READ_ONLY ]; then
              rm -f /opt/phub/staging.communities.env
            fi
            compose() {
              docker compose --env-file infrastructure.env --env-file release.env "$@"
            }
            infrastructure() {
              docker compose --env-file infrastructure.env -f compose.infrastructure.yaml "$@"
            }
            available_kb="$(df -Pk / | tail -1 | tr -s " " | cut -d " " -f 4)"
            if [ "$available_kb" -lt 8388608 ]; then
              echo "Nano has less than 8 GiB free; pruning only unused Docker images."
              docker image prune --all --force
              available_kb="$(df -Pk / | tail -1 | tr -s " " | cut -d " " -f 4)"
            fi
            if [ "$available_kb" -lt 4194304 ]; then
              echo "Nano has less than 4 GiB free after safe image pruning."
              df -h /
              docker system df
              exit 1
            fi
            compose pull

            runtime_env=/etc/phub/staging.env
            migrator_env=/etc/phub/staging.migrator.env
            test -r "$runtime_env"
            test -r "$migrator_env"
            test "$(stat -c %a "$migrator_env")" = 600
            test ! "$runtime_env" -ef "$migrator_env"
            awk '\''
              /^[[:space:]]*($|#)/ { next }
              /^DATABASE_URL=/ { next }
              { exit 1 }
            '\'' "$migrator_env"
            test "$(awk -F= '\''$1 == "DATABASE_URL" { count += 1 } END { print count + 0 }'\'' "$runtime_env")" -eq 1
            test "$(awk -F= '\''$1 == "DATABASE_URL" { count += 1 } END { print count + 0 }'\'' "$migrator_env")" -eq 1
            runtime_database_url="$(sed -n '\''s/^DATABASE_URL=//p'\'' "$runtime_env")"
            migrator_database_url="$(sed -n '\''s/^DATABASE_URL=//p'\'' "$migrator_env")"
            case "$migrator_database_url" in
              postgresql://*|postgres://*) ;;
              *) exit 64 ;;
            esac
            test "$runtime_database_url" != "$migrator_database_url"
            DATABASE_ROLE_BOUNDARY_PHASE=pre \
            RUNTIME_DATABASE_URL="$runtime_database_url" \
            MIGRATOR_DATABASE_URL="$migrator_database_url" \
              compose --profile migration run --rm --no-deps -T \
                -e RUNTIME_DATABASE_URL -e MIGRATOR_DATABASE_URL -e DATABASE_ROLE_BOUNDARY_PHASE \
                --entrypoint node migrator apps/migrator/dist/verify-role-boundary.js

            backup_dir=/opt/phub/backups
            backup_timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup_path="$backup_dir/postgres-pre-${{ github.sha }}-$backup_timestamp.dump"
            umask 077
            if [ ! -e "$backup_dir" ] && [ ! -L "$backup_dir" ]; then
              mkdir -m 700 "$backup_dir"
            fi
            [ -d "$backup_dir" ]
            [ ! -L "$backup_dir" ]
            [ "$(stat -c %u "$backup_dir")" = "$(id -u)" ]
            chmod 700 "$backup_dir"
            [ "$(stat -c %a "$backup_dir")" = 700 ]
            [ ! -e "$backup_path" ]
            [ ! -L "$backup_path" ]
            PHUB_POSTGRES_STORAGE_PATH=/var/lib/docker \
              sh /opt/phub/verify-postgres-backup-restore.sh \
                - \
                "phub_restore_${{ github.run_id }}_${{ github.run_attempt }}" \
                VERIFY_STAGING_POSTGRES_CAPACITY
            backup_tmp="$(mktemp "$backup_dir/.postgres-pre-${{ github.sha }}-$backup_timestamp.XXXXXX.dump")"
            trap "rm -f \"$backup_tmp\"; docker logout ghcr.io >/dev/null 2>&1 || true" EXIT
            infrastructure exec -T postgres sh -ec \
              "pg_dump -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" --format=custom --no-owner --no-acl" \
              > "$backup_tmp"
            test -s "$backup_tmp"
            chmod 600 "$backup_tmp"
            [ "$(stat -c %a "$backup_tmp")" = 600 ]
            infrastructure exec -T postgres pg_restore --list < "$backup_tmp" >/dev/null
            PHUB_POSTGRES_STORAGE_PATH=/var/lib/docker \
              sh /opt/phub/verify-postgres-backup-restore.sh \
                "$backup_tmp" \
                "phub_restore_${{ github.run_id }}_${{ github.run_attempt }}" \
                VERIFY_STAGING_POSTGRES_BACKUP

            mv "$backup_tmp" "$backup_path"
            chmod 600 "$backup_path"
            [ "$(stat -c %a "$backup_path")" = 600 ]
            echo "Restore-verified staging PostgreSQL backup: $backup_path"

            MIGRATOR_DATABASE_URL="$migrator_database_url" \
              compose --profile migration run --rm migrator
            DATABASE_ROLE_BOUNDARY_PHASE=post \
            RUNTIME_DATABASE_URL="$runtime_database_url" \
            MIGRATOR_DATABASE_URL="$migrator_database_url" \
              compose --profile migration run --rm --no-deps -T \
                -e RUNTIME_DATABASE_URL -e MIGRATOR_DATABASE_URL -e DATABASE_ROLE_BOUNDARY_PHASE \
                --entrypoint node migrator apps/migrator/dist/verify-role-boundary.js
            latest_migration="$(sed -n s/^LATEST_MIGRATION=//p release.env)"
            test -n "$latest_migration"
            applied_migrations="$(infrastructure exec -T postgres sh -ec \
              "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -Atc \"select filename from public.schema_migrations\"" \
            )"
            printf "%s\n" "$applied_migrations" | grep -Fx "$latest_migration"

            service_is_healthy() {
              container_id="$(compose ps -q "$1")"
              [ -n "$container_id" ] &&
                [ "$(docker inspect --format "{{.State.Health.Status}}" "$container_id")" = "healthy" ]
            }

            wait_for_service() {
              service="$1"
              attempt=0
              while [ "$attempt" -lt 36 ]; do
                if service_is_healthy "$service"; then
                  return 0
                fi
                attempt=$((attempt + 1))
                sleep 5
              done
              compose ps -a
              compose logs --no-color --tail=160 "$service"
              return 1
            }

            if [ "$deployment_profile" = COMMUNITIES_LEGACY_READ_ONLY ]; then
              compose up -d --remove-orphans web api
              wait_for_service api
              compose stop worker realtime
              [ -z "$(compose ps --status running -q worker)" ]
              [ -z "$(compose ps --status running -q realtime)" ]
            else
              # Media cutovers publish stable first-party URLs. Start the API route first so a
              # worker can never publish a URL that the currently serving API cannot resolve.
              compose up -d --remove-orphans web api
              wait_for_service api
              compose up -d --remove-orphans worker realtime
            fi
            # The ingress configuration is bind-mounted. Recreate this one
            # stateless container so it loads the newly copied configuration.
            docker compose --env-file infrastructure.env -f compose.infrastructure.yaml up -d --force-recreate nginx

            ready=0
            attempt=0
            while [ "$attempt" -lt 36 ]; do
              if [ "$deployment_profile" = COMMUNITIES_LEGACY_READ_ONLY ] \
                && service_is_healthy api; then
                ready=1
                break
              fi
              if [ "$deployment_profile" != COMMUNITIES_LEGACY_READ_ONLY ] \
                && service_is_healthy api \
                && service_is_healthy realtime \
                && service_is_healthy worker; then
                ready=1
                break
              fi
              attempt=$((attempt + 1))
              sleep 5
            done
            if [ "$ready" -ne 1 ]; then
              compose ps -a
              compose logs --no-color --tail=160 api worker realtime
              exit 1
            fi
            if [ "$deployment_profile" != COMMUNITIES_LEGACY_READ_ONLY ]; then
              compose exec -T worker node -e "
                fetch(\"http://127.0.0.1:3002/health/ready\", { signal: AbortSignal.timeout(5000) })
                  .then(async (response) => {
                    const body = await response.json();
                    if (!response.ok || body.status !== \"ready\") process.exit(1);
                  })
                  .catch(() => process.exit(1));
              "
            fi
          '
      - name: Promote canonical Nano TLS ingress
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
        run: |
          ssh "phub-deploy@$HOST" '
            set -eu
            deployment_profile="${{ inputs.deployment_profile }}"
            cd /opt/phub/tls-ingress
            backup_dir=/opt/phub/backups
            backup_timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup_path="$backup_dir/Caddyfile-pre-${{ github.sha }}-$backup_timestamp"
            mkdir -p "$backup_dir"
            test -s Caddyfile.next
            cp Caddyfile "$backup_path"
            mv Caddyfile.next Caddyfile

            rollback_caddy() {
              cp "$backup_path" Caddyfile
              docker compose up -d --force-recreate caddy >/dev/null 2>&1 || true
            }

            if ! docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile; then
              rollback_caddy
              exit 1
            fi
            if ! docker compose up -d --force-recreate caddy; then
              rollback_caddy
              exit 1
            fi

            probe_canonical_ready() {
              curl --fail --silent \
                --connect-timeout 2 \
                --max-time 5 \
                --resolve lk.nano.padlhub.su:443:127.0.0.1 \
                "$1" >/dev/null
            }

            ingress_ready=0
            attempt=0
            while [ "$attempt" -lt 15 ]; do
              if [ "$deployment_profile" = COMMUNITIES_LEGACY_READ_ONLY ] \
                && probe_canonical_ready https://lk.nano.padlhub.su/health/ready; then
                ingress_ready=1
                break
              fi
              if [ "$deployment_profile" != COMMUNITIES_LEGACY_READ_ONLY ] \
                && probe_canonical_ready https://lk.nano.padlhub.su/health/ready \
                && probe_canonical_ready https://lk.nano.padlhub.su/realtime/health/ready; then
                ingress_ready=1
                break
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
            if [ "$ingress_ready" -ne 1 ]; then
              curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
                --resolve lk.nano.padlhub.su:443:127.0.0.1 \
                https://lk.nano.padlhub.su/health/ready >/dev/null || true
              if [ "$deployment_profile" != COMMUNITIES_LEGACY_READ_ONLY ]; then
                curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
                  --resolve lk.nano.padlhub.su:443:127.0.0.1 \
                  https://lk.nano.padlhub.su/realtime/health/ready >/dev/null || true
              fi
              rollback_caddy
              exit 1
            fi
            location="$(curl --silent --show-error --output /dev/null --write-out "%{redirect_url}" \
              -H "Host: 185.155.18.146" http://127.0.0.1/games)"
            if test "$location" != "https://lk.nano.padlhub.su/games"; then
              rollback_caddy
              exit 1
            fi
            echo "Verified TLS ingress backup: $backup_path"
          '
      - name: Attest community-logo flags in every API and worker runtime
