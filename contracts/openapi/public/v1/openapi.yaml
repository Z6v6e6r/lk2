    CreateGiftCertificateOrderRequest:
      type: object
      additionalProperties: false
      required:
        - catalogId
        - designId
        - denominationId
        - buyerEmail
        - recipientName
        - recipientEmail
        - message
        - deliveryMode
        - scheduledFor
        - termsAccepted
      properties:
        catalogId:
          type: string
          format: uuid
        designId:
          type: string
          format: uuid
        denominationId:
          type: string
          format: uuid
        buyerEmail:
          type: string
          format: email
          maxLength: 320
        recipientName:
          type: string
          minLength: 1
          maxLength: 120
        recipientEmail:
          type: string
          format: email
          maxLength: 320
        message:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
        deliveryMode:
          type: string
          enum: [IMMEDIATE, SCHEDULED]
        scheduledFor:
          type: [string, 'null']
          format: date-time
        termsAccepted:
          type: boolean
          const: true
    GiftCertificateOrder:
      type: object
      additionalProperties: false
      required:
        - id
        - orderNumber
        - salesChannel
        - status
        - revision
        - catalog
        - design
        - amountMinor
        - currency
        - policy
        - buyerEmailMasked
        - recipientName
        - recipientEmailMasked
        - deliveryMode
        - scheduledFor
        - createdAt
        - paidAt
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
          pattern: '^GC-[A-Z0-9]{12}$'
        salesChannel:
          type: string
          enum: [PUBLIC_WEB, LK]
        status:
          type: string
          enum: [PAYMENT_PENDING, PAID, PAYMENT_FAILED, CANCELLED]
        revision:
          type: integer
          minimum: 1
        catalog:
          type: object
          additionalProperties: false
          required: [id, catalogNumber]
          properties:
            id:
              type: string
              format: uuid
            catalogNumber:
              type: integer
              minimum: 1
        design:
          type: object
          additionalProperties: false
          required: [id, key, title, imageUrl, alt]
          properties:
            id:
              type: string
              format: uuid
            key:
              type: string
            title:
              type: string
            imageUrl:
              type: string
            alt:
              type: string
        amountMinor:
          type: integer
          minimum: 10000
          maximum: 100000000
        currency:
          type: string
          const: RUB
        policy:
          $ref: '#/components/schemas/GiftCertificatePolicy'
        buyerEmailMasked:
          type: string
        recipientName:
          type: string
        recipientEmailMasked:
          type: string
        deliveryMode:
          type: string
          enum: [IMMEDIATE, SCHEDULED]
        scheduledFor:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        paidAt:
          type: [string, 'null']
          format: date-time
        fulfillment:
          oneOf:
            - $ref: '#/components/schemas/GiftCertificateFulfillment'
            - type: 'null'
    GiftCertificateFulfillment:
      type: object
      additionalProperties: false
      required: [certificate, delivery]
      properties:
        certificate:
          type: object
          additionalProperties: false
          required:
            - id
            - certificateNumber
            - status
            - amountMinor
            - currency
            - issuedAt
            - validFrom
            - validUntil
            - activationDeadlineAt
            - downloadReady
          properties:
            id:
              type: string
              format: uuid
            certificateNumber:
              type: string
              pattern: '^PH-GC-[A-Z0-9]{16}$'
            status:
              type: string
              enum: [PREPARING, ISSUED, VOIDED]
            amountMinor:
              type: integer
              minimum: 10000
              maximum: 100000000
            currency:
              type: string
              const: RUB
            issuedAt:
              type: [string, 'null']
              format: date-time
            validFrom:
              type: [string, 'null']
              format: date-time
            validUntil:
              type: [string, 'null']
              format: date-time
            activationDeadlineAt:
              type: [string, 'null']
              format: date-time
            downloadReady:
              type: boolean
        delivery:
          oneOf:
            - type: object
              additionalProperties: false
              required: [status, scheduledFor, deliveredAt]
              properties:
                status:
                  type: string
                  enum: [PENDING, SANDBOXED, DELIVERED, FAILED]
                scheduledFor:
                  type: string
                  format: date-time
                deliveredAt:
                  type: [string, 'null']
                  format: date-time
            - type: 'null'
    GiftCertificateOrderCommandResult:
      allOf:
        - $ref: '#/components/schemas/GiftCertificateOrder'
        - type: object
          required: [replayed]
          properties:
            replayed:
              type: boolean
    GiftCertificatePayment:
      type: object
      additionalProperties: false
      required: [id, orderId, provider, status, amountMinor, currency, createdAt, confirmedAt]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        provider:
          type: string
          const: PADLHUB_SANDBOX
        status:
          type: string
          enum: [PENDING, CONFIRMED, FAILED]
        amountMinor:
          type: integer
          minimum: 10000
          maximum: 100000000
        currency:
          type: string
          const: RUB
        createdAt:
          type: string
          format: date-time
        confirmedAt:
          type: [string, 'null']
          format: date-time
    GiftCertificatePaymentIntent:
      type: object
      additionalProperties: false
      required: [payment, nextAction, replayed]
      properties:
        payment:
          $ref: '#/components/schemas/GiftCertificatePayment'
        nextAction:
          type: object
          additionalProperties: false
          required: [type, url]
          properties:
            type:
