apply plugin: 'com.android.application'

// Release signing is fail closed. A release build never falls back to debug signing and never
// produces an unsigned artifact: when the required inputs are absent, any release packaging or
// signing task fails with one actionable message. Inputs come from the environment (CI) or from a
// gitignored apps/mobile/android/keystore.properties. See docs/runbooks/android-release-signing.md.
def releaseSigningPropertiesFile = rootProject.file('keystore.properties')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

def releaseSigningValue = { String environmentName, String propertyName ->
    def fromEnvironment = System.getenv(environmentName)
    if (fromEnvironment != null && !fromEnvironment.trim().isEmpty()) {
        return fromEnvironment.trim()
    }
    def fromPropertiesFile = releaseSigningProperties.getProperty(propertyName)
    if (fromPropertiesFile != null && !fromPropertiesFile.trim().isEmpty()) {
        return fromPropertiesFile.trim()
    }
    return null
}

def releaseSigningSources = [
    storeFile: ['ANDROID_KEYSTORE_PATH', 'storeFile'],
    storePassword: ['ANDROID_KEYSTORE_PASSWORD', 'storePassword'],
    keyAlias: ['ANDROID_KEY_ALIAS', 'keyAlias'],
    keyPassword: ['ANDROID_KEY_PASSWORD', 'keyPassword'],
]
def releaseSigningValues = [:]
def missingReleaseSigningInputs = []
releaseSigningSources.each { name, sources ->
    def value = releaseSigningValue(sources[0], sources[1])
    releaseSigningValues[name] = value
    if (value == null) {
        missingReleaseSigningInputs << name + ' (' + sources[0] + ')'
    }
}
def configuredReleaseKeystore = releaseSigningValues.storeFile == null
    ? null
    : rootProject.file(releaseSigningValues.storeFile)
def releaseSigningProblem = null
if (!missingReleaseSigningInputs.isEmpty()) {
    releaseSigningProblem = "Android release signing is not configured: missing " +
        missingReleaseSigningInputs.sort().join(', ') + "."
} else if (configuredReleaseKeystore == null || !configuredReleaseKeystore.isFile()) {
    releaseSigningProblem = "Android release signing is not configured: the keystore file " +
        configuredReleaseKeystore + " does not exist."
}
if (releaseSigningProblem != null) {
    releaseSigningProblem += " Provide ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD," +
        " ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as environment variables or create the" +
        " gitignored apps/mobile/android/keystore.properties. Refusing to build an unsigned or" +
        " debug-signed release. See docs/runbooks/android-release-signing.md."
}

def requiresReleaseSigning = { String taskName ->
    return taskName == 'build' ||
        taskName.matches('(?i)^(assemble|bundle|package|sign|validateSigning).*release.*$')
}

gradle.taskGraph.whenReady { taskGraph ->
    if (releaseSigningProblem != null &&
        taskGraph.allTasks.any { task -> requiresReleaseSigning(task.name) }) {
        throw new GradleException(releaseSigningProblem)
    }
}

android {
    namespace = "ru.padlhub.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ru.padlhub.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 14
        versionName "1.13"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (releaseSigningProblem == null) {
            release {
                storeFile configuredReleaseKeystore
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningProblem == null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def appVersionCode = android.defaultConfig.versionCode
def appVersionName = android.defaultConfig.versionName

// Release metadata source for .github/workflows/mobile-android.yaml. It never reads signing material.
tasks.register('printAppVersion') {
    group = 'help'
    description = 'Prints versionCode and versionName for signed release build metadata.'
    doLast {
        println "versionCode=${appVersionCode}"
        println "versionName=${appVersionName}"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.0.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
