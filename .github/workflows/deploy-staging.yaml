            set -eu
            sh /opt/phub/verify-runtime-env-isolation.sh \
              /etc/phub/staging.env /etc/phub/realtime.env phub-deploy false
            cd /opt/phub
            docker compose --env-file infrastructure.env --env-file release.env config --quiet
            sh /opt/phub/verify-communities-legacy-read-only.sh preflight
          '
      - name: Pull, migrate and deploy the same image digests
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
        run: |
          set -euo pipefail
          if [ "$DEPLOYMENT_PROFILE" = MEDIA_BINARY_ONLY ]; then
            install -d -m 700 media-rollout
          fi
          rollout_log="$(mktemp)"
          trap 'rm -f "$rollout_log"' EXIT HUP INT TERM
          set +e
          printf '%s' "$GHCR_TOKEN" | ssh "phub-deploy@$HOST" '
            set -eu
            deployment_profile="${{ inputs.deployment_profile }}"
            candidate_release_input="/opt/phub/release.foundation.${{ github.run_id }}.env"
            cleanup_remote() {
              rm -f "$candidate_release_input"
              docker logout ghcr.io >/dev/null 2>&1 || true
            }
            trap cleanup_remote EXIT HUP INT TERM
            docker login ghcr.io --username "${{ github.actor }}" --password-stdin
            cd /opt/phub
            if [ "$deployment_profile" = CHAT_PUSH_FOUNDATION ] || [ "$deployment_profile" = CHAT_PUSH_FOUNDATION_RECOVERY ]; then
              if [ "$deployment_profile" = CHAT_PUSH_FOUNDATION ]; then
                foundation_run_id="${{ github.run_id }}"
                foundation_run_attempt="${{ github.run_attempt }}"
                foundation_operation=start
              else
                foundation_run_id="${{ inputs.foundation_original_run_id }}"
                foundation_run_attempt="${{ inputs.foundation_original_run_attempt }}"
                foundation_operation=recover
              fi
              sh /opt/phub/run-chat-push-foundation-release.sh \
                "${{ inputs.foundation_tenant_keys }}" \
                "${{ inputs.foundation_expected_candidate_sha }}" \
                "$foundation_run_id" \
                "$foundation_run_attempt" \
                "${{ inputs.foundation_expected_active_release_sha }}" \
                "/opt/phub/backups/releases/pre-${{ inputs.foundation_expected_candidate_sha }}-${foundation_run_id}-${foundation_run_attempt}" \
                "$foundation_operation" \
                "$candidate_release_input"
              exit 0
            fi
            if [ "$deployment_profile" != COMMUNITIES_LEGACY_READ_ONLY ] \
              && [ "$deployment_profile" != MEDIA_BINARY_ONLY ]; then
              rm -f /opt/phub/staging.communities.env
            fi
            compose() {
              docker compose --env-file infrastructure.env --env-file release.env "$@"
            }
            infrastructure() {
              docker compose --env-file infrastructure.env -f compose.infrastructure.yaml "$@"
            }
            available_kb="$(df -Pk / | tail -1 | tr -s " " | cut -d " " -f 4)"
            if [ "$available_kb" -lt 8388608 ]; then
              echo "Nano has less than 8 GiB free; pruning only unused Docker images."
              docker image prune --all --force
              available_kb="$(df -Pk / | tail -1 | tr -s " " | cut -d " " -f 4)"
            fi
            if [ "$available_kb" -lt 4194304 ]; then
              echo "Nano has less than 4 GiB free after safe image pruning."
              df -h /
              docker system df
              exit 1
            fi
            compose pull
            if [ "$deployment_profile" = MEDIA_BINARY_ONLY ]; then
              sh /opt/phub/verify-media-disk-budget.sh post-pull
            fi

            runtime_env=/etc/phub/staging.env
            migrator_env=/etc/phub/staging.migrator.env
            test -r "$runtime_env"
            test -r "$migrator_env"
            test "$(stat -c %a "$migrator_env")" = 600
            test ! "$runtime_env" -ef "$migrator_env"
            awk '\''
              /^[[:space:]]*($|#)/ { next }
              /^DATABASE_URL=/ { next }
              { exit 1 }
            '\'' "$migrator_env"
            test "$(awk -F= '\''$1 == "DATABASE_URL" { count += 1 } END { print count + 0 }'\'' "$runtime_env")" -eq 1
            test "$(awk -F= '\''$1 == "DATABASE_URL" { count += 1 } END { print count + 0 }'\'' "$migrator_env")" -eq 1
            runtime_database_url="$(sed -n '\''s/^DATABASE_URL=//p'\'' "$runtime_env")"
            migrator_database_url="$(sed -n '\''s/^DATABASE_URL=//p'\'' "$migrator_env")"
            case "$migrator_database_url" in
              postgresql://*|postgres://*) ;;
              *) exit 64 ;;
            esac
            test "$runtime_database_url" != "$migrator_database_url"
            database_role_boundary_scope=core
            if [ "$deployment_profile" = MEDIA_BINARY_ONLY ]; then
              database_role_boundary_scope=media
            fi
            DATABASE_ROLE_BOUNDARY_PHASE=pre \
            DATABASE_ROLE_BOUNDARY_SCOPE="$database_role_boundary_scope" \
            RUNTIME_DATABASE_URL="$runtime_database_url" \
            MIGRATOR_DATABASE_URL="$migrator_database_url" \
              compose --profile migration run --rm --no-deps -T \
                -e RUNTIME_DATABASE_URL -e MIGRATOR_DATABASE_URL \
                -e DATABASE_ROLE_BOUNDARY_PHASE -e DATABASE_ROLE_BOUNDARY_SCOPE \
                --entrypoint node migrator apps/migrator/dist/verify-role-boundary.js

            backup_dir=/opt/phub/backups
            backup_timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup_path="$backup_dir/postgres-pre-${{ github.sha }}-$backup_timestamp.dump"
            umask 077
            if [ ! -e "$backup_dir" ] && [ ! -L "$backup_dir" ]; then
              mkdir -m 700 "$backup_dir"
            fi
            [ -d "$backup_dir" ]
            [ ! -L "$backup_dir" ]
            [ "$(stat -c %u "$backup_dir")" = "$(id -u)" ]
            chmod 700 "$backup_dir"
            [ "$(stat -c %a "$backup_dir")" = 700 ]
            [ ! -e "$backup_path" ]
            [ ! -L "$backup_path" ]
            PHUB_POSTGRES_STORAGE_PATH=/var/lib/docker \
              sh /opt/phub/verify-postgres-backup-restore.sh \
                - \
                "phub_restore_${{ github.run_id }}_${{ github.run_attempt }}" \
                VERIFY_STAGING_POSTGRES_CAPACITY
            backup_tmp="$(mktemp "$backup_dir/.postgres-pre-${{ github.sha }}-$backup_timestamp.XXXXXX.dump")"
            trap "rm -f \"$backup_tmp\"; docker logout ghcr.io >/dev/null 2>&1 || true" EXIT
            infrastructure exec -T postgres sh -ec \
              "pg_dump -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" --format=custom" \
              > "$backup_tmp"
            test -s "$backup_tmp"
            chmod 600 "$backup_tmp"
            [ "$(stat -c %a "$backup_tmp")" = 600 ]
            infrastructure exec -T postgres pg_restore --list < "$backup_tmp" >/dev/null
            PHUB_POSTGRES_STORAGE_PATH=/var/lib/docker \
              sh /opt/phub/verify-postgres-backup-restore.sh \
                "$backup_tmp" \
                "phub_restore_${{ github.run_id }}_${{ github.run_attempt }}" \
                VERIFY_STAGING_POSTGRES_BACKUP

            mv "$backup_tmp" "$backup_path"
            chmod 600 "$backup_path"
            [ "$(stat -c %a "$backup_path")" = 600 ]
            echo "Restore-verified staging PostgreSQL backup: $backup_path"
            backup_checksum_line="$(sha256sum "$backup_path")"
            backup_size_bytes="$(wc -c < "$backup_path" | tr -d " ")"
            printf "media_backup path=%s bytes=%s checksum=%s status=verified\n" \
              "$backup_path" "$backup_size_bytes" "${backup_checksum_line%% *}"

            if [ "$deployment_profile" = MEDIA_BINARY_ONLY ]; then
              manifest_base64="$(base64 -w 0 /opt/phub/candidate-migrations.manifest)"
              restore_database="phub_restore_${{ github.run_id }}_${{ github.run_attempt }}"
              RUNTIME_DATABASE_URL="$runtime_database_url" \
              MIGRATOR_DATABASE_URL="$migrator_database_url" \
                sh /opt/phub/rehearse-media-migration.sh \
                  "$backup_path" "$restore_database" "$manifest_base64"
            fi

            migration_started="$(date +%s)"
            if [ "$deployment_profile" = MEDIA_BINARY_ONLY ]; then
              MIGRATOR_DATABASE_URL="$migrator_database_url" \
                compose --profile migration run --rm \
                  -e "PGOPTIONS=-c lock_timeout=5000 -c statement_timeout=600000 -c idle_in_transaction_session_timeout=600000" \
                  migrator
            else
              MIGRATOR_DATABASE_URL="$migrator_database_url" \
                compose --profile migration run --rm migrator
            fi
            migration_seconds=$(($(date +%s) - migration_started))
            DATABASE_ROLE_BOUNDARY_PHASE=post \
            DATABASE_ROLE_BOUNDARY_SCOPE="$database_role_boundary_scope" \
            RUNTIME_DATABASE_URL="$runtime_database_url" \
            MIGRATOR_DATABASE_URL="$migrator_database_url" \
              compose --profile migration run --rm --no-deps -T \
                -e RUNTIME_DATABASE_URL -e MIGRATOR_DATABASE_URL \
                -e DATABASE_ROLE_BOUNDARY_PHASE -e DATABASE_ROLE_BOUNDARY_SCOPE \
                --entrypoint node migrator apps/migrator/dist/verify-role-boundary.js
            latest_migration="$(sed -n s/^LATEST_MIGRATION=//p release.env)"
            test -n "$latest_migration"
            applied_migrations="$(infrastructure exec -T postgres sh -ec \
              "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -Atc \"select filename from public.schema_migrations\"" \
            )"
            printf "%s\n" "$applied_migrations" | grep -Fx "$latest_migration"
            if [ "$deployment_profile" = MEDIA_BINARY_ONLY ]; then
              manifest_base64="$(base64 -w 0 /opt/phub/candidate-migrations.manifest)"
              sh /opt/phub/verify-media-migration-ledger.sh "$manifest_base64"
              printf "media_shared_migration duration_seconds=%s status=passed\n" "$migration_seconds"
            fi

            service_is_healthy() {
              container_id="$(compose ps -q "$1")"
              [ -n "$container_id" ] &&
                [ "$(docker inspect --format "{{.State.Health.Status}}" "$container_id")" = "healthy" ]
            }

            wait_for_service() {
              service="$1"
              attempt=0
              while [ "$attempt" -lt 36 ]; do
                if service_is_healthy "$service"; then
                  return 0
                fi
                attempt=$((attempt + 1))
                sleep 5
              done
              compose ps -a
              compose logs --no-color --tail=160 "$service"
              return 1
            }

            if [ "$deployment_profile" = COMMUNITIES_LEGACY_READ_ONLY ]; then
              compose up -d --remove-orphans web api
              wait_for_service api
              compose stop worker realtime
              [ -z "$(compose ps --status running -q worker)" ]
              [ -z "$(compose ps --status running -q realtime)" ]
            elif [ "$deployment_profile" = MEDIA_BINARY_ONLY ]; then
              # Preserve the currently serving web/worker/realtime while the candidate API is
              # drained and proven against old-client media reads. Then roll each remaining
              # process independently and publish the candidate web bundle last.
              compose up -d --no-deps api
              wait_for_service api
              sh /opt/phub/verify-media-binary-api.sh \
                '${{ inputs.expected_active_release }}' '${{ github.sha }}'
              compose up -d --no-deps worker
              wait_for_service worker
              compose exec -T worker node -e "
                fetch(\"http://127.0.0.1:3002/health/ready\", { signal: AbortSignal.timeout(5000) })
                  .then(async (response) => {
                    const body = await response.json();
                    if (!response.ok || body.status !== \"ready\") process.exit(1);
                  })
                  .catch(() => process.exit(1));
              "
              compose up -d --no-deps realtime
              wait_for_service realtime
              docker compose --env-file infrastructure.env -f compose.infrastructure.yaml up -d --force-recreate nginx
              sh /opt/phub/verify-media-binary-api.sh \
                '${{ inputs.expected_active_release }}' '${{ github.sha }}'
              compose up -d --no-deps web
              wait_for_service web
            else
              # Media cutovers publish stable first-party URLs. Start the API route first so a
              # worker can never publish a URL that the currently serving API cannot resolve.
              compose up -d --remove-orphans web api
              wait_for_service api
              compose up -d --remove-orphans worker realtime
            fi
            # The ingress configuration is bind-mounted. Recreate this one
            # stateless container so it loads the newly copied configuration.
            if [ "$deployment_profile" != MEDIA_BINARY_ONLY ]; then
              docker compose --env-file infrastructure.env -f compose.infrastructure.yaml up -d --force-recreate nginx
            fi

            ready=0
            attempt=0
            while [ "$attempt" -lt 36 ]; do
              if [ "$deployment_profile" = COMMUNITIES_LEGACY_READ_ONLY ] \
                && service_is_healthy api; then
                ready=1
                break
              fi
              if [ "$deployment_profile" != COMMUNITIES_LEGACY_READ_ONLY ] \
                && service_is_healthy api \
                && service_is_healthy realtime \
                && service_is_healthy worker; then
                ready=1
                break
              fi
              attempt=$((attempt + 1))
              sleep 5
            done
            if [ "$ready" -ne 1 ]; then
              compose ps -a
              compose logs --no-color --tail=160 api worker realtime
              exit 1
            fi
            if [ "$deployment_profile" != COMMUNITIES_LEGACY_READ_ONLY ]; then
              compose exec -T worker node -e "
                fetch(\"http://127.0.0.1:3002/health/ready\", { signal: AbortSignal.timeout(5000) })
                  .then(async (response) => {
                    const body = await response.json();
                    if (!response.ok || body.status !== \"ready\") process.exit(1);
                  })
                  .catch(() => process.exit(1));
              "
            fi
          ' | tee "$rollout_log"
          remote_status=${PIPESTATUS[1]}
          set -e
          if [ "$DEPLOYMENT_PROFILE" = MEDIA_BINARY_ONLY ]; then
            awk '/^media_/' "$rollout_log" > media-rollout/restore-evidence.txt
            chmod 600 media-rollout/restore-evidence.txt
          fi
          test "$remote_status" -eq 0
      - name: Promote canonical Nano TLS ingress
        if: ${{ inputs.deployment_profile != 'CHAT_PUSH_FOUNDATION' && inputs.deployment_profile != 'CHAT_PUSH_FOUNDATION_RECOVERY' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
        run: |
          ssh "phub-deploy@$HOST" '
            set -eu
            deployment_profile="${{ inputs.deployment_profile }}"
            cd /opt/phub/tls-ingress
            backup_dir=/opt/phub/backups
            backup_timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup_path="$backup_dir/Caddyfile-pre-${{ github.sha }}-$backup_timestamp"
            mkdir -p "$backup_dir"
            test -s Caddyfile.next
            cp Caddyfile "$backup_path"
            mv Caddyfile.next Caddyfile

            rollback_caddy() {
              cp "$backup_path" Caddyfile
              docker compose up -d --force-recreate caddy >/dev/null 2>&1 || true
            }

            if ! docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile; then
              rollback_caddy
              exit 1
            fi
            if ! docker compose up -d --force-recreate caddy; then
              rollback_caddy
              exit 1
            fi

            probe_canonical_ready() {
              curl --fail --silent \
                --connect-timeout 2 \
                --max-time 5 \
                --resolve lk.nano.padlhub.su:443:127.0.0.1 \
                "$1" >/dev/null
            }

            ingress_ready=0
            attempt=0
            while [ "$attempt" -lt 15 ]; do
              if [ "$deployment_profile" = COMMUNITIES_LEGACY_READ_ONLY ] \
                && probe_canonical_ready https://lk.nano.padlhub.su/health/ready; then
                ingress_ready=1
                break
              fi
              if [ "$deployment_profile" != COMMUNITIES_LEGACY_READ_ONLY ] \
                && probe_canonical_ready https://lk.nano.padlhub.su/health/ready \
                && probe_canonical_ready https://lk.nano.padlhub.su/realtime/health/ready; then
                ingress_ready=1
                break
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
            if [ "$ingress_ready" -ne 1 ]; then
              curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
                --resolve lk.nano.padlhub.su:443:127.0.0.1 \
                https://lk.nano.padlhub.su/health/ready >/dev/null || true
              if [ "$deployment_profile" != COMMUNITIES_LEGACY_READ_ONLY ]; then
                curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
                  --resolve lk.nano.padlhub.su:443:127.0.0.1 \
                  https://lk.nano.padlhub.su/realtime/health/ready >/dev/null || true
              fi
              rollback_caddy
              exit 1
            fi
            location="$(curl --silent --show-error --output /dev/null --write-out "%{redirect_url}" \
              -H "Host: 185.155.18.146" http://127.0.0.1/games)"
            if test "$location" != "https://lk.nano.padlhub.su/games"; then
              rollback_caddy
              exit 1
            fi
            echo "Verified TLS ingress backup: $backup_path"
          '
      - name: Verify media through the promoted canonical ingress
        if: ${{ inputs.deployment_profile == 'MEDIA_BINARY_ONLY' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
            "sh /opt/phub/verify-media-binary-api.sh '$GITHUB_SHA' '$GITHUB_SHA'" \
            | tee media-rollout/promoted-ingress.txt
          chmod 600 media-rollout/promoted-ingress.txt
      - name: Attest community-logo flags in every API and worker runtime
        if: ${{ inputs.deployment_profile != 'COMMUNITIES_LEGACY_READ_ONLY' && inputs.deployment_profile != 'CHAT_PUSH_FOUNDATION' && inputs.deployment_profile != 'CHAT_PUSH_FOUNDATION_RECOVERY' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: ssh "phub-deploy@$HOST" 'sh /opt/phub/verify-live-staging-data.sh runtime-flags'
      - name: Verify local HomeBase projections
        if: ${{ inputs.deployment_profile != 'COMMUNITIES_LEGACY_READ_ONLY' && inputs.deployment_profile != 'CHAT_PUSH_FOUNDATION' && inputs.deployment_profile != 'CHAT_PUSH_FOUNDATION_RECOVERY' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: ssh "phub-deploy@$HOST" 'sh /opt/phub/verify-home-base.sh'
      - name: Attest preserved media baseline after binary-only rollout
        if: ${{ inputs.deployment_profile == 'MEDIA_BINARY_ONLY' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          EXPECTED_COMPATIBILITY_FLOOR: ${{ needs.media-baseline.outputs.compatibility_floor }}
          EXPECTED_ROUTING_FINGERPRINT: ${{ needs.media-baseline.outputs.routing_fingerprint }}
          EXPECTED_RUNTIME_CONFIG_FINGERPRINT: ${{ needs.media-baseline.outputs.runtime_config_fingerprint }}
        run: |
          set -euo pipefail
          install -d -m 700 media-postdeploy
          migration_manifest=media-postdeploy/candidate-migrations.manifest
          find packages/database/migrations -maxdepth 1 -type f -name '*.sql' -print \
            | LC_ALL=C sort \
            | while IFS= read -r migration; do
                checksum_line="$(sha256sum "$migration")"
                printf '%s|%s\n' "${checksum_line%% *}" "$(basename "$migration")"
              done > "$migration_manifest"
          migration_manifest_base64="$(base64 -w 0 "$migration_manifest")"
          candidate_compose_base64="$(base64 -w 0 deploy/compose.staging.yaml)"
          candidate_tree="$(git rev-parse 'HEAD^{tree}')"
          attestation=media-postdeploy/attestation.txt
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
            sh -s -- "$GITHUB_SHA" "$GITHUB_SHA" "$candidate_tree" \
            "$migration_manifest_base64" "$candidate_compose_base64" \
            < deploy/jetson/verify-media-staging-baseline.sh \
            | tee "$attestation"

          observed_routing="$(sed -n 's/^routing_fingerprint=//p' "$attestation" | tail -n 1)"
          observed_runtime="$(sed -n 's/^runtime_config_fingerprint=//p' "$attestation" | tail -n 1)"
          test "$observed_routing" = "$EXPECTED_ROUTING_FINGERPRINT"
          test "$observed_runtime" = "$EXPECTED_RUNTIME_CONFIG_FINGERPRINT"

          manifest="$(curl --fail --silent --show-error --max-time 15 \
            "https://lk.nano.padlhub.su/manifest.json")"
          printf '%s' "$manifest" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              if (JSON.parse(input).release !== process.env.GITHUB_SHA) process.exit(1);
            });
          '
          printf 'public_manifest release=%s status=matched\n' "$GITHUB_SHA" | tee -a "$attestation"

          set +e
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
            'PHUB_MEDIA_ROLLBACK_MODE=pre-cutover sh /opt/phub/verify-media-rollback-safe.sh' \
            >> "$attestation" 2>&1
          guard_status=$?
          set -e
          case "$guard_status:$EXPECTED_COMPATIBILITY_FLOOR" in
            0:ordinary) ;;
            42:client-media)
              ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
                'PHUB_ROLLBACK_COMPATIBILITY_FLOOR=client-media PHUB_MEDIA_ROLLBACK_MODE=compatible-client sh /opt/phub/verify-media-rollback-safe.sh' \
                >> "$attestation" 2>&1
              ;;
            *)
              cat "$attestation"
              echo "::error::Media compatibility floor changed during binary-only rollout."
              exit 1
              ;;
          esac
          printf 'compatibility_floor=%s status=preserved\n' "$EXPECTED_COMPATIBILITY_FLOOR" | tee -a "$attestation"
      - name: Refresh the audited routing plan for browser-assisted Viva reads
        if: ${{ inputs.deployment_profile == 'FULL_LIVE_HOME' || inputs.deployment_profile == 'CLIENT_ASSISTED_VIVA' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          TENANT_KEY: ${{ inputs.routing_tenant_key }}
          ACTOR_ID: ${{ inputs.routing_actor_id }}
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
        run: |
          operation_id="routing-mixed-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          reason="staging-${DEPLOYMENT_PROFILE}-${GITHUB_SHA}"
          ssh "phub-deploy@$HOST" /opt/phub/run-client-routing-plan.sh \
            "$TENANT_KEY" "$ACTOR_ID" "$operation_id" "$operation_id" "$reason" false
          ssh "phub-deploy@$HOST" /opt/phub/run-client-routing-plan.sh \
            "$TENANT_KEY" "$ACTOR_ID" "$operation_id" "$operation_id" "$reason" true
      - name: Activate and verify live Home projection
        if: ${{ inputs.deployment_profile == 'FULL_LIVE_HOME' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: ssh "phub-deploy@$HOST" 'sh /opt/phub/activate-live-home.sh'
      - name: Activate and verify Communities legacy read-only projection
        if: ${{ inputs.deployment_profile == 'COMMUNITIES_LEGACY_READ_ONLY' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: ssh "phub-deploy@$HOST" 'sh /opt/phub/activate-communities-legacy-read-only.sh'
      - name: Activate and verify client-assisted Viva reads independently of Home sync
        if: ${{ inputs.deployment_profile == 'CLIENT_ASSISTED_VIVA' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          TENANT_KEY: ${{ inputs.routing_tenant_key }}
        run: |
          ssh "phub-deploy@$HOST" sh /opt/phub/activate-client-assisted-viva.sh "$TENANT_KEY"
          ssh "phub-deploy@$HOST" sh /opt/phub/verify-client-assisted-viva.sh "$TENANT_KEY"
      - name: Verify real staging identities and Games
        if: ${{ inputs.deployment_profile == 'FULL_LIVE_HOME' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: ssh "phub-deploy@$HOST" 'sh /opt/phub/verify-live-staging-data.sh'
      - name: Verify CUP campaigns and notifications binding
        if: ${{ inputs.deployment_profile == 'FULL_LIVE_HOME' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: ssh "phub-deploy@$HOST" 'sh /opt/phub/verify-cup-integrations.sh local-padel'
      - name: Verify messaging test release and preserve the current Home mode
        if: ${{ inputs.deployment_profile == 'MESSAGING_TEST' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          PLAYER_A_ID: ${{ inputs.messaging_player_a_id }}
          PLAYER_B_ID: ${{ inputs.messaging_player_b_id }}
        run: |
          checksum_line="$(sha256sum packages/database/migrations/0057_messaging_runtime.sql)"
          expected_checksum="${checksum_line%% *}"
          ssh "phub-deploy@$HOST" sh -s -- "$STAGING_RELEASE_BACKUP_DIR" <<'REMOTE'
            set -eu
            backup_dir="$1"
            if [ -f "$backup_dir/staging.override.env" ]; then
              cmp "$backup_dir/staging.override.env" /opt/phub/staging.override.env
            else
              test -f "$backup_dir/staging.override.env.absent"
              test ! -e /opt/phub/staging.override.env
            fi
          REMOTE
          ssh "phub-deploy@$HOST" sh /opt/phub/verify-messaging-test-release.sh \
            local-padel "$PLAYER_A_ID" "$PLAYER_B_ID" "$expected_checksum"
      - name: Verify the web entrypoint
        env:
          SMOKE_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          EXPECTED_WEB_RELEASE: ${{ (inputs.deployment_profile == 'CHAT_PUSH_FOUNDATION' || inputs.deployment_profile == 'CHAT_PUSH_FOUNDATION_RECOVERY') && inputs.foundation_expected_candidate_sha || github.sha }}
        run: |
          curl --fail --silent --show-error "$SMOKE_BASE_URL/" | grep -q 'id="phub-app"'
          curl --fail --silent --show-error "${SMOKE_BASE_URL%/}/manifest.json" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const manifest = JSON.parse(input);
              if (manifest.release !== process.env.EXPECTED_WEB_RELEASE) {
                console.error(`Expected web release ${process.env.EXPECTED_WEB_RELEASE}, received ${manifest.release}`);
                process.exit(1);
              }
            });
          '
      - name: Staging smoke test
        env:
          SMOKE_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: npm ci --ignore-scripts && npm run smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && inputs.deployment_profile == 'MEDIA_BINARY_ONLY' }}
        with:
          name: media-postdeploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            media-postdeploy
            media-rollout
          if-no-files-found: ignore
          retention-days: 30
      - name: Record production promotion eligibility
        if: ${{ inputs.deployment_profile == 'FULL_LIVE_HOME' }}
        run: |
          install -d -m 700 promotion-eligibility
          {
            echo 'PROFILE=FULL_LIVE_HOME'
            echo "RELEASE=$GITHUB_SHA"
            echo "STAGING_RUN_ID=$GITHUB_RUN_ID"
          } > promotion-eligibility/production-promotion-eligibility.env
          chmod 600 promotion-eligibility/production-promotion-eligibility.env
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ inputs.deployment_profile == 'FULL_LIVE_HOME' }}
        with:
          name: production-promotion-eligibility
          path: promotion-eligibility/production-promotion-eligibility.env
          retention-days: 30
      - name: Contain a failed foundation recovery without starting old writers
        if: ${{ (failure() || cancelled()) && inputs.deployment_profile == 'CHAT_PUSH_FOUNDATION_RECOVERY' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh "phub-deploy@$HOST" '
            set -eu
            backup_dir="/opt/phub/backups/releases/pre-${{ inputs.foundation_expected_candidate_sha }}-${{ inputs.foundation_original_run_id }}-${{ inputs.foundation_original_run_attempt }}"
            phase_path="$backup_dir/chat-push-foundation.phase"
            test -f "$phase_path" && test ! -L "$phase_path"
            phase="$(cat "$phase_path")"
            if [ "$phase" = CANDIDATE_RUNTIME_VERIFIED ] || [ "$phase" = EXTERNAL_SMOKE_FAILED ]; then
              candidate_release="$backup_dir/foundation.candidate-release.env"
              if PHUB_APP_ROOT=/opt/phub sh /opt/phub/verify-chat-push-foundation-runtime.sh \
                candidate-active "$candidate_release"; then
                phase_tmp="$backup_dir/.chat-push-foundation-phase.$$"
                printf "%s\n" EXTERNAL_SMOKE_FAILED > "$phase_tmp"
                chmod 600 "$phase_tmp"
                mv "$phase_tmp" "$phase_path"
                echo "Candidate remains active; external smoke requires inspected recovery."
                exit 0
              fi
            fi
            cd /opt/phub
            docker compose --env-file infrastructure.env --env-file release.env stop api worker realtime
            sh /opt/phub/verify-chat-push-foundation-runtime.sh drained
            echo "Foundation recovery stopped with writers drained; old-writer rollback is forbidden." >&2
            exit 1
          '
      - name: Roll back a failed staging application release
        if: ${{ (failure() || cancelled()) && steps.application-backup.outputs.ready == 'true' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
        run: |
          monitoring_restore_status=0
          if [ "$DEPLOYMENT_PROFILE" = CHAT_PUSH_FOUNDATION ]; then
            if ssh "phub-deploy@$HOST" "test -f '$STAGING_RELEASE_BACKUP_DIR/chat-push-foundation.phase'"; then
              phase="$(ssh "phub-deploy@$HOST" "cat '$STAGING_RELEASE_BACKUP_DIR/chat-push-foundation.phase'")"
              if [ "$phase" = CANDIDATE_RUNTIME_VERIFIED ] || [ "$phase" = EXTERNAL_SMOKE_FAILED ]; then
                if ssh "phub-deploy@$HOST" '
                  set -eu
                  backup_dir="'"$STAGING_RELEASE_BACKUP_DIR"'"
                  candidate_release="$backup_dir/foundation.candidate-release.env"
                  PHUB_APP_ROOT=/opt/phub sh /opt/phub/verify-chat-push-foundation-runtime.sh \
                    candidate-active "$candidate_release"
                  phase_path="$backup_dir/chat-push-foundation.phase"
                  phase_tmp="$backup_dir/.chat-push-foundation-phase.$$"
                  printf "%s\n" EXTERNAL_SMOKE_FAILED > "$phase_tmp"
                  chmod 600 "$phase_tmp"
                  mv "$phase_tmp" "$phase_path"
                '; then
                  echo 'Candidate remains active; external smoke requires inspected recovery.' >&2
                  exit 0
                fi
              fi
              ssh "phub-deploy@$HOST" '
                set -eu
                cd /opt/phub
                docker compose --env-file infrastructure.env --env-file release.env stop api worker realtime
                sh /opt/phub/verify-chat-push-foundation-runtime.sh drained
              '
              echo 'Foundation migration started; automatic old-writer rollback is blocked.' >&2
              exit 1
            fi
            set +e
            ssh "phub-deploy@$HOST" '
              set -eu
              backup_dir="'"$STAGING_RELEASE_BACKUP_DIR"'"
              monitoring_path=/opt/phub/monitoring/padlhub-alerts.yaml
              monitoring_changed=false
              if test -f "$backup_dir/monitoring.padlhub-alerts.yaml"; then
                install -m 644 "$backup_dir/monitoring.padlhub-alerts.yaml" "$monitoring_path"
                monitoring_changed=true
              elif test -f "$backup_dir/monitoring.padlhub-alerts.yaml.absent"; then
                rm -f "$monitoring_path"
                monitoring_changed=true
              else
                echo 'Monitoring was not mutated before the failed foundation install.'
              fi
              if test "$monitoring_changed" = true; then
                cd /opt/phub
                docker compose --env-file infrastructure.env -f compose.infrastructure.yaml \
                  up -d --no-deps --force-recreate prometheus
              fi
            '
            monitoring_restore_status="$?"
            set -e
          fi
          if ssh "phub-deploy@$HOST" \
            'PHUB_MEDIA_ROLLBACK_MODE=pre-cutover sh /opt/phub/verify-media-rollback-safe.sh'; then
            ssh "phub-deploy@$HOST" \
              "PHUB_ROLLBACK_BACKUP_ROOT=/opt/phub/backups/releases sh /opt/phub/rollback-application.sh '$STAGING_RELEASE_BACKUP_DIR' --confirm=ROLLBACK_STAGING_RELEASE"
          else
            guard_status="$?"
            case "$guard_status" in
              42)
                compatibility_floor=client-media
                compatible_guard_mode=compatible-client
                ;;
              43)
                compatibility_floor=community-logo
                compatible_guard_mode=compatible-logo
                ;;
              *)
                echo "Media rollback precheck failed without a confirmed compatibility transition (exit=$guard_status)" >&2
                exit "$guard_status"
                ;;
            esac
            ssh "phub-deploy@$HOST" \
              "PHUB_ROLLBACK_COMPATIBILITY_FLOOR=$compatibility_floor PHUB_ROLLBACK_BACKUP_ROOT=/opt/phub/backups/releases sh /opt/phub/prepare-compatible-worker-rollback.sh '$STAGING_RELEASE_BACKUP_DIR' PREPARE_COMPATIBLE_WORKER_ROLLBACK"
            ssh "phub-deploy@$HOST" \
              "PHUB_ROLLBACK_COMPATIBILITY_FLOOR=$compatibility_floor PHUB_MEDIA_ROLLBACK_MODE=$compatible_guard_mode sh /opt/phub/verify-media-rollback-safe.sh"
            ssh "phub-deploy@$HOST" \
              "PHUB_ROLLBACK_COMPATIBILITY_FLOOR=$compatibility_floor PHUB_ROLLBACK_REQUIRE_COMPATIBLE_WORKER=true PHUB_ROLLBACK_BACKUP_ROOT=/opt/phub/backups/releases sh /opt/phub/rollback-application.sh '$STAGING_RELEASE_BACKUP_DIR' --confirm=ROLLBACK_STAGING_RELEASE"
          fi
          if [ "$monitoring_restore_status" -ne 0 ]; then
            echo "Application rollback completed, but monitoring restoration failed (exit=$monitoring_restore_status)." >&2
            exit "$monitoring_restore_status"
          fi
