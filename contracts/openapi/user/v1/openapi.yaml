components:
  schemas:
    ManagedSubscriptionWarnQuoteRequest:
      type: object
      additionalProperties: false
      required: [action, target, paymentIntent]
      properties:
        action:
          type: string
          enum: [CREATE_GAME, JOIN_GAME]
        target:
          type: object
          additionalProperties: false
          required: [kind, id]
          properties:
            kind:
              type: string
              const: GAME
            id:
              type: string
              minLength: 3
              maxLength: 200
              pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]+$'
            expectedRevision:
              type: integer
              minimum: 1
              maximum: 9007199254740991
        preferredSubscriptionInstanceId:
          type: string
          minLength: 3
          maxLength: 200
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]+$'
        paymentIntent:
          type: string
          enum: [AUTO_BEST_PRICE, PAY_FULL_PRICE, USE_SUBSCRIPTION]
    ManagedSubscriptionWarnReason:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum:
            - SERVICE_UNAVAILABLE
            - SUBSCRIPTION_NOT_FOUND
            - SUBSCRIPTION_SELECTION_REQUIRED
            - SUBSCRIPTION_NOT_OWNED_BY_ACTOR
            - SUBSCRIPTION_TYPE_MISMATCH
            - SUBSCRIPTION_PENDING_ACTIVATION
            - SUBSCRIPTION_INACTIVE
            - SUBSCRIPTION_FROZEN
            - SUBSCRIPTION_EXPIRED
            - SUBSCRIPTION_CANCELLED
            - SUBSCRIPTION_REFUNDED
            - SUBSCRIPTION_REVOKED
            - SUBSCRIPTION_INSTANCE_STALE
            - PROVIDER_IDENTITY_UNAVAILABLE
            - PROVIDER_STATE_MISMATCH
            - POLICY_UNAVAILABLE
            - POLICY_NOT_PUBLISHED
            - POLICY_NOT_EFFECTIVE
            - POLICY_STALE
            - POLICY_VERSION_MISMATCH
            - POLICY_DIGEST_MISMATCH
            - POLICY_MAPPING_UNVERIFIED
            - POLICY_ACTION_DISABLED
            - TARGET_NOT_FOUND
            - TARGET_NOT_SERVER_RESOLVED
            - TARGET_STALE
            - TARGET_REVISION_MISMATCH
            - PRICE_UNAVAILABLE
            - PRICE_STALE
            - PRICE_REVISION_MISMATCH
            - CURRENCY_UNSUPPORTED
            - EVENT_NOT_INCLUDED
            - PRODUCT_NOT_INCLUDED
            - DURATION_NOT_ALLOWED
            - STATION_NOT_ALLOWED
            - STATION_RULE_AMBIGUOUS
            - BOOKING_WINDOW_EXCEEDED
            - BLACKOUT_DATE
            - ACTIVE_SERVICES_LIMIT_REACHED
            - ACTIVE_SERVICES_LIMIT_UNAVAILABLE
            - DAILY_LIMIT_REACHED
            - WEEKLY_LIMIT_REACHED
            - MONTHLY_LIMIT_REACHED
            - FUTURE_BOOKINGS_LIMIT_REACHED
            - MIN_INTERVAL_NOT_MET
            - UNITS_EXHAUSTED
            - USAGE_SNAPSHOT_STALE
            - USAGE_SNAPSHOT_INVALID
            - BENEFIT_NOT_APPLICABLE
            - DISCOUNT_DISABLED
            - PRICE_CALCULATION_INVALID
            - PRICE_CHANGED
            - PRICE_CONFIRMATION_REQUIRED
            - RESERVATION_CONFLICT
            - RESERVATION_EXPIRED
            - RESERVATION_NOT_OWNED_BY_ACTOR
            - IDEMPOTENCY_CONFLICT
            - PROVIDER_UNAVAILABLE
            - PROVIDER_REJECTED
            - PROVIDER_TIMEOUT_AFTER_ACCEPT
            - PROVIDER_READBACK_MISMATCH
            - RECONCILIATION_REQUIRED
            - CROSS_TENANT_REJECTED
            - LEGACY_FLOW_NOT_MANAGED
    ManagedSubscriptionWarnQuoteResponse:
      type: object
      additionalProperties: false
      required:
        - contractVersion
        - mode
        - verdict
        - nonBinding
        - requiresReservationRecheck
        - actor
        - request
        - delegation
        - advisory
      properties:
        contractVersion:
          type: integer
          const: 1
        mode:
          type: string
          const: WARN
        verdict:
          type: string
          enum: [accepted, warning]
          description: Rejected verification is represented by a non-2xx API error.
        nonBinding:
          type: boolean
          const: true
        requiresReservationRecheck:
          type: boolean
          const: true
        actor:
          type: object
          additionalProperties: false
          required: [userId, tenantId, tenantKey]
          properties:
            userId:
              type: string
              format: uuid
            tenantId:
              type: string
              format: uuid
            tenantKey:
              type: string
        request:
          type: object
          additionalProperties: false
          required: [correlationId, idempotencyKeyDigest]
          properties:
            correlationId:
              type: string
            idempotencyKeyDigest:
              type: string
              pattern: '^sha256:[a-f0-9]{64}$'
        delegation:
          type: object
          additionalProperties: false
          required: [provider, scope, recipient, singleUse, verified]
          properties:
            provider:
              type: string
              const: VIVA
            scope:
              type: string
              const: subscription-runtime.quote
            recipient:
              type: string
              const: ph-admin
            singleUse:
              type: boolean
              const: true
            verified:
              type: boolean
              const: true
        advisory:
          type: object
          additionalProperties: false
          required:
            - outcome
            - paymentIntent
            - serviceAllowed
            - subscriptionBenefitAllowed
            - blockers
            - warnings
            - expiresAt
          properties:
            outcome:
              type: string
              enum:
                - ENTITLEMENT_APPLIED
                - FULL_PRICE_ONLY
                - SUBSCRIPTION_SELECTION_REQUIRED
                - PRICE_CONFIRMATION_REQUIRED
                - SERVICE_BLOCKED
                - RETRY_LATER
                - RECONCILIATION_REQUIRED
            paymentIntent:
              type: string
              enum: [AUTO_BEST_PRICE, PAY_FULL_PRICE, USE_SUBSCRIPTION]
            serviceAllowed:
              type: boolean
            subscriptionBenefitAllowed:
              type: boolean
            blockers:
              type: array
              items:
                $ref: '#/components/schemas/ManagedSubscriptionWarnReason'
            warnings:
              type: array
              items:
                $ref: '#/components/schemas/ManagedSubscriptionWarnReason'
            expiresAt:
              type: string
              format: date-time
    TournamentParticipantRoster:
      type: object
      additionalProperties: false
      required: [items, refreshedAt]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TournamentParticipant'
        refreshedAt:
          type: string
          format: date-time
    TournamentParticipant:
      type: object
      additionalProperties: false
      required: [id, displayName, level, avatarUrl]
      properties:
        id:
          type: string
          format: uuid
          description: Stable one-way PadlHub participant identifier; never a Viva identifier.
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        level:
          oneOf:
            - $ref: ../../public/v1/openapi.yaml#/components/schemas/GamePlayerLevel
            - type: 'null'
        avatarUrl:
          type: 'null'
          description: Reserved for a PadlHub-owned WebP profile projection.
    ClientRoutingPlan:
      type: object
      additionalProperties: false
      required: [revision, mode, issuedAt, expiresAt, operations]
      properties:
        revision:
          type: string
          pattern: '^[0-9]+$'
        mode:
          type: string
          enum: [PADLHUB_ONLY, MIXED_END_USER_READS]
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        operations:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: '#/components/schemas/ClientRoutingOperationPlan'
        directViva:
          $ref: '#/components/schemas/DirectVivaTransport'
    ClientRoutingOperationPlan:
      type: object
      additionalProperties: false
      required: [operation, transport, fallback]
      properties:
        operation:
          type: string
          enum:
            [
              profile.read,
              bookings.read,
              bookings.details.read,
              bookings.history.read,
              subscriptions.read,
              schedule.read,
            ]
        transport:
          type: string
          enum: [PADLHUB_API, DIRECT_VIVA]
        fallback:
          type: string
          enum: [PADLHUB_API, UNAVAILABLE]
    DirectVivaTransport:
      type: object
      additionalProperties: false
      required:
        [apiBaseUrl, providerTenantKey, accessTokenPath, allowedRequestHeaders, allowedMediaHosts]
      properties:
        apiBaseUrl:
          type: string
          format: uri
        providerTenantKey:
          type: string
          minLength: 1
          maxLength: 128
        accessTokenPath:
          type: string
          const: /auth/viva/access
        allowedRequestHeaders:
          type: array
          minItems: 1
          maxItems: 1
          prefixItems:
            - type: string
              const: Authorization
          items: false
        allowedMediaHosts:
          type: array
          description: Server-owned exact hosts or dot-prefixed DNS suffixes allowed for profile media.
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 253
    UserProfile:
      $ref: '#/components/schemas/HomeProfile'
    ProfilePhotoSyncResult:
      type: object
      additionalProperties: false
      required: [avatarUrl, replayed]
      properties:
        avatarUrl:
          type: string
          pattern: '^/public/api/v1/media/profile-photos/[0-9a-f-]{36}/[0-9a-f-]{36}$'
        replayed:
          type: boolean
    ProfilePhotoRemoveResult:
      type: object
      additionalProperties: false
      required: [removed, replayed]
      properties:
        removed:
          type: boolean
          description: True means the authoritative no-photo state is durably recorded.
        replayed:
          type: boolean
    ProfilePrivacySettings:
      type: object
      additionalProperties: false
      required: [contactPolicy, chatPolicy, version, updatedAt]
      properties:
        contactPolicy:
          $ref: '#/components/schemas/ProfileActionPolicy'
        chatPolicy:
          $ref: '#/components/schemas/ProfileActionPolicy'
        version:
          type: integer
          minimum: 0
          description: Zero means no explicit row exists and server defaults are in effect.
        updatedAt:
          type: [string, 'null']
          format: date-time
    ProfilePrivacyUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, contactPolicy, chatPolicy]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        contactPolicy:
          $ref: '#/components/schemas/ProfileActionPolicy'
        chatPolicy:
          $ref: '#/components/schemas/ProfileActionPolicy'
    BookingPreferences:
      type: object
      additionalProperties: false
      required:
        - favoriteStationIds
        - preferredTimeWindows
        - useHistory
        - recommendFriends
        - recommendationDisplay
        - version
        - updatedAt
      properties:
        favoriteStationIds:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            format: uuid
        preferredTimeWindows:
          type: array
          maxItems: 14
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BookingPreferenceTimeWindow'
        useHistory:
          type: boolean
          description: Whether eligible completed PadlHub activity may influence recommendation order.
        recommendFriends:
          type: boolean
          description: Whether events containing the user's PadlHub friends receive a ranking boost.
        recommendationDisplay:
          type: string
          enum: [CARDS, ROWS]
          description: Preferred presentation for the Home V3 recommendation block.
        version:
          type: integer
          minimum: 0
          description: Zero means server defaults are in effect and no explicit row exists.
        updatedAt:
          type: [string, 'null']
          format: date-time
    BookingPreferencesUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - favoriteStationIds
        - preferredTimeWindows
        - useHistory
        - recommendFriends
        - recommendationDisplay
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        favoriteStationIds:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            format: uuid
        preferredTimeWindows:
          type: array
          maxItems: 14
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BookingPreferenceTimeWindow'
        useHistory:
          type: boolean
        recommendFriends:
          type: boolean
        recommendationDisplay:
          type: string
          enum: [CARDS, ROWS]
    BookingPreferenceTimeWindow:
      type: object
      additionalProperties: false
      required: [weekday, startsAt, endsAt]
      properties:
        weekday:
          type: string
          enum: [ANY, MON, TUE, WED, THU, FRI, SAT, SUN]
        startsAt:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
        endsAt:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
    ProfileActionPolicy:
      type: string
      enum: [AUTHORIZED, NOBODY]
      description: Target-owner policy evaluated after a separate server-side access decision.
    PlayerProfileView:
      type: object
      additionalProperties: false
      required: [profile, access]
      properties:
        profile:
          $ref: '#/components/schemas/PlayerProfile'
        privateAccount:
          $ref: '#/components/schemas/PlayerPrivateAccount'
        access:
          $ref: '#/components/schemas/PlayerProfileAccess'
    PlayerProfile:
      type: object
      additionalProperties: false
      required: [userId, displayName, level]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        firstName:
          type: [string, 'null']
          maxLength: 100
        lastName:
          type: [string, 'null']
          maxLength: 100
        avatarUrl:
          type: [string, 'null']
          pattern: '^(https?://.+|/public/api/v1/media/profile-photos/[0-9a-f-]{36}/[0-9a-f-]{36})$'
        level:
          $ref: '#/components/schemas/PlayerProfileLevel'
    PlayerProfileLevel:
      type: object
      additionalProperties: false
      required: [label, assessmentRequired]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 20
        value:
          type: number
          minimum: 0
          maximum: 10
          description: Omitted unless the viewer has extended-profile access.
        assessmentRequired:
          type: boolean
    PlayerPrivateAccount:
      type: object
      additionalProperties: false
      required: [balanceMinor, currency]
      description: Self-only fields; the property is omitted for every other viewer.
      properties:
        phoneLast4:
          type: string
          pattern: '^[0-9]{4}$'
        balanceMinor:
          type: integer
          description: Signed balance in minor currency units.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    PlayerProfileAccess:
      type: object
      additionalProperties: false
      required: [audience, tier, visibleSections, contact, chat]
      properties:
        audience:
          type: string
          enum: [SELF, OTHER]
        tier:
          type: string
          enum: [BASIC, EXTENDED, INTERACTION, SELF]
          description: Server-derived viewer tier; never calculated from fields in the browser.
        visibleSections:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [BASIC, PLAYER_LEVEL, PLAYER_RATING, PRIVATE_ACCOUNT]
        contact:
          $ref: '#/components/schemas/ProfileActionCapability'
        chat:
          $ref: '#/components/schemas/ProfileActionCapability'
    ProfileActionCapability:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [AVAILABLE, LOCKED, HIDDEN]
          description: AVAILABLE is emitted only when a working PadlHub route for the action is mounted in the current release.
        reason:
          type: string
          enum: [ACCESS_REQUIRED, PROFILE_RESTRICTED, SELF_PROFILE, FEATURE_UNAVAILABLE]
        route:
          type: string
          pattern: '^/'
          description: Present only when the action is available and its server-authorized PadlHub route is mounted.
    ProfileFriendship:
      type: object
      additionalProperties: false
      required: [userId, status, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [NONE, FRIEND]
        createdAt:
          type: [string, 'null']
          format: date-time
    ProfileFriendSummary:
      type: object
      additionalProperties: false
      required: [userId, displayName, avatarUrl, levelLabel, addedAt, route]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        avatarUrl:
          type: [string, 'null']
          pattern: '^/public/api/v1/media/profile-photos/'
        levelLabel:
          type: [string, 'null']
          maxLength: 20
        addedAt:
          type: string
          format: date-time
        route:
          type: string
          pattern: '^/profile/[0-9a-f-]+$'
    ProfileFriendPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 24
          items:
            $ref: '#/components/schemas/ProfileFriendSummary'
    ProfileLevelHistoryPoint:
      type: object
      additionalProperties: false
      required: [changedAt, levelLabel, levelValue]
      properties:
        changedAt:
          type: string
          format: date-time
        levelLabel:
          type: string
          enum: [D, D+, C, C+, B, B+, A]
        levelValue:
          type: [number, 'null']
          minimum: 0
          maximum: 10
    CanonicalProfileLevel:
      type: object
      additionalProperties: false
      required: [id, sportCode, code, title, rank, sortOrder, aliases, active, scaleVersion]
      properties:
        id:
          type: string
          format: uuid
        sportCode:
          type: string
        code:
          type: string
        title:
          type: string
        rank:
          type: integer
        sortOrder:
          type: integer
        aliases:
          type: array
          items:
            type: string
        active:
          type: boolean
        scaleVersion:
          type: integer
          minimum: 1
    PlayerSportLevel:
      type: object
      additionalProperties: false
      required:
        [
          playerId,
          sportCode,
          levelId,
          code,
          title,
          rank,
          source,
          numericValue,
          scaleVersion,
          updatedAt,
        ]
      properties:
        playerId:
          type: string
          format: uuid
        sportCode:
          type: string
        levelId:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        rank:
          type: integer
        source:
          type: string
          enum: [SELF_DECLARED, ONBOARDING, MANUAL, CALCULATED, VIVA, MIGRATED]
        numericValue:
          type: [number, 'null']
          minimum: 0
          maximum: 10
        scaleVersion:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    PlayerLevelState:
      type: object
      additionalProperties: false
      required: [sportCode, scaleVersion, levels, currentLevel]
      properties:
        sportCode:
          type: string
        scaleVersion:
          type: [integer, 'null']
          minimum: 1
        levels:
          type: array
          items:
            $ref: '#/components/schemas/CanonicalProfileLevel'
        currentLevel:
          anyOf:
            - $ref: '#/components/schemas/PlayerSportLevel'
            - type: 'null'
    SetOwnPlayerLevelRequest:
      type: object
      additionalProperties: false
      required: [sportCode, levelId]
      properties:
        sportCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        levelId:
          type: string
          format: uuid
    LevelAssessmentOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
    LevelAssessmentQuestion:
      type: object
      additionalProperties: false
      required: [id, text, type, options]
      properties:
        id:
          type: string
        text:
          type: string
        type:
          type: string
          enum: [single, multi]
        options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LevelAssessmentOption'
    LevelAssessmentDefinition:
      type: object
      additionalProperties: false
      required: [version, sportCode, baseQuestionId, questions, branches]
      properties:
        version:
          type: string
          enum: [padel-self-assessment-v1]
        sportCode:
          type: string
          enum: [PADEL]
        baseQuestionId:
          type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/LevelAssessmentQuestion'
        branches:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    CompleteLevelAssessmentRequest:
      type: object
      additionalProperties: false
      required: [sportCode, assessmentVersion, answers]
      properties:
        sportCode:
          type: string
          enum: [PADEL]
        assessmentVersion:
          type: string
          enum: [padel-self-assessment-v1]
        answers:
          type: object
          additionalProperties:
            type: array
            minItems: 1
            items:
              type: string
    CompleteLevelAssessmentResponse:
      type: object
      additionalProperties: false
      required: [assessment, level]
      properties:
        assessment:
          type: object
          additionalProperties: false
          required: [version, numericScore, levelCode]
          properties:
            version:
              type: string
            numericScore:
              type: number
            levelCode:
              type: string
        level:
          $ref: '#/components/schemas/PlayerSportLevel'
    ProfileLevelHistory:
      type: object
      additionalProperties: false
      required: [userId, items]
      properties:
        userId:
          type: string
          format: uuid
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ProfileLevelHistoryPoint'
    AuthChallengeRequest:
      type: object
      additionalProperties: false
      required: [method, phone]
      properties:
        method:
          type: string
          const: phone_otp
          description: Product-level authentication method; never an upstream provider name.
        phone:
          type: string
          pattern: '^\+7[0-9]{10}$'
          description: Phone number in E.164 format.
          example: '+79991234567'
    AuthChallenge:
      type: object
      additionalProperties: false
      required: [challengeId, expiresAt, resendAfterSeconds]
      properties:
        challengeId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        resendAfterSeconds:
          type: integer
          minimum: 0
          maximum: 3600
    VerifyAuthChallengeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{4}$'
          description: One-time code supplied to the user.
        acceptance:
          type: object
          additionalProperties: false
          description: |
            Required for client sessions and rejected unless both values are true.
            CUP admin authentication does not create a consumer legal acceptance.
          required: [publicOfferAccepted, personalDataPolicyAccepted]
          properties:
            publicOfferAccepted:
              type: boolean
              const: true
            personalDataPolicyAccepted:
              type: boolean
              const: true
    VivaOAuthAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [provider, acceptance]
      properties:
        provider:
          type: string
          enum: [vkid, yandex]
        acceptance:
          type: object
          additionalProperties: false
          required: [publicOfferAccepted, personalDataPolicyAccepted]
          properties:
            publicOfferAccepted:
              type: boolean
              const: true
            personalDataPolicyAccepted:
              type: boolean
              const: true
    VivaOAuthAuthorization:
      type: object
      additionalProperties: false
      required: [redirectUrl]
      properties:
        redirectUrl:
          type: string
          format: uri
    VivaOAuthRecoveryRequest:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          type: string
          const: yandex
    VivaDelegatedAccessRequest:
      type: object
      additionalProperties: false
      properties:
        handoffCode:
          type: string
          minLength: 20
          maxLength: 256
          description: One-time opaque callback handoff. Omit to refresh the stored delegation.
    VivaDelegatedAccess:
      type: object
      additionalProperties: false
      required: [accessToken, expiresAt, profilePhotoGrant]
      properties:
        accessToken:
          type: string
          minLength: 20
          maxLength: 8192
          description: Short-lived Viva user access token. Never persist outside browser memory.
        expiresAt:
          type: string
          format: date-time
        profilePhotoGrant:
          type: string
          minLength: 20
          maxLength: 4096
          description: Short-lived one-time grant for relaying only the current profile-photo bytes.
        profilePhoto:
          type: [object, 'null']
          additionalProperties: false
          required: [avatarUrl, syncedAt]
          description: |
            Current PadlHub-owned WebP mapping. Null means no normalized photo exists; omission means
            optional media metadata was unavailable and does not invalidate delegated access.
          properties:
            avatarUrl:
              type: string
              pattern: ^/public/api/v1/media/profile-photos/[0-9a-f-]{36}/[0-9a-f-]{36}$
            syncedAt:
              type: string
              format: date-time
    AuthenticatedSession:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresAt, user, context]
      properties:
        accessToken:
          type: string
          minLength: 20
          maxLength: 8192
          description: Short-lived PadlHub JWT with audience `phub-api`.
        tokenType:
          type: string
          const: Bearer
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        context:
          $ref: '#/components/schemas/UserContext'
    AuthenticatedUser:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
          description: Stable PadlHub user identifier.
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        firstName:
          type: [string, 'null']
          maxLength: 100
        lastName:
          type: [string, 'null']
          maxLength: 100
        avatarUrl:
          type: [string, 'null']
          pattern: '^(https?://.+|/public/api/v1/media/profile-photos/[0-9a-f-]{36}/[0-9a-f-]{36})$'
    UserContext:
      type: object
      additionalProperties: false
      required: [tenantId, userId, displayName, roles, permissions]
      properties:
        tenantId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        phoneLast4:
          type: string
          pattern: '^[0-9]{4}$'
          description: Last four digits only; the access JWT and context never expose the full phone.
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        runtimeCapabilities:
          $ref: '#/components/schemas/UserRuntimeCapabilities'
          description: >-
            Current server-owned read-only runtime availability. The field is optional during the
            expand release and clients must treat absence as all false.
    UserRuntimeCapabilities:
      type: object
      additionalProperties: false
      required:
        [
          communityDirectory,
          communityReadDetail,
          communityReadFeed,
          communityReadChat,
          communityReadRating,
          communityCanonical,
          communityDirectInvites,
          communityRealtime,
        ]
      properties:
        communityDirectory: { type: boolean }
        communityReadDetail: { type: boolean }
        communityReadFeed: { type: boolean }
        communityReadChat: { type: boolean }
        communityReadRating: { type: boolean }
        communityCanonical: { type: boolean }
        communityDirectInvites: { type: boolean }
        communityRealtime: { type: boolean }
    HomeDashboard:
      type: object
      additionalProperties: false
      required:
        [
          snapshot,
          profile,
          counters,
          quickActions,
          upcoming,
          subscriptions,
          communities,
          promotion,
          promotions,
          locations,
          additionalLinks,
          capabilities,
        ]
      properties:
        snapshot:
          $ref: '#/components/schemas/HomeSnapshot'
        profile:
          $ref: '#/components/schemas/HomeProfile'
        counters:
          $ref: '#/components/schemas/HomeCounters'
        quickActions:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/HomeQuickAction'
        upcoming:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/HomeUpcomingItem'
        subscriptions:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/HomeSubscription'
        communities:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/CommunitySummary'
        promotion:
          deprecated: true
          description: First active item retained during the expand/migrate compatibility window.
          oneOf:
            - $ref: '#/components/schemas/HomePromotion'
            - type: 'null'
        promotions:
          $ref: '#/components/schemas/HomePromotionDeck'
        heroPromotions:
          description: Independently managed compact banner deck for the top of Home.
          $ref: '#/components/schemas/HomePromotionDeck'
        locations:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/HomeLocation'
        additionalLinks:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/HomeAdditionalLink'
        capabilities:
          $ref: '#/components/schemas/HomeCapabilities'
    HomeBase:
      type: object
      additionalProperties: false
      required:
        [
          snapshot,
          viewerUserId,
          quickActions,
          communities,
          promotions,
          locations,
          additionalLinks,
          capabilities,
        ]
      properties:
        snapshot:
          $ref: '#/components/schemas/HomeBaseSnapshot'
        viewerUserId:
          type: string
          format: uuid
          description: Authenticated PadlHub user UUID; never a provider identifier.
        quickActions:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/HomeQuickAction'
        communities:
          $ref: '#/components/schemas/HomeBaseCommunitySection'
        promotions:
          $ref: '#/components/schemas/HomeBasePromotionSection'
        locations:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/HomeLocation'
        additionalLinks:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/HomeAdditionalLink'
        capabilities:
          $ref: '#/components/schemas/HomeCapabilities'
    HomeBaseSnapshot:
      type: object
      additionalProperties: false
      required: [version, generatedAt, source, completeness]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 100
        generatedAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [LOCAL_PROJECTION]
        completeness:
          type: string
          enum: [PARTIAL]
          description: Prevents this recovery read model from being interpreted as complete Home.
    HomeBaseCommunitySection:
      oneOf:
        - type: object
          additionalProperties: false
