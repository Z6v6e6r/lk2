log_format phub_safe escape=json
    '{"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time}';

server {
    listen 80 default_server;
    server_name _;
    access_log /dev/stdout phub_safe;

    resolver 127.0.0.11 ipv6=off valid=10s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # This listener exists only on the private ingress network behind Caddy.
    # Preserve the externally authenticated HTTPS boundary explicitly.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    location ~ ^/(health(?:/|$)|(?:public|user|admin)/api/) {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
    }

    # Media URLs are signed directly for the private Timeweb S3 bucket. Never
    # route this prefix to the retired Jetson MinIO service.
    location ^~ /phub-media/ {
        return 410;
    }

    location = /realtime/health/live {
        set $realtime_live_upstream http://realtime:3001/health/live;
        proxy_pass $realtime_live_upstream;
    }

    location = /realtime/health/ready {
        set $realtime_ready_upstream http://realtime:3001/health/ready;
        proxy_pass $realtime_ready_upstream;
    }

    location ^~ /realtime/ {
        set $realtime_upstream http://realtime:3001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 90s;
        proxy_pass $realtime_upstream;
    }

    location / {
        set $web_upstream http://web:8080;
        proxy_pass $web_upstream;
    }
}
