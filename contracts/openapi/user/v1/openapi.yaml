        - communityId
        - uploaderUserId
        - mediaType
        - state
        - revision
        - declaredContentType
        - declaredByteSize
        - declaredSha256
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        uploaderUserId:
          type: string
          format: uuid
        mediaType:
          type: string
          const: IMAGE
        state:
          $ref: '#/components/schemas/CommunityMediaState'
        revision:
          type: integer
          minimum: 1
        declaredContentType:
          $ref: '#/components/schemas/CommunityMediaContentType'
        declaredByteSize:
          type: integer
          minimum: 1
          maximum: 15728640
        declaredSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        uploadExpiresAt:
          type: string
          format: date-time
        finalizedAt:
          type: string
          format: date-time
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        variants:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/CommunityMediaVariant'
        readyAt:
          type: string
          format: date-time
        unattachedExpiresAt:
          type: [string, 'null']
          format: date-time
          description: READY media must be attached within 24 hours; null once bound to a post.
        rejectionCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        rejectedAt:
          type: string
          format: date-time
        expiredAt:
          type: string
          format: date-time
        purgedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CommunityPostStatus:
      type: string
      enum: [PENDING_MODERATION, PUBLISHED, ARCHIVED, HIDDEN]
    CommunityPost:
      type: object
      additionalProperties: false
      required:
        - id
        - communityId
        - authorUserId
        - status
        - body
        - revision
        - createdAt
        - publishedAt
        - updatedAt
        - archivedAt
        - restoreUntil
        - retentionUntil
      properties:
        id:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        authorUserId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CommunityPostStatus'
        body:
          type: string
          minLength: 1
          maxLength: 10000
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: [string, 'null']
          format: date-time
        restoreUntil:
          type: [string, 'null']
          format: date-time
        retentionUntil:
          type: [string, 'null']
          format: date-time
        media:
          type: array
          maxItems: 10
          description: Ordered immutable snapshot for this post revision. Absence means empty.
          items:
            $ref: '#/components/schemas/CommunityPostMedia'
    CommunityFeedPage:
      type: object
      additionalProperties: false
      required: [items, watermark]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CommunityPost'
        watermark:
          type: string
          format: date-time
        nextCursor:
          type: string
          minLength: 16
          maxLength: 1024
    CommunityRealtimeEvent:
      type: object
      additionalProperties: false
      required:
        - communityId
        - sequence
        - eventType
        - targetType
        - targetId
        - targetRevision
        - targetStatus
        - occurredAt
      properties:
        communityId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        eventType:
          type: string
          pattern: '^community\.[a-z0-9_.-]+\.v[1-9][0-9]*$'
        targetType:
          type: string
          enum: [POST, COMMENT, REACTION]
        targetId:
          type: string
          format: uuid
        targetRevision:
          type: integer
          minimum: 1
        targetStatus:
          type: [string, 'null']
          maxLength: 64
        occurredAt:
          type: string
          format: date-time
    CommunityRealtimeEventPage:
      type: object
      additionalProperties: false
      required:
        - items
        - afterSequence
        - latestSequence
        - retainedFromSequence
        - hasMore
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CommunityRealtimeEvent'
        afterSequence:
          type: integer
          minimum: 0
        latestSequence:
          type: integer
          minimum: 0
        retainedFromSequence:
          type: integer
          minimum: 1
        nextAfterSequence:
          type: integer
          minimum: 1
        hasMore:
          type: boolean
    CommunityEventGapExpiredResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - correlationId
        - recoveryAction
        - latestSequence
        - retainedFromSequence
      properties:
        code:
          type: string
          const: COMMUNITY_EVENT_GAP_EXPIRED
        message:
          type: string
          minLength: 1
        correlationId:
          type: string
          minLength: 1
        recoveryAction:
          type: string
          const: FULL_CANONICAL_RELOAD
        latestSequence:
          type: integer
          minimum: 0
        retainedFromSequence:
          type: integer
          minimum: 1
    CommunityPostCreateRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
        mediaIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
    CommunityPostEditRequest:
      type: object
      additionalProperties: false
      required: [body, expectedRevision]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
        expectedRevision:
          type: integer
          minimum: 1
        mediaIds:
          type: array
          maxItems: 10
          uniqueItems: true
          description: Omitted preserves current media; an empty array removes it from the new revision.
          items:
            type: string
            format: uuid
    CommunityContentRevisionRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
    CommunityComment:
      type: object
      additionalProperties: false
      required:
        - id
        - communityId
        - postId
        - authorUserId
        - status
        - body
        - revision
        - createdAt
        - publishedAt
        - updatedAt
        - archivedAt
        - restoreUntil
        - retentionUntil
      properties:
        id:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        authorUserId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PUBLISHED, ARCHIVED, HIDDEN]
        body:
          type: string
          minLength: 1
          maxLength: 2000
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: [string, 'null']
          format: date-time
        restoreUntil:
          type: [string, 'null']
          format: date-time
        retentionUntil:
          type: [string, 'null']
          format: date-time
    CommunityCommentPage:
      type: object
      additionalProperties: false
      required: [items, watermark]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CommunityComment'
        watermark:
          type: string
          format: date-time
        nextCursor:
          type: string
          minLength: 16
          maxLength: 1024
    CommunityCommentCreateRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
    CommunityCommentEditRequest:
      type: object
      additionalProperties: false
      required: [body, expectedRevision]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
        expectedRevision:
          type: integer
          minimum: 1
    CommunityReactionRequest:
      type: object
      additionalProperties: false
      required: [reaction]
      properties:
        reaction:
          type: string
          enum: [LIKE, DISLIKE]
    CommunityReactionState:
      type: object
      additionalProperties: false
      required: [targetType, targetId, reaction, active, revision, updatedAt]
      properties:
        targetType:
          type: string
          enum: [POST, COMMENT]
        targetId:
          type: string
          format: uuid
        reaction:
          type: [string, 'null']
          enum: [LIKE, DISLIKE, null]
        active:
          type: boolean
        revision:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    CommunityOwnershipTransferRequest:
      type: object
      additionalProperties: false
      required: [targetUserId, expectedOwnerRevision, expectedTargetRevision]
      properties:
        targetUserId:
          type: string
          format: uuid
        expectedOwnerRevision:
          type: integer
          minimum: 1
        expectedTargetRevision:
          type: integer
          minimum: 1
    CommunityOwnershipFormerOwner:
      type: object
      additionalProperties: false
      required: [userId, role, revision]
      properties:
        userId:
          type: string
          format: uuid
        role:
          type: string
          const: ADMIN
        revision:
          type: integer
          minimum: 1
    CommunityOwnershipNewOwner:
      type: object
      additionalProperties: false
      required: [userId, previousRole, role, revision]
      properties:
        userId:
          type: string
          format: uuid
        previousRole:
          type: string
          enum: [ADMIN, MODERATOR, MEMBER]
        role:
          type: string
          const: OWNER
        revision:
          type: integer
          minimum: 1
    CommunityOwnershipTransferState:
      type: object
      additionalProperties: false
      required: [communityId, previousOwner, owner, transferredAt]
      properties:
        communityId:
          type: string
          format: uuid
        previousOwner:
          $ref: '#/components/schemas/CommunityOwnershipFormerOwner'
        owner:
          $ref: '#/components/schemas/CommunityOwnershipNewOwner'
        transferredAt:
          type: string
          format: date-time
    CommunityMembershipPinRequest:
      type: object
      additionalProperties: false
      required: [pinned, expectedRevision]
      properties:
        pinned:
          type: boolean
        expectedRevision:
          type: integer
          minimum: 0
    CommunityMembershipPinState:
      type: object
      additionalProperties: false
      required: [communityId, pinned, revision, updatedAt]
      properties:
        communityId:
          type: string
          format: uuid
        pinned:
          type: boolean
        revision:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable client operation key used for retry-safe commands.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    ChallengeId:
      name: challengeId
      in: path
      required: true
      description: Opaque PadlHub authentication challenge UUID.
      schema:
        type: string
        format: uuid
    RefreshSessionIntent:
      name: X-Session-Intent
      in: header
      required: true
      description: Explicit refresh intent required alongside the HttpOnly cookie.
      schema:
        type: string
        const: refresh
    LogoutSessionIntent:
      name: X-Session-Intent
      in: header
      required: true
      description: Explicit logout intent required alongside the HttpOnly cookie.
      schema:
        type: string
        const: logout
    CommunityId:
      name: communityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommunityPostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommunityMediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommunityMediaVariant:
      name: variant
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CommunityMediaVariantName'
    CommunityCommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommunityReactionTargetId:
      name: targetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommunityContentLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    CommunityContentCursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 16
        maxLength: 1024
  headers:
    OAuthBrowserCookie:
      description: |
        Short-lived state-scoped `phub_oauth_browser_{digest}` cookie binding one OAuth state to
        the initiating browser without overwriting another tab's in-flight OAuth binding.
        It is HttpOnly and SameSite=Lax; production also sets Secure. Browser JavaScript cannot
        read its value, and cross-origin clients must enable credentials for the start request.
      required: true
      schema:
        type: string
    OAuthCallbackCookies:
      description: |
        Expires the one-time matching `phub_oauth_browser_{digest}` binding cookie. Initial sign-in
        also sets the HttpOnly `phub_refresh` session cookie; authenticated recovery does not.
        Production sets Secure and both cookies use SameSite=Lax.
      required: true
      schema:
        type: string
    RefreshCookie:
      description: |
        Rotated or expired `phub_refresh` cookie. It is HttpOnly and SameSite;
        production also sets Secure. Browser JavaScript cannot read its value.
      required: true
      schema:
        type: string
    SensitiveNoStore:
      description: Sensitive invite material must not be stored by browsers or intermediary caches.
      required: true
      schema:
        type: string
        const: no-store
  responses:
    SubscriptionRuntimeDelegationRejected:
      description: The PadlHub session is invalid or the recipient rejected the delegation signature, expiry, required claims, request/idempotency binding or replay.
      headers:
        X-Correlation-ID:
          $ref: ../../common/components.yaml#/components/headers/CorrelationId
      content:
        application/json:
          schema:
            $ref: ../../common/components.yaml#/components/schemas/ApiError
    SubscriptionRuntimeDelegationForbidden:
      description: The user lacks permission or the recipient rejected actor or tenant binding.
      headers:
        X-Correlation-ID:
          $ref: ../../common/components.yaml#/components/headers/CorrelationId
      content:
        application/json:
          schema:
            $ref: ../../common/components.yaml#/components/schemas/ApiError
    SubscriptionRuntimeDelegationConflict:
      description: The recipient reported an idempotency-key conflict for a different canonical request.
      headers:
        X-Correlation-ID:
          $ref: ../../common/components.yaml#/components/headers/CorrelationId
      content:
        application/json:
          schema:
            $ref: ../../common/components.yaml#/components/schemas/ApiError
    AuthIdentityConflict:
      description: The OAuth identity belongs to a different PadlHub user.
      headers:
        X-Correlation-ID:
          $ref: ../../common/components.yaml#/components/headers/CorrelationId
      content:
        application/json:
          schema:
            $ref: ../../common/components.yaml#/components/schemas/ApiError
    CommandConflict:
      description: The idempotency key was already used for another command.
      headers:
        X-Correlation-ID:
          $ref: ../../common/components.yaml#/components/headers/CorrelationId
      content:
        application/json:
          schema:
            $ref: ../../common/components.yaml#/components/schemas/ApiError
    WebPushRegistrationConflict:
      description: |
        The Idempotency-Key was reused for another command, or the authenticated user already owns
        the maximum permitted number of live Web Push installations.
      headers:
        X-Correlation-ID:
          $ref: ../../common/components.yaml#/components/headers/CorrelationId
      content:
        application/json:
          schema:
            $ref: ../../common/components.yaml#/components/schemas/ApiError
    AuthenticationRejected:
      description: The challenge, refresh cookie or PadlHub session credential is invalid.
      headers:
        X-Correlation-ID:
          $ref: ../../common/components.yaml#/components/headers/CorrelationId
      content:
        application/json:
          schema:
            $ref: ../../common/components.yaml#/components/schemas/ApiError
  securitySchemes:
    PadlHubUserJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: PadlHub-issued JWT; audience phub-api, UUID subject and authorized tenant UUIDs.
    PadlHubRefreshCookie:
      type: apiKey
      in: cookie
      name: phub_refresh
      description: Rotating PadlHub refresh credential stored only as an HttpOnly cookie.
