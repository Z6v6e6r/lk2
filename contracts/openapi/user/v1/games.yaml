      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/GameId'
    post:
      tags: [games]
      operationId: joinGame
      summary: Reserve or occupy one game seat
      description: |
        The server locks the game and derives identity, capacity, cutoff and payment policy. The
        caller cannot submit roster arrays or claim another user.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinGameRequest'
      responses:
        '200':
          $ref: '#/components/responses/GameCommandCompleted'
        '202':
          $ref: '#/components/responses/GameCommandAccepted'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: '#/components/responses/GameCommandRejected'
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable

  /{tenantKey}/games/{gameId}/join-operation:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/GameId'
    get:
      tags: [games]
      operationId: getGameJoinOperation
      summary: Read the original paid JOIN attempt by its idempotency key
      description: |
        Recovery read for a paid JOIN whose response was lost. The server derives the operation id
        from the original Idempotency-Key, so the client never guesses it. The read never reserves,
        dispatches, confirms, releases or fails an attempt; an unresolved outcome stays UNKNOWN with
        WAIT_FOR_RECONCILIATION and the caller must not start a new purchase.
      responses:
        '200':
          description: Original operation, including an unresolved (UNKNOWN) outcome.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameCommandResult' }
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: '#/components/responses/GameCommandRejected'
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable

  /{tenantKey}/games/{gameId}/leave-operation:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/GameId'
    get:
      tags: [games]
      operationId: getManagedLeaveOperation
      summary: Read the original managed FREE SELF LEAVE attempt by its idempotency key
      description: |
        Recovery read for a managed FREE SELF LEAVE whose response was lost. The server resolves the original command link
        from the original Idempotency-Key, including keys converged to the same participation. The read never reserves,
        dispatches, confirms, releases or fails an attempt; an unresolved outcome stays UNKNOWN with
        WAIT_FOR_RECONCILIATION and the caller must not start a new purchase.
      responses:
        '200':
          description: Original operation, including an unresolved (UNKNOWN) outcome.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameCommandResult' }
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: '#/components/responses/GameCommandRejected'
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable

