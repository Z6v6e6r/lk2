<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget=resizes-content` makes the on-screen keyboard shrink the layout viewport,
         so the composer keeps sitting on the bottom edge instead of leaving a band above the keyboard
         where the fixed navigation used to be. Engines that ignore the hint get the CSS fallback in
         `src/chats-ui/ChatsUi.module.css`. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f4f7f2" />
    <!-- iOS delivers Web Push only to a Home Screen web app, so the manifest and the touch icon are
         functional requirements there, not decoration. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PadlHub" />
    <title>PadlHub</title>
  </head>
  <body>
    <div id="phub-app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
