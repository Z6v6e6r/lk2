      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/GameId'
    delete:
      tags: [games]
      operationId: leaveGame
      summary: Leave a game as the authenticated participant
      description: Organizers use the explicit cancellation command; identity is JWT-derived.
      responses:
        '200':
          $ref: '#/components/responses/GameCommandCompleted'
        '202':
          description: Managed SELF leave remains unresolved; retry only the original key. No local participation change is claimed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameCommandResult' }
        '400':
