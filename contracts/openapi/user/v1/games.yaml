    CreateGameRequest:
      type: object
      additionalProperties: false
      description: |
        Creates one game. Free (`NO_PAYMENT`) creation is unchanged. When the managed commercial
        contour is enabled, the paid modes `SPLIT` and `SUBSCRIPTION` go through the managed WARN
        contour: the command is accepted as a `202` `CREATE_GAME` operation with `status = UNKNOWN`
        and `nextAction = WAIT_FOR_RECONCILIATION` while the game stays `PROVISIONING`. That
        response never reports `SUCCEEDED` or `FAILED`, and the client repeats the same operation
        read instead of starting a new purchase. `ORGANIZER_PAYS` is not part of the managed
        contour and is refused with `GAME_PAYMENT_MODE_MISMATCH`. When the contour is disabled,
        every paid mode keeps the existing `GAME_PAYMENT_REQUIRED` refusal, and the managed-only
        fields `subscriptionInstanceId`/`priceConsent` are not accepted (the legacy strict body
        allowlist applies, so such a request is `400 INVALID_REQUEST`). Clients send those fields
        only when the managed contour is enabled.
      required:
        - title
        - kind
        - visibility
        - stationId
        - startsAt
        - endsAt
        - timezone
        - capacity
        - paymentMode
        - waitlistEnabled
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        kind:
          $ref: '#/components/schemas/GameKind'
        visibility:
          $ref: '#/components/schemas/GameVisibility'
        stationId:
          type: string
          format: uuid
        courtId:
          type: [string, 'null']
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        capacity:
          type: integer
          enum: [2, 4]
        levelRange:
          oneOf:
            - $ref: '#/components/schemas/GameLevelRange'
            - type: 'null'
        paymentMode:
          type: string
          enum: [ORGANIZER_PAYS, SPLIT, SUBSCRIPTION, NO_PAYMENT]
        waitlistEnabled:
          type: boolean
        subscriptionInstanceId:
          type: string
          format: uuid
          description: |
            Server-side subscription product selection for a managed paid game create. LK2 only
            shape-validates it; ownership/eligibility is resolved by the booking/entitlement owner
            (as in paid JOIN) before any reservation. Never sent by the WARN advisory contour.
            Ignored for NO_PAYMENT.
        priceConsent:
          $ref: '#/components/schemas/GamePriceConsent'
    JoinGameRequest:
      type: object
      additionalProperties: false
      properties:
        expectedRevision:
          type: integer
          minimum: 0
        invitationId:
          type: string
          format: uuid
          description: Server-issued personal invitation addressed to the authenticated player.
        subscriptionInstanceId:
          type: string
          format: uuid
          description: Server-verified subscription product selection for a paid game. Ignored for NO_PAYMENT.
        priceConsent:
          $ref: '#/components/schemas/GamePriceConsent'
    GamePriceConsent:
      type: object
      additionalProperties: false
      required: [amountMinor, currency]
      description: Explicit echo of the server-owned price. It is not a client-side price decision.
      properties:
        amountMinor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        currency:
          type: string
          const: RUB
    CancelGameRequest:
      type: object
