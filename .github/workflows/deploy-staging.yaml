name: Build and deploy staging

on:
  workflow_dispatch:
    inputs:
      deploy_confirmation:
        description: Type DEPLOY_STAGING to deploy the main branch to staging
        required: false
        type: string
      routing_tenant_key:
        description: Active staging tenant whose routing plan is refreshed before live Home activation
        required: false
        type: string
      routing_actor_id:
        description: Operator UUID recorded for the just-in-time routing refresh
        required: false
        type: string
      routing_apply_confirmation:
        description: Type APPLY_ROUTING_PLAN to authorize the audited just-in-time routing refresh
        required: false
        type: string
      diagnose_home:
        description: Read-only live Home source diagnostics
        required: true
        type: boolean
        default: false
      diagnostic_phone_last4:
        description: Optional comma-separated phone suffixes for read-only player/delegation diagnostics
        required: false
        type: string
      recover_udisks:
        description: Restart a leaking udisks2 service, then run diagnostics
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.request.outputs.mode }}
    steps:
      - id: request
        name: Validate requested staging operation
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.deploy_confirmation }}
          ROUTING_TENANT_KEY: ${{ inputs.routing_tenant_key }}
          ROUTING_ACTOR_ID: ${{ inputs.routing_actor_id }}
          ROUTING_APPLY_CONFIRMATION: ${{ inputs.routing_apply_confirmation }}
          DIAGNOSE_HOME: ${{ inputs.diagnose_home }}
          DIAGNOSTIC_PHONE_LAST4: ${{ inputs.diagnostic_phone_last4 }}
          RECOVER_UDISKS: ${{ inputs.recover_udisks }}
          REQUEST_REF: ${{ github.ref }}
        run: |
          set -eu
          diagnostics_requested=false
          if [ "$DIAGNOSE_HOME" = 'true' ] || [ "$RECOVER_UDISKS" = 'true' ] || [ -n "$DIAGNOSTIC_PHONE_LAST4" ]; then
            diagnostics_requested=true
          fi
          if [ "$diagnostics_requested" = 'true' ]; then
            if [ -n "$DEPLOY_CONFIRMATION" ]; then
              echo '::error::Diagnostics cannot be combined with a deployment confirmation.'
              exit 1
            fi
            printf '%s\n' 'mode=diagnostics' >> "$GITHUB_OUTPUT"
            if [ -n "$DIAGNOSTIC_PHONE_LAST4" ] && ! printf '%s' "$DIAGNOSTIC_PHONE_LAST4" | grep -Eq '^[0-9]{4}(,[0-9]{4}){0,9}$'; then
              echo '::error::Player diagnostics require one to ten comma-separated four-digit phone suffixes.'
              exit 1
            fi
            exit 0
          fi
          if [ "$DEPLOY_CONFIRMATION" != 'DEPLOY_STAGING' ]; then
            echo '::error::Deployment requires the exact DEPLOY_STAGING confirmation.'
            exit 1
          fi
          if [ "$REQUEST_REF" != 'refs/heads/main' ]; then
            echo '::error::Staging deployment is allowed only from refs/heads/main.'
            exit 1
          fi
          if ! printf '%s' "$ROUTING_TENANT_KEY" | grep -Eq '^[a-z0-9][a-z0-9-]{1,62}$'; then
            echo '::error::Deployment requires a valid staging routing tenant key.'
            exit 1
          fi
          if ! printf '%s' "$ROUTING_ACTOR_ID" | grep -Eiq '^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'; then
            echo '::error::Deployment routing actor ID must be a UUID.'
            exit 1
          fi
          if [ "$ROUTING_APPLY_CONFIRMATION" != 'APPLY_ROUTING_PLAN' ]; then
            echo '::error::Deployment requires the exact APPLY_ROUTING_PLAN confirmation.'
            exit 1
          fi
          printf '%s\n' 'mode=deploy' >> "$GITHUB_OUTPUT"

  diagnose-home:
    needs: validate-request
    if: ${{ needs.validate-request.outputs.mode == 'diagnostics' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Join the staging tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.STAGING_HOST }}
      - name: Configure audited SSH
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Inspect active release metadata without values
        continue-on-error: true
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
            'sh -s -- /opt/phub/release.env' < deploy/jetson/inspect-release-env.sh
      - name: Inspect migration 0057 state read-only
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          checksum_line="$(sha256sum packages/database/migrations/0057_messaging_runtime.sql)"
          expected_checksum="${checksum_line%% *}"
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
            sh -s -- "$expected_checksum" < deploy/jetson/diagnose-migration-0057.sh
      - name: Inspect selected test-player delegations read-only
        if: ${{ inputs.diagnostic_phone_last4 != '' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          DIAGNOSTIC_PHONE_LAST4: ${{ inputs.diagnostic_phone_last4 }}
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
            sh -s -- "$DIAGNOSTIC_PHONE_LAST4" < deploy/jetson/diagnose-test-player-delegations.sh
      - name: Recover leaked udisks memory
        if: ${{ inputs.recover_udisks }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" '
            set -eu
            echo udisks_before
            systemctl status udisks2 --no-pager || true
            pid="$(pidof udisksd || true)"
            if [ -n "$pid" ]; then
              grep -E "^(Rss|Pss|Swap):" "/proc/$pid/smaps_rollup" || true
            fi
            sudo -n systemctl restart udisks2
            sleep 5
            echo udisks_after
            systemctl status udisks2 --no-pager || true
            free -m
          '
      - name: Inspect live Home source readiness
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" '
            set +e
            echo host_resources
            uptime
            free -m
            df -h /
            echo vmstat
            timeout 8 vmstat 1 5
            echo top_processes
            ps -eo state,pid,ppid,comm,%cpu,%mem,rss --sort=-%cpu | head -25
            echo docker_memory
            timeout 10 docker stats --no-stream --format \
              "container={{.Name}} cpu={{.CPUPerc}} memory={{.MemUsage}} block={{.BlockIO}}"
            echo unhealthy_healthchecks
            for container in phub-staging-api-1 phub-staging-realtime-1 phub-staging-worker-1; do
              docker inspect --format \
                "container={{.Name}} status={{.State.Health.Status}} failing_streak={{.State.Health.FailingStreak}} checks={{range .State.Health.Log}}{{.End}} exit={{.ExitCode}} output={{json .Output}}; {{end}}" \
                "$container"
            done
            exit 0
          '
      - name: Inspect public staging ingress
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          set +e
          for path in /healthz /manifest.json /health/live /health/ready; do
            echo "public_path=$path"
            curl \
              --connect-timeout 10 \
              --max-time 15 \
              --silent \
              --show-error \
              --write-out '\npublic_http_status=%{http_code}\n' \
              "${BASE_URL%/}$path"
          done
          canonical_base_url=https://lk.nano.padlhub.su
          manifest="$(curl --fail --silent --show-error --max-time 15 "$canonical_base_url/manifest.json")"
          entry_path="$(printf '%s' "$manifest" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).entry));
          ')"
          style_path="$(printf '%s' "$manifest" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).styles[0]));
          ')"
          for asset_path in "$entry_path" "$style_path"; do
            curl \
              --fail \
              --silent \
              --show-error \
              --range 0-65535 \
              --max-time 20 \
              --output /dev/null \
              --write-out "hop=github-public path=${asset_path} status=%{http_code} bytes=%{size_download} speed=%{speed_download} seconds=%{time_total}\n" \
              "$canonical_base_url$asset_path"
          done
          exit 0

  build:
    needs: validate-request
    if: ${{ needs.validate-request.outputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, api, worker, realtime, migrator]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/z6v6e6r/phub-${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            PHUB_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - run: |
          mkdir -p digests
          printf '%s' '${{ steps.image.outputs.digest }}' > digests/${{ matrix.service }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}
          retention-days: 30

  deploy:
    needs: [validate-request, build]
    if: ${{ always() && needs.validate-request.outputs.mode == 'deploy' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_RELEASE_BACKUP_DIR: /opt/phub/backups/releases/pre-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Join the staging tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.STAGING_HOST }}
      - name: Configure audited SSH
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - id: application-backup
        name: Preserve the active digest-pinned application release
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          scp deploy/jetson/backup-application.sh \
            "phub-deploy@$HOST:/opt/phub/backup-application.sh.next"
          scp deploy/jetson/rollback-application.sh \
            "phub-deploy@$HOST:/opt/phub/rollback-application.sh.next"
          ssh "phub-deploy@$HOST" '
            set -eu
            install -m 755 /opt/phub/backup-application.sh.next /opt/phub/backup-application.sh
            install -m 755 /opt/phub/rollback-application.sh.next /opt/phub/rollback-application.sh
            rm -f /opt/phub/backup-application.sh.next /opt/phub/rollback-application.sh.next
          '
          ssh "phub-deploy@$HOST" \
            "PHUB_BACKUP_ROOT=/opt/phub/backups/releases sh /opt/phub/backup-application.sh '$STAGING_RELEASE_BACKUP_DIR' BACKUP_STAGING_RELEASE"
          ssh "phub-deploy@$HOST" \
            "PHUB_ROLLBACK_BACKUP_ROOT=/opt/phub/backups/releases sh /opt/phub/rollback-application.sh '$STAGING_RELEASE_BACKUP_DIR' --validate-only"
          printf '%s\n' 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Install release and ingress definitions
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          scp deploy/compose.staging.yaml "phub-deploy@$HOST:/opt/phub/compose.yaml"
          scp deploy/jetson/nginx/default.conf "phub-deploy@$HOST:/opt/phub/nginx/default.conf"
          scp deploy/jetson/activate-live-home.sh "phub-deploy@$HOST:/opt/phub/activate-live-home.sh"
          scp deploy/jetson/run-client-routing-plan.sh \
            "phub-deploy@$HOST:/opt/phub/run-client-routing-plan.sh.next"
          scp scripts/set-client-routing-plan.ts \
            "phub-deploy@$HOST:/opt/phub/set-client-routing-plan.ts.next"
          scp deploy/jetson/verify-home-base.sh \
            "phub-deploy@$HOST:/opt/phub/verify-home-base.sh"
          scp deploy/jetson/verify-live-staging-data.sh \
            "phub-deploy@$HOST:/opt/phub/verify-live-staging-data.sh"
          scp deploy/jetson/verify-cup-integrations.sh \
            "phub-deploy@$HOST:/opt/phub/verify-cup-integrations.sh"
          scp deploy/jetson/tls-ingress/Caddyfile \
            "phub-deploy@$HOST:/opt/phub/tls-ingress/Caddyfile.next"
          ssh "phub-deploy@$HOST" '
            set -eu
            mv /opt/phub/run-client-routing-plan.sh.next /opt/phub/run-client-routing-plan.sh
            chmod 0755 /opt/phub/run-client-routing-plan.sh
            mv /opt/phub/set-client-routing-plan.ts.next /opt/phub/set-client-routing-plan.ts
            chmod 0644 /opt/phub/set-client-routing-plan.ts
            auth_env=/opt/phub/staging.auth.env
            auth_env_tmp="${auth_env}.$$"
            umask 077
            trap "rm -f \"$auth_env_tmp\"" EXIT HUP INT TERM
            {
              printf "%s\n" "VIVA_OAUTH_EXISTING_SUBJECT_BOOTSTRAP_ENABLED=true"
              printf "%s\n" "VIVA_DIRECT_READ_ENABLED=false"
              printf "%s\n" "VIVA_OAUTH_SUCCESS_REDIRECT_URL=https://lk.nano.padlhub.su/"
              printf "%s\n" "HOME_BASE_SYNC_ENABLED=true"
            } > "$auth_env_tmp"
            chmod 600 "$auth_env_tmp"
            mv "$auth_env_tmp" "$auth_env"
            trap - EXIT HUP INT TERM
          '
          {
            echo "REGISTRY=ghcr.io/z6v6e6r"
            echo "WEB_IMAGE_DIGEST=$(cat digests/web)"
            echo "API_IMAGE_DIGEST=$(cat digests/api)"
            echo "WORKER_IMAGE_DIGEST=$(cat digests/worker)"
            echo "REALTIME_IMAGE_DIGEST=$(cat digests/realtime)"
            echo "MIGRATOR_IMAGE_DIGEST=$(cat digests/migrator)"
            echo "RELEASE=${{ github.sha }}"
            echo "LATEST_MIGRATION=$(find packages/database/migrations -maxdepth 1 -type f -name '*.sql' -exec basename {} \; | sort | tail -1)"
            echo "S3_PUBLIC_ENDPOINT=${{ vars.STAGING_BASE_URL }}"
          } > release.env
          scp release.env "phub-deploy@$HOST:/opt/phub/release.env"
      - name: Verify real staging source configuration
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: ssh "phub-deploy@$HOST" 'sh /opt/phub/verify-live-staging-data.sh preflight'
      - name: Pull, migrate and deploy the same image digests
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "phub-deploy@$HOST" '
            set -eu
            trap "docker logout ghcr.io >/dev/null 2>&1 || true" EXIT
            docker login ghcr.io --username "${{ github.actor }}" --password-stdin
            cd /opt/phub
            compose() {
              docker compose --env-file infrastructure.env --env-file release.env "$@"
            }
            infrastructure() {
              docker compose --env-file infrastructure.env -f compose.infrastructure.yaml "$@"
            }
            available_kb="$(df -Pk / | tail -1 | tr -s " " | cut -d " " -f 4)"
            if [ "$available_kb" -lt 8388608 ]; then
              echo "Nano has less than 8 GiB free; pruning only unused Docker images."
              docker image prune --all --force
              available_kb="$(df -Pk / | tail -1 | tr -s " " | cut -d " " -f 4)"
            fi
            if [ "$available_kb" -lt 4194304 ]; then
              echo "Nano has less than 4 GiB free after safe image pruning."
              df -h /
              docker system df
              exit 1
            fi
            compose pull

            backup_dir=/opt/phub/backups
            backup_timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup_path="$backup_dir/postgres-pre-${{ github.sha }}-$backup_timestamp.dump"
            backup_tmp="$backup_path.tmp"
            mkdir -p "$backup_dir"
            trap "rm -f \"$backup_tmp\"; docker logout ghcr.io >/dev/null 2>&1 || true" EXIT
            infrastructure exec -T postgres sh -ec \
              "pg_dump -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" --format=custom --no-owner --no-acl" \
              > "$backup_tmp"
            test -s "$backup_tmp"
            infrastructure exec -T postgres pg_restore --list < "$backup_tmp" >/dev/null
            mv "$backup_tmp" "$backup_path"
            echo "Verified staging PostgreSQL backup: $backup_path"

            compose --profile migration run --rm migrator
            latest_migration="$(sed -n s/^LATEST_MIGRATION=//p release.env)"
            test -n "$latest_migration"
            infrastructure exec -T postgres sh -ec \
              "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -Atc \"select filename from public.schema_migrations\"" \
              | grep -Fx "$latest_migration"
            compose up -d --remove-orphans
            # The ingress configuration is bind-mounted. Recreate this one
            # stateless container so it loads the newly copied configuration.
            docker compose --env-file infrastructure.env -f compose.infrastructure.yaml up -d --force-recreate nginx

            service_is_healthy() {
              container_id="$(compose ps -q "$1")"
              [ -n "$container_id" ] &&
                [ "$(docker inspect --format "{{.State.Health.Status}}" "$container_id")" = "healthy" ]
            }

            ready=0
            attempt=0
            while [ "$attempt" -lt 36 ]; do
              if service_is_healthy api \
                && service_is_healthy realtime \
                && service_is_healthy worker; then
                ready=1
                break
              fi
              attempt=$((attempt + 1))
              sleep 5
            done
            if [ "$ready" -ne 1 ]; then
              compose ps -a
              compose logs --no-color --tail=160 api worker realtime
              exit 1
            fi
          '
      - name: Promote canonical Nano TLS ingress
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh "phub-deploy@$HOST" '
            set -eu
            cd /opt/phub/tls-ingress
            backup_dir=/opt/phub/backups
            backup_timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup_path="$backup_dir/Caddyfile-pre-${{ github.sha }}-$backup_timestamp"
            mkdir -p "$backup_dir"
            test -s Caddyfile.next
            cp Caddyfile "$backup_path"
            mv Caddyfile.next Caddyfile

            rollback_caddy() {
              cp "$backup_path" Caddyfile
              docker compose up -d --force-recreate caddy >/dev/null 2>&1 || true
            }

            if ! docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile; then
              rollback_caddy
              exit 1
            fi
            if ! docker compose up -d --force-recreate caddy; then
              rollback_caddy
              exit 1
            fi

            probe_canonical_ready() {
              curl --fail --silent \
                --connect-timeout 2 \
                --max-time 5 \
                --resolve lk.nano.padlhub.su:443:127.0.0.1 \
                "$1" >/dev/null
            }

            ingress_ready=0
            attempt=0
            while [ "$attempt" -lt 15 ]; do
              if probe_canonical_ready https://lk.nano.padlhub.su/health/ready \
                && probe_canonical_ready https://lk.nano.padlhub.su/realtime/health/ready; then
                ingress_ready=1
                break
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
            if [ "$ingress_ready" -ne 1 ]; then
              curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
                --resolve lk.nano.padlhub.su:443:127.0.0.1 \
                https://lk.nano.padlhub.su/health/ready >/dev/null || true
              curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
                --resolve lk.nano.padlhub.su:443:127.0.0.1 \
                https://lk.nano.padlhub.su/realtime/health/ready >/dev/null || true
              rollback_caddy
              exit 1
            fi
            location="$(curl --silent --show-error --output /dev/null --write-out "%{redirect_url}" \
              -H "Host: 185.155.18.146" http://127.0.0.1/games)"
            if test "$location" != "https://lk.nano.padlhub.su/games"; then
              rollback_caddy
              exit 1
            fi
            echo "Verified TLS ingress backup: $backup_path"
          '
      - name: Verify local HomeBase projections
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: ssh "phub-deploy@$HOST" 'sh /opt/phub/verify-home-base.sh'
      - name: Refresh the audited routing plan immediately before live Home activation
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          TENANT_KEY: ${{ inputs.routing_tenant_key }}
          ACTOR_ID: ${{ inputs.routing_actor_id }}
        run: |
          operation_id="routing-mixed-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          reason="staging-live-home-activation-${GITHUB_SHA}"
          ssh "phub-deploy@$HOST" /opt/phub/run-client-routing-plan.sh \
            "$TENANT_KEY" "$ACTOR_ID" "$operation_id" "$operation_id" "$reason" false
          ssh "phub-deploy@$HOST" /opt/phub/run-client-routing-plan.sh \
            "$TENANT_KEY" "$ACTOR_ID" "$operation_id" "$operation_id" "$reason" true
      - name: Activate and verify live Home projection
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: ssh "phub-deploy@$HOST" 'sh /opt/phub/activate-live-home.sh'
      - name: Verify real staging identities and Games
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: ssh "phub-deploy@$HOST" 'sh /opt/phub/verify-live-staging-data.sh'
      - name: Verify CUP campaigns and notifications binding
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: ssh "phub-deploy@$HOST" 'sh /opt/phub/verify-cup-integrations.sh local-padel'
      - name: Verify the web entrypoint
        env:
          SMOKE_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          curl --fail --silent --show-error "$SMOKE_BASE_URL/" | grep -q 'id="phub-app"'
          curl --fail --silent --show-error "${SMOKE_BASE_URL%/}/manifest.json" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const manifest = JSON.parse(input);
              if (manifest.release !== process.env.GITHUB_SHA) {
                console.error(`Expected web release ${process.env.GITHUB_SHA}, received ${manifest.release}`);
                process.exit(1);
              }
            });
          '
      - name: Staging smoke test
        env:
          SMOKE_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: npm ci --ignore-scripts && npm run smoke
      - name: Roll back a failed staging application release
        if: ${{ (failure() || cancelled()) && steps.application-backup.outputs.ready == 'true' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh "phub-deploy@$HOST" \
            "PHUB_ROLLBACK_BACKUP_ROOT=/opt/phub/backups/releases sh /opt/phub/rollback-application.sh '$STAGING_RELEASE_BACKUP_DIR' --confirm=ROLLBACK_STAGING_RELEASE"
