openapi: 3.1.0
info:
  title: PadlHub User API
  version: 1.25.0
  description: Canonical user-facing API. Public identifiers are PadlHub UUIDs.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.padlhub.ru/user/api/v1
security:
  - PadlHubUserJwt: []
tags:
  - name: gift-certificates
    description: Published gift certificate catalog for authenticated clients.
  - name: bookings
    description: User booking timeline and explainable booking discovery.
  - name: profiles
    description: Viewer-filtered profiles and owner-managed privacy policy.
  - name: games
    description: Viewer-aware game reads and explicit idempotent commands.
  - name: tournaments
    description: Authenticated tournament detail reads.
  - name: locations
    description: Published PadlHub location cards and detail views.
  - name: messaging
    description: Tenant-gated direct and game conversations with ordered HTTP history and recoverable realtime hints.
  - name: communities
    description: Authenticated canonical community membership reads and commands.
  - name: realtime
    description: Short-lived one-time tickets for the PadlHub WebSocket gateway.
  - name: subscriptions
    description: Non-binding WARN-only subscription-runtime checks through a server-owned actor delegation.
paths:
  /{tenantKey}/subscription-runtime/quote:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [subscriptions]
      operationId: quoteManagedSubscriptionRuntimeWarn
      summary: Evaluate a non-binding managed-subscription advisory in WARN mode
      description: |
        Authenticates the caller with the PadlHub user JWT, resolves tenant membership and the
        active PadlHub session server-side, then resolves the server-owned synced VIVA identity
        mapping. LK2 signs a short-lived single-use actor delegation bound to the tenant, canonical
        request digest, X-Correlation-ID and Idempotency-Key digest. Only the internal ph-admin
        recipient receives and verifies that delegation; public clients MUST NOT send delegation,
        provider identifiers, integration credentials or actor fields.

        A successful response proves that the recipient accepted the signature, claims and all
        bindings. Recipient-side replay protection rejects reuse of the same delegation. Retrying
        this public operation must preserve the Idempotency-Key, but LK2 may mint a fresh short-lived
        delegation for the retry. The result is advisory and non-binding: this endpoint never
        reserves entitlement, creates payment, changes a subscription, calls VIVA, or enables
        enforcement. Rejected verification is returned as a typed 401, 403 or 409 error rather than
        as a successful WARN response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedSubscriptionWarnQuoteRequest'
      responses:
        '200':
          description: Verified, non-binding WARN-only advisory.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
            Cache-Control:
              description: This actor-bound advisory must not be stored.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedSubscriptionWarnQuoteResponse'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: '#/components/responses/SubscriptionRuntimeDelegationRejected'
        '403':
          $ref: '#/components/responses/SubscriptionRuntimeDelegationForbidden'
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: '#/components/responses/SubscriptionRuntimeDelegationConflict'
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/messaging/realtime-ticket:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
    post:
      tags: [messaging]
      operationId: issueMessagingRealtimeTicket
      summary: Issue a one-time session-bound realtime connection ticket
      description: |
        The 30-second ticket is accepted once. Current session, user permission and tenant runtime
        gates are revalidated before issuance and again by the realtime process. Each DIRECT or GAME
        subscription and fanout rechecks its kind-specific current authorization. Message bodies are
        never included in the ticket or broker event.
      responses:
        '200':
          description: One-time ticket for the tenant realtime WebSocket endpoint.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagingRealtimeTicket'
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '409':
          $ref: '#/components/responses/CommandConflict'
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/messaging/users/{otherUserId}/block:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: otherUserId
        in: path
        required: true
        description: Tenant-local PadlHub UUID of the other direct-messaging participant.
        schema:
          type: string
          format: uuid
    put:
      tags: [messaging]
      operationId: blockDirectMessagingUser
      summary: Block direct messaging with another PadlHub user
      description: |
        Creates the authenticated user's directed block. Either direction makes the pair's DIRECT
        conversation inaccessible to both participants without deleting stored history. GAME
        conversation authorization remains roster-based and is unchanged.
      responses:
        '200':
          description: Stored result of the idempotent block command.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBlockCommandResult'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: '#/components/responses/CommandConflict'
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
    delete:
      tags: [messaging]
      operationId: unblockDirectMessagingUser
      summary: Remove the authenticated user's directed direct-messaging block
      description: |
        Removes only the caller's directed block. DIRECT access remains denied while the reverse
        participant-to-caller block exists. Stored conversations and messages are never rewritten.
      responses:
        '200':
          description: Stored result of the idempotent unblock command.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBlockCommandResult'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: '#/components/responses/CommandConflict'
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/tournaments/{tournamentId}/participants:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: tournamentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [tournaments]
      operationId: getTournamentParticipants
      summary: Read the safe participant projection for one tournament
      responses:
        '200':
          description: Current bounded participant projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentParticipantRoster'
        '401':
          $ref: '#/components/responses/AuthenticationRejected'
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/gift-certificate-catalog:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
    get:
      tags: [gift-certificates]
      operationId: getUserGiftCertificateCatalog
      summary: Read the currently published gift certificate catalog
      responses:
        '200':
          description: Published tenant catalog available to authenticated clients.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: ../../public/v1/openapi.yaml#/components/schemas/PublicGiftCertificateCatalog
        '401':
          $ref: '#/components/responses/AuthenticationRejected'
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/gift-certificate-orders:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
    post:
      tags: [gift-certificates]
      operationId: createUserGiftCertificateOrder
      summary: Create an authenticated server-priced gift certificate order
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../public/v1/openapi.yaml#/components/schemas/CreateGiftCertificateOrderRequest
      responses:
        '201':
          description: Authenticated order created.
          content:
            application/json:
              schema:
                $ref: ../../public/v1/openapi.yaml#/components/schemas/GiftCertificateOrderCommandResult
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: '#/components/responses/AuthenticationRejected'
        '409':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '422':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/gift-certificate-orders/{orderId}:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [gift-certificates]
      operationId: getUserGiftCertificateOrder
      summary: Read an order owned by the authenticated buyer
      responses:
        '200':
          description: Buyer-owned order.
          content:
            application/json:
              schema:
                $ref: ../../public/v1/openapi.yaml#/components/schemas/GiftCertificateOrder
        '401':
          $ref: '#/components/responses/AuthenticationRejected'
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
  /{tenantKey}/gift-certificate-orders/{orderId}/certificate.pdf:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [gift-certificates]
      operationId: downloadUserGiftCertificate
      summary: Download an issued certificate PDF owned by the authenticated buyer
      responses:
        '200':
          description: Buyer-owned private PDF artifact.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/AuthenticationRejected'
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/gift-certificate-orders/{orderId}/payment-intents:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [gift-certificates]
      operationId: createUserGiftCertificatePaymentIntent
      summary: Create a local sandbox payment intent for a buyer-owned order
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Provider-neutral sandbox payment intent.
          content:
            application/json:
              schema:
                $ref: ../../public/v1/openapi.yaml#/components/schemas/GiftCertificatePaymentIntent
        '401':
          $ref: '#/components/responses/AuthenticationRejected'
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/gift-certificate-payment-sandbox/{paymentId}:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [gift-certificates]
      operationId: getUserGiftCertificatePaymentSandbox
      summary: Open the authenticated local-only hosted sandbox payment page
      responses:
        '200':
          description: HTML page that refreshes the PadlHub session before local confirmation.
          content:
            text/html:
              schema:
                type: string
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/gift-certificate-payments/{paymentId}/sandbox-confirm:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [gift-certificates]
      operationId: confirmUserGiftCertificateSandboxPayment
      summary: Confirm a local-only buyer-owned sandbox payment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Order and payment confirmed exactly once.
          content:
            application/json:
              schema:
                $ref: ../../public/v1/openapi.yaml#/components/schemas/GiftCertificatePaymentConfirmation
        '401':
          $ref: '#/components/responses/AuthenticationRejected'
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/auth/viva/authorize:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: createVivaOAuthAuthorization
      summary: Start server-owned Viva OAuth with PKCE
      description: |
        Creates an opaque, one-time OAuth state and returns the Viva authorization URL. The
        response sets a short-lived HttpOnly browser-binding cookie, so a cross-origin browser
        client must send the request with credentials enabled. No Viva credential is returned.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VivaOAuthAuthorizationRequest'
      responses:
        '200':
          description: Redirect URL for the selected Viva identity provider.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
            Set-Cookie:
              $ref: '#/components/headers/OAuthBrowserCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VivaOAuthAuthorization'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/auth/viva/reauthorize:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: createVivaOAuthRecovery
      summary: Recover an expired Viva delegation without recording new legal acceptance
      description: |
        Available only to an authenticated PadlHub user who has already accepted the current
        public-offer and personal-data-policy versions. The recovery flow is bound to that user
        and to the browser that started it through a short-lived HttpOnly cookie. Retrying the
        same request with the same Idempotency-Key returns the same authorization redirect;
        reusing that key with different request data returns a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VivaOAuthRecoveryRequest'
      responses:
        '200':
          description: Server-owned Yandex OAuth redirect URL.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
            Set-Cookie:
              $ref: '#/components/headers/OAuthBrowserCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VivaOAuthAuthorization'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: '#/components/responses/AuthenticationRejected'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/auth/viva/callback:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
    get:
      operationId: completeVivaOAuthAuthorization
      summary: Complete Viva OAuth sign-in or authenticated delegation recovery
      description: |
        The callback must carry the short-lived HttpOnly cookie set for the initiating browser.
        Initial sign-in creates a PadlHub session. Authenticated recovery is bound to the active
        PadlHub session family and replaces only the Viva delegation; it does not create or rotate
        the PadlHub session.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: |
            The browser is redirected to the configured cabinet URL. Initial sign-in sets the
            PadlHub refresh cookie; authenticated recovery preserves the existing refresh cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/OAuthCallbackCookies'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: '#/components/responses/AuthenticationRejected'
        '409':
          $ref: '#/components/responses/AuthIdentityConflict'
        '410':
          $ref: '#/components/responses/AuthenticationRejected'
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/auth/viva/access:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: issueVivaDelegatedAccessToken
      summary: Issue a short-lived Viva user access token
      description: |
        Exchanges a one-time callback handoff or the server-encrypted Viva refresh delegation.
        The Viva refresh token is never returned. The access token is restricted to browser memory
        and the approved direct-Viva operation allowlist.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VivaDelegatedAccessRequest'
      responses:
        '200':
          description: Short-lived Viva access token for the authenticated PadlHub user.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VivaDelegatedAccess'
        '401':
          $ref: '#/components/responses/AuthenticationRejected'
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '409':
          $ref: '#/components/responses/AuthenticationRejected'
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/auth/challenges:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: createAuthChallenge
      summary: Request a provider-neutral authentication challenge
      description: |
        Starts phone authentication without exposing the active identity provider.
        The public request and response remain PadlHub-owned when that provider changes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChallengeRequest'
      responses:
        '202':
          description: The one-time-code challenge was accepted.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChallenge'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/auth/challenges/{challengeId}/verify:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/ChallengeId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: verifyAuthChallenge
      summary: Verify a challenge and create a PadlHub session
      description: |
        Verifies the one-time code through the active identity provider, maps the
        provider subject to a PadlHub UUID and returns only a PadlHub access JWT.
        The rotating refresh token is delivered exclusively through the HttpOnly
        `phub_refresh` cookie; external identity tokens are never returned to clients.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAuthChallengeRequest'
      responses:
        '200':
          description: The challenge was verified and a PadlHub session was created.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSession'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: '#/components/responses/AuthenticationRejected'
        '409':
          $ref: '#/components/responses/AuthenticationRejected'
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '410':
          $ref: '#/components/responses/AuthenticationRejected'
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/auth/session/refresh:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/RefreshSessionIntent'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: refreshAuthSession
      summary: Rotate the refresh cookie and issue a new PadlHub access JWT
      description: |
        Uses the HttpOnly `phub_refresh` cookie. The refresh credential is rotated
        through `Set-Cookie` and is never exposed in the response body.
      security:
        - PadlHubRefreshCookie: []
      responses:
        '200':
          description: The session was refreshed and its cookie was rotated.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSession'
        '401':
          $ref: '#/components/responses/AuthenticationRejected'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '409':
          $ref: '#/components/responses/AuthenticationRejected'
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/auth/session:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/LogoutSessionIntent'
      - $ref: '#/components/parameters/IdempotencyKey'
    delete:
      operationId: revokeAuthSession
      summary: Revoke the current PadlHub refresh session
      description: |
        Revokes the session identified by the HttpOnly `phub_refresh` cookie and
        expires that cookie. The operation never forwards an external identity token.
      security: []
      responses:
        '204':
          description: The session was revoked or was already absent.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
        '401':
          $ref: '#/components/responses/AuthenticationRejected'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
