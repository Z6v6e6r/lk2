<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Вход в ПадлХАБ</title>
    <script>
      // An unclaimed App Link must not retain the one-time fragment in browser history.
      history.replaceState(null, '', location.pathname);
    </script>
  </head>
  <body>
    <main>
      <h1>Вернитесь в приложение ПадлХАБ</h1>
      <p>
        Если приложение не открылось, разрешите ему открывать поддерживаемые ссылки в настройках
        Android и начните вход заново.
      </p>
    </main>
  </body>
</html>
