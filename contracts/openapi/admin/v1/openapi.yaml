openapi: 3.1.0
info:
  title: PadlHub Admin API
  version: 1.5.0
  description: Canonical tenant-scoped CUP boundary for audited operator commands.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.padlhub.ru
security:
  - PadlHubAdminJwt: []
tags:
  - name: Notifications
    description: Audited manual notification operations available to authorized CUP staff.
  - name: Locations
    description: Tenant-scoped editorial profiles for PadlHub public locations.
  - name: GiftCertificates
    description: Versioned gift certificate catalog management for authorized CUP staff.
  - name: Communities
    description: Bounded CUP review of canonical community JOIN and REJOIN requests.
  - name: LevelEligibility
    description: Versioned tenant and sport participation eligibility policy management.
paths:
  /admin/api/v1/{tenantKey}/community-join-requests/pending:
    get:
      tags: [Communities]
      operationId: listPendingCommunityJoinRequests
      summary: List a bounded page of pending canonical JOIN and REJOIN requests
      description: |
        Requires the server-side `communities.moderation.read` capability. Tenant and operator
        identity come from the phub-admin JWT. This endpoint always filters to PENDING requests and
        never accepts an arbitrary status, target user, actor or role selector. The opaque cursor is
        bound to the optional community filter.
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: communityId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 16
            maxLength: 512
      responses:
        '200':
          description: Pending requests ordered by creation time and UUID using a keyset cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommunityJoinRequestPage'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /admin/api/v1/{tenantKey}/community-join-requests/{requestId}/approve:
    post:
      tags: [Communities]
      operationId: approveCommunityJoinRequest
      summary: Approve a pending JOIN or REJOIN request
      description: |
        Requires `communities.join.decide`. Tenant and decision actor are derived from the
        phub-admin JWT; the body cannot select a user, community, membership role or resulting
        status. Both revisions are checked while membership, request, idempotency result, audit and
        outbox state are committed in one transaction. Stable conflicts include
        `COMMUNITY_MEMBERSHIP_REVISION_CONFLICT`, `COMMUNITY_JOIN_REQUEST_REVISION_CONFLICT` and
        `IDEMPOTENCY_KEY_REUSED`.
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCommunityJoinRequestDecisionRequest'
      responses:
        '200':
          description: Request approved and canonical membership activated, or idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommunityJoinRequestDecisionResult'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /admin/api/v1/{tenantKey}/community-join-requests/{requestId}/reject:
    post:
      tags: [Communities]
      operationId: rejectCommunityJoinRequest
      summary: Reject a pending JOIN or REJOIN request with a bounded reason code
      description: |
        Requires `communities.join.decide`. Tenant and decision actor are derived from the
        phub-admin JWT. The uppercase reason code is audit metadata, not permission to choose the
        resulting membership state. Both revisions are checked in the same transaction as request,
        idempotency, audit and outbox changes. Stable conflicts match the approve command.
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCommunityJoinRequestRejectRequest'
      responses:
        '200':
          description: Request rejected, or the originally stored idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommunityJoinRequestDecisionResult'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /admin/api/v1/{tenantKey}/communities/{communityId}/direct-invite-quota-grants:
    post:
      tags: [Communities]
      operationId: createCommunityDirectInviteQuotaGrant
      summary: Create an audited one-time DIRECT invite quota grant
      description: |
        Requires the admin-audience `communities.invite.quota.override` capability and the
        `X-App-Platform: cup-admin` client boundary. Tenant and operator are derived from the
        verified phub-admin JWT. `reasonCode` and `ticketId` are mandatory audit evidence; callers
        cannot provide the capability, grant actor, invite issuer, membership revision, role,
        expiry, status or token. The server creates an ACTIVE community-level grant with an exact
        24-hour TTL. It is consumed atomically by the next successful issue command that exceeds a
        quota; that command still derives its issuer from the authenticated User API principal and
        requires an ACTIVE OWNER or ADMIN membership. This endpoint never creates an invite or
        returns an invite token.
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: communityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCommunityDirectInviteQuotaGrantRequest'
      responses:
        '201':
          description: Active 24-hour quota grant, or its original idempotent replay.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Idempotent-Replayed:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommunityDirectInviteQuotaGrant'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          description: |
            `ADMIN_CLIENT_REQUIRED`, `COMMUNITY_DIRECT_INVITE_QUOTA_GRANT_PERMISSION_REQUIRED`,
            or `COMMUNITY_DIRECT_INVITE_QUOTA_GRANT_ACTOR_INACTIVE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          description: |
            `COMMUNITY_DIRECT_INVITE_QUOTA_GRANT_ACTIVE` when an unconsumed, unexpired grant already
            exists, or `IDEMPOTENCY_KEY_REUSED` for a conflicting replay key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /admin/api/v1/{tenantKey}/users/{userId}/community-create-quota-grants:
    post:
      tags: [Communities]
      operationId: createCommunityCreateQuotaGrant
      summary: Create an audited one-use community creation quota grant
      description: |
        Requires the exact admin-audience `communities.create.quota.override` capability and
        `X-App-Platform: cup-admin`. Tenant and operator come from the verified phub-admin JWT;
        the subject comes from the path. The strict body accepts only one or both server-defined
        scopes plus mandatory reason and ticket evidence. The grant expires after exactly 24 hours
        and is consumed atomically only by a successful create that exceeds every selected limit.
        It never applies to ownership transfer, and the User API cannot select a grant or override.
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCommunityCreateQuotaGrantRequest'
      responses:
        '201':
          description: Active 24-hour user-scoped grant, or its idempotent replay.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Idempotent-Replayed:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommunityCreateQuotaGrant'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /admin/api/v1/{tenantKey}/community-content/pending:
    get:
      tags: [Communities]
      operationId: listPendingCommunityContent
      summary: List a bounded oldest-first page of posts awaiting moderation
      description: |
        CUP-only endpoint requiring `communities.content.moderation.read`. Tenant and operator are
        derived from the phub-admin JWT. The server returns only `PENDING_MODERATION` posts; callers
        cannot select another status, actor or author. The opaque keyset cursor is bound to the
        optional community filter and the response is never cached.
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: communityId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 16
            maxLength: 1024
      responses:
        '200':
          description: Pending posts ordered by update time and UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommunityPendingPostPage'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /admin/api/v1/{tenantKey}/communities/{communityId}/content/media/{mediaId}/variants/{variant}/url:
    get:
      tags: [Communities]
      operationId: getCommunityModerationMediaReadGrant
      summary: Issue a short-lived exact-version image URL for CUP moderation preview
      description: |
        CUP-only endpoint requiring `communities.content.moderation.read`. The media must belong to
        the current immutable revision of a community post. The object-store URL is short-lived,
        exact-version and never persisted in the moderation queue.
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - $ref: '#/components/parameters/CommunityId'
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: variant
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AdminCommunityMediaVariantName'
      responses:
        '200':
          description: Short-lived exact-version read grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommunityMediaReadGrant'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /admin/api/v1/{tenantKey}/community-media/scans/{mediaId}/replay:
    post:
      tags: [Communities]
      operationId: replayFailedCommunityMediaScan
      summary: Replay a terminally failed community-media malware scan
      description: |
        CUP-only recovery command requiring `communities.content.moderation.decide`. Only a scan
        marked terminally failed can be replayed. The command is tenant-scoped, idempotent and
        records its operator reason in the audit trail.
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCommunityMediaReplayRequest'
      responses:
        '200':
          description: The scan was released for a bounded fresh retry or the original result was replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommunityMediaReplayResult'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /admin/api/v1/{tenantKey}/community-media/gc-jobs/{jobId}/replay:
    post:
      tags: [Communities]
      operationId: replayDeadCommunityMediaGcJob
      summary: Replay a terminally dead community-media garbage-collection job
      description: |
        CUP-only recovery command requiring `communities.content.moderation.decide`. Only a GC job
        marked terminally dead can be replayed. The command is tenant-scoped, idempotent and records
        its operator reason in the audit trail.
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCommunityMediaReplayRequest'
      responses:
        '200':
          description: The GC job was released for a bounded fresh retry or the original result was replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommunityMediaReplayResult'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /admin/api/v1/{tenantKey}/communities/{communityId}/content/posts/{postId}/approve:
    post:
      tags: [Communities]
      operationId: approveCommunityPost
      summary: Publish a post awaiting moderation
      description: |
        CUP-only command requiring `communities.content.moderation.decide`. Only
        `PENDING_MODERATION` can become `PUBLISHED`. The revision, immutable moderation evidence,
        audit record, durable community event and outbox record are committed atomically.
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/CommunityPostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCommunityContentRevisionRequest'
      responses:
        '200':
          description: Published post or the original idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommunityPost'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /admin/api/v1/{tenantKey}/communities/{communityId}/content/posts/{postId}/reject:
    post:
      tags: [Communities]
      operationId: rejectCommunityPost
      summary: Reject a post awaiting moderation while retaining its body and history
      description: |
        CUP-only command requiring `communities.content.moderation.decide`. Only
        `PENDING_MODERATION` can become `HIDDEN`; the structured reason is mandatory. The author may
        edit the hidden post, which creates another immutable revision and always moves it back to
        `PENDING_MODERATION`. It cannot become visible again without a new moderation approval.
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/CommunityPostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCommunityContentReasonedRequest'
      responses:
        '200':
          description: Rejected hidden post or the original idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommunityPost'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /admin/api/v1/{tenantKey}/communities/{communityId}/content/posts/{postId}/hide:
    post:
      tags: [Communities]
      operationId: hideCommunityPost
      summary: Hide a published post with structured audit evidence
      description: |
        CUP-only command requiring `communities.content.moderation.decide`. Only `PUBLISHED` can
        become `HIDDEN`; body and revision history are retained. The bounded uppercase reason code
        is mandatory evidence and cannot select the actor or resulting status.
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/CommunityPostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCommunityContentReasonedRequest'
      responses:
        '200':
          description: Hidden post or the original idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommunityPost'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /admin/api/v1/{tenantKey}/communities/{communityId}/content/posts/{postId}/restore:
    post:
      tags: [Communities]
      operationId: restoreCommunityPost
      summary: Restore a hidden post with structured audit evidence
      description: |
        CUP-only command requiring `communities.content.moderation.decide`. Only `HIDDEN` can become
        `PUBLISHED`. Optimistic revision control prevents stale moderation decisions.
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/CommunityPostId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCommunityContentReasonedRequest'
      responses:
        '200':
          description: Restored post or the original idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommunityPost'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /admin/api/v1/{tenantKey}/communities/{communityId}/content/posts/{postId}/comments/{commentId}/hide:
    post:
      tags: [Communities]
      operationId: hideCommunityComment
      summary: Hide a published comment with structured audit evidence
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/CommunityPostId'
        - $ref: '#/components/parameters/CommunityCommentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCommunityContentReasonedRequest'
      responses:
        '200':
          description: Hidden comment or the original idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommunityComment'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /admin/api/v1/{tenantKey}/communities/{communityId}/content/posts/{postId}/comments/{commentId}/restore:
    post:
      tags: [Communities]
      operationId: restoreCommunityComment
      summary: Restore a hidden comment when its parent post is published
      parameters:
        - $ref: '#/components/parameters/TenantKey'
        - $ref: '#/components/parameters/CommunityId'
        - $ref: '#/components/parameters/CommunityPostId'
        - $ref: '#/components/parameters/CommunityCommentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCommunityContentReasonedRequest'
      responses:
        '200':
          description: Restored comment or the original idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommunityComment'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /admin/api/v1/{tenantKey}/notifications/capabilities:
    get:
      tags: [Notifications]
      operationId: getAdminNotificationCapabilities
      summary: Return the effective notification channels available to CUP
      parameters:
        - $ref: '#/components/parameters/TenantKey'
      responses:
        '200':
          description: Effective channel availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotificationCapabilities'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
  /admin/api/v1/{tenantKey}/notifications/recipients/resolve:
    post:
      tags: [Notifications]
      operationId: resolveAdminNotificationRecipients
      summary: Resolve active PadlHub recipients by phone number without persisting the input
      parameters:
        - $ref: '#/components/parameters/TenantKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRecipientRequest'
      responses:
        '200':
          description: Resolved recipients and masked unresolved inputs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNotificationRecipientResolution'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
  /admin/api/v1/{tenantKey}/notifications/campaigns:
    post:
      tags: [Notifications]
      operationId: createAdminNotificationCampaign
      summary: Create an audited idempotent notification campaign
      parameters:
