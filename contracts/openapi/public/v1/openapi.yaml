openapi: 3.1.0
info:
  title: PadlHub Public API
  version: 1.1.0
  description: Anonymous PadlHub boundary. Commands are explicitly idempotent and session-scoped.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.padlhub.ru/public/api/v1
security: []
tags:
  - name: games
    description: Anonymous discovery of public scheduled games.
  - name: tournaments
    description: Anonymous discovery of bounded tournament summaries.
  - name: coach-games
    description: Anonymous discovery of bounded Viva-primary coach-game summaries.
  - name: gift-certificates
    description: Published tenant-owned gift certificate catalog.
  - name: locations
    description: Public delivery of tenant-owned location gallery media.
  - name: profiles
    description: Stable delivery of PadlHub-owned public profile photos.
paths:
  /media/profile-photos/{tenantId}/{deliveryId}:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [profiles]
      operationId: getPublicProfilePhoto
      summary: Stream the current PadlHub-owned profile photo
      responses:
        '200':
          description: Current normalized WebP profile photo.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            image/webp:
              schema:
                type: string
                contentEncoding: binary
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/gift-certificate-catalog:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
    get:
      tags: [gift-certificates]
      operationId: getPublicGiftCertificateCatalog
      summary: Load the currently published gift certificate catalog
      description: |
        Returns one immutable published catalog version. Prices are server-owned minor-unit values;
        the response contains no order, payment, recipient, activation or provider data.
      responses:
        '200':
          description: Published catalog available for the current tenant and time.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicGiftCertificateCatalog'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/gift-certificate-media/{assetId}:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: assetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [gift-certificates]
      operationId: getPublicGiftCertificateMedia
      summary: Redirect to a short-lived private media URL
      responses:
        '302':
          description: Short-lived signed object-storage URL.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/location-media/{assetId}:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: assetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [locations]
      operationId: getPublicLocationMedia
      summary: Redirect to a short-lived location gallery media URL
      responses:
        '302':
          description: Short-lived signed WebP object-storage URL.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/gift-certificate-orders:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
    post:
      tags: [gift-certificates]
      operationId: createPublicGiftCertificateOrder
      summary: Create a guest order from one published catalog version
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGiftCertificateOrderRequest'
      responses:
        '201':
          description: Server-priced order and HttpOnly purchase session created.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCertificateOrderCommandResult'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/gift-certificate-orders/{orderId}:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/GiftCertificateOrderId'
    get:
      tags: [gift-certificates]
      operationId: getPublicGiftCertificateOrder
      summary: Read a guest order through its HttpOnly purchase session
      responses:
        '200':
          description: Session-owned order with masked email addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCertificateOrder'
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
  /{tenantKey}/gift-certificate-orders/{orderId}/certificate.pdf:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/GiftCertificateOrderId'
    get:
      tags: [gift-certificates]
      operationId: downloadPublicGiftCertificate
      summary: Download a session-owned issued certificate PDF
      responses:
        '200':
          description: Buyer-owned private PDF artifact.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/gift-certificate-orders/{orderId}/payment-intents:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/GiftCertificateOrderId'
    post:
      tags: [gift-certificates]
      operationId: createPublicGiftCertificatePaymentIntent
      summary: Create the local hosted-payment sandbox action
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Provider-neutral payment intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCertificatePaymentIntent'
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/gift-certificate-payment-sandbox/{paymentId}:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [gift-certificates]
      operationId: getPublicGiftCertificatePaymentSandbox
      summary: Open the local-only hosted sandbox payment page
      responses:
        '200':
          description: HTML page that performs no real charge.
          content:
            text/html:
              schema:
                type: string
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/gift-certificate-payments/{paymentId}/sandbox-confirm:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [gift-certificates]
      operationId: confirmPublicGiftCertificateSandboxPayment
      summary: Confirm a local-only sandbox payment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Order and payment confirmed exactly once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCertificatePaymentConfirmation'
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/games:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
    get:
      tags: [games]
      operationId: listPublicGames
      summary: Discover public scheduled games
      description: |
        Returns one keyset-paginated card projection version. The operation never selects phones,
        provider identifiers, booking identifiers, payment references, raw metadata or audit data.
      parameters:
        - name: stationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: startsFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: startsTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GameKind'
        - name: levelFrom
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GamePlayerLevel'
        - name: levelTo
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GamePlayerLevel'
        - name: availability
          in: query
          required: false
          schema:
            type: string
            enum: [JOINABLE, INCLUDE_FULL]
            default: JOINABLE
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 16
            maxLength: 512
      responses:
        '200':
          description: One page of safe public game cards.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicGameCardPage'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/tournaments:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
    get:
      tags: [tournaments]
      operationId: listPublicTournamentSummaries
      summary: Discover public tournament summaries
      description: |
        Returns at most fifty summary cards for a bounded fifteen-day range. The operation never
        returns participant arrays, names, phones, provider identifiers, payment data or mechanics.
        Upstream schedule reads are fresh/stale cached and single-flight per date.
      parameters:
        - name: dateFrom
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: true
          description: Exclusive upper date bound; the range may contain at most fifteen days.
          schema:
            type: string
            format: date
        - name: availability
          in: query
          required: false
          schema:
            type: string
            enum: [JOINABLE, INCLUDE_FULL]
            default: INCLUDE_FULL
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Bounded summary cards without tournament rosters.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTournamentSummaryPage'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/tournaments/{summaryId}:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: summaryId
        in: path
        required: true
        description: Stable PadlHub tournament-summary UUID.
        schema:
          type: string
          format: uuid
    get:
      tags: [tournaments]
      operationId: getPublicTournamentSummary
      summary: Load one public tournament summary
      description: |
        Resolves one PadlHub tournament UUID within a bounded fifteen-day range. The server stops
        reading schedule dates as soon as the requested summary is found and never returns provider
        identifiers, participant contact data, payment data or tournament mechanics.
      parameters:
        - name: dateFrom
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: true
          description: Exclusive upper date bound; the range may contain at most fifteen days.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Requested tournament summary.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTournamentSummary'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/tournaments/{summaryId}/organizer-avatar:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: summaryId
        in: path
        required: true
        description: Stable PadlHub tournament-summary UUID.
        schema:
          type: string
          format: uuid
    get:
      tags: [tournaments]
      operationId: getPublicTournamentOrganizerAvatar
      summary: Load a locally cached tournament organizer avatar
      description: |
        Reads the PadlHub-owned WebP cache first and uses the upstream source only on a cache miss.
        The upstream media URL and provider identifiers remain server-side.
      responses:
        '200':
          description: Organizer avatar normalized as WebP.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/coach-games:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
    get:
      tags: [coach-games]
      operationId: listPublicCoachGameSummaries
      summary: Discover public coach-game summaries
      description: |
        Returns at most fifty summary cards for a bounded fifteen-day range. The operation reads one
        Viva schedule version per date and never returns exercise, studio, court or trainer provider
        identifiers, trainer media URLs, client arrays or booking credentials.
      parameters:
        - name: dateFrom
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: true
          description: Exclusive upper date bound; the range may contain at most fifteen days.
          schema:
            type: string
            format: date
        - name: availability
          in: query
          required: false
          schema:
            type: string
            enum: [JOINABLE, INCLUDE_FULL]
            default: INCLUDE_FULL
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Bounded coach-game cards without provider identities or client rosters.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCoachGameSummaryPage'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/coach-games/{summaryId}/trainer-avatar:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: summaryId
        in: path
        required: true
        description: Stable PadlHub coach-game summary UUID.
        schema:
          type: string
          format: uuid
    get:
      tags: [coach-games]
      operationId: getPublicCoachGameTrainerAvatar
      summary: Load a locally cached coach avatar
      description: |
        Reads the PadlHub-owned WebP cache first and uses Viva only on a cache miss. The Viva media
        URL and trainer identifier remain server-side.
      responses:
        '200':
          description: Trainer avatar normalized as WebP.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/booking-activities/{activityId}/host-avatar:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: activityId
        in: path
        required: true
        description: Stable PadlHub booking-activity UUID.
        schema:
          type: string
          format: uuid
    get:
      tags: [bookings]
      operationId: getPublicBookingActivityHostAvatar
      summary: Load a locally cached training or tournament host avatar
      description: |
        Reads the PadlHub-owned WebP cache first and uses Viva only on a cache miss. The Viva media
        URL and host identifier remain server-side.
      responses:
        '200':
          description: Activity host avatar normalized as WebP.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/games/{gameId}:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: gameId
        in: path
        required: true
        description: Stable PadlHub game UUID.
        schema:
          type: string
          format: uuid
    get:
      tags: [games]
      operationId: getPublicGame
      summary: Load safe public game details
      description: |
        Returns only the public projection. Private invitation access will use a separate hashed,
        expiring token operation; this route never accepts or resolves a provider identifier.
      responses:
        '200':
          description: Safe public game details.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicGameCardResponse'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
components:
  responses:
    Conflict:
      description: Current state conflicts with the requested command.
      content:
        application/json:
          schema:
            $ref: ../../common/components.yaml#/components/schemas/ApiError
    UnprocessableEntity:
      description: The command is well-formed but violates the current policy.
      content:
        application/json:
          schema:
            $ref: ../../common/components.yaml#/components/schemas/ApiError
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    GiftCertificateOrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    GiftCertificateFlowStep:
      type: string
      enum: [RECIPIENT_KIND, DESIGN, DENOMINATION, MESSAGE, DELIVERY, REVIEW]
    GiftCertificatePolicy:
      type: object
      additionalProperties: false
      required:
        - validityStart
        - validityDays
        - activationDeadlineDays
        - scheduledDeliveryEnabled
        - emailAttachmentEnabled
      properties:
        validityStart:
          type: string
          enum: [ISSUE, ACTIVATION]
        validityDays:
          type: integer
          minimum: 1
          maximum: 3650
        activationDeadlineDays:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
        scheduledDeliveryEnabled:
          type: boolean
        emailAttachmentEnabled:
          type: boolean
    PublicGiftCertificateDesign:
      type: object
      additionalProperties: false
      required:
        [
          id,
          key,
          audience,
          title,
          description,
          imageUrl,
          alt,
          codeXPercent,
          codeYPercent,
          amountXPercent,
          amountYPercent,
          active,
          sortOrder,
        ]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,62}$'
        audience:
          type: string
          enum: [FOR_HER, FOR_HIM, UNIVERSAL]
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
        imageUrl:
          type: string
          pattern: '^(https://|/public/api/v1/)'
          maxLength: 2000
        alt:
          type: string
          minLength: 1
          maxLength: 180
        codeXPercent:
          type: number
          minimum: 0
          maximum: 100
        codeYPercent:
          type: number
          minimum: 0
          maximum: 100
        amountXPercent:
          type: number
          minimum: 0
          maximum: 100
        amountYPercent:
          type: number
          minimum: 0
          maximum: 100
        active:
          type: boolean
          const: true
        sortOrder:
          type: integer
          minimum: 0
          maximum: 999
    PublicGiftCertificateDenomination:
      type: object
      additionalProperties: false
      required: [id, amountMinor, currency, active, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        amountMinor:
          type: integer
          minimum: 10000
          maximum: 100000000
        currency:
          type: string
          const: RUB
        active:
          type: boolean
          const: true
        sortOrder:
          type: integer
          minimum: 0
          maximum: 999
    PublicGiftCertificateCatalog:
      type: object
      additionalProperties: false
      required:
        - id
        - catalogNumber
        - title
        - availableFrom
        - availableTo
        - flowSteps
