name: Bootstrap staging runtime-secret boundary (B0)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Start the exact B0 release or recover its durable marker
        required: true
        type: choice
        options: [START, RECOVER]
      expected_active_release:
        description: Exact currently serving legacy release SHA
        required: true
        type: string
      bootstrap_candidate_sha:
        description: Exact reviewed B0 candidate SHA whose parent is the active release
        required: true
        type: string
      confirmation:
        description: Exact START or RECOVER confirmation phrase
        required: true
        type: string
      original_control_sha:
        description: For RECOVER only, the control SHA recorded by the original run
        required: false
        default: ''
        type: string
      original_run_id:
        description: For RECOVER only, the original GitHub run ID
        required: false
        default: ''
        type: string
      original_run_attempt:
        description: For RECOVER only, the original run attempt
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  validate-source:
    runs-on: ubuntu-latest
    outputs:
      start: ${{ steps.request.outputs.start }}
    steps:
      - id: request
        name: Validate exact operation authority
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
          CANDIDATE_SHA: ${{ inputs.bootstrap_candidate_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          ORIGINAL_CONTROL_SHA: ${{ inputs.original_control_sha }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          ORIGINAL_RUN_ATTEMPT: ${{ inputs.original_run_attempt }}
          REQUEST_REF: ${{ github.ref }}
          CONTROL_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SUPPORTED_ACTIVE_RELEASE: e308181da5222645d9a87d03642923c6841be8d1
          SUPPORTED_CANDIDATE_SHA: ffb12608fb16eae17096ab3ab3a7337cc5359c8a
        run: |
          set -eu
          require_sha() {
            test "${#1}" -eq 40
            case "$1" in *[!0-9a-f]*) return 1 ;; esac
          }
          require_uint() {
            test -n "$1"
            case "$1" in *[!0-9]*) return 1 ;; esac
          }
          test "$REQUEST_REF" = refs/heads/main
          test "$WORKFLOW_SHA" = "$CONTROL_SHA"
          require_sha "$EXPECTED_ACTIVE_RELEASE"
          require_sha "$CANDIDATE_SHA"
          test "$EXPECTED_ACTIVE_RELEASE" = "$SUPPORTED_ACTIVE_RELEASE"
          test "$CANDIDATE_SHA" = "$SUPPORTED_CANDIDATE_SHA"
          case "$OPERATION:$CONFIRMATION" in
            START:BOOTSTRAP_STAGING_RUNTIME_SECRETS)
              test -z "$ORIGINAL_CONTROL_SHA$ORIGINAL_RUN_ID$ORIGINAL_RUN_ATTEMPT"
              printf 'start=true\n' >> "$GITHUB_OUTPUT"
              ;;
            RECOVER:RECOVER_STAGING_RUNTIME_SECRETS)
              require_sha "$ORIGINAL_CONTROL_SHA"
              require_uint "$ORIGINAL_RUN_ID"
              require_uint "$ORIGINAL_RUN_ATTEMPT"
              printf 'start=false\n' >> "$GITHUB_OUTPUT"
              ;;
            *) echo '::error::Exact bootstrap operation confirmation is required.'; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ inputs.operation == 'START' }}
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the immutable candidate without submodule traversal
        if: ${{ inputs.operation == 'START' }}
        env:
          CANDIDATE_SHA: ${{ inputs.bootstrap_candidate_sha }}
        run: sh control/deploy/jetson/fetch-immutable-b0-candidate.sh "$CANDIDATE_SHA" candidate
      - name: Verify exact B0 source and parent contract
        if: ${{ inputs.operation == 'START' }}
        working-directory: control
        env:
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
          CANDIDATE_SHA: ${{ inputs.bootstrap_candidate_sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          sh deploy/jetson/verify-legacy-runtime-secret-bootstrap-source.sh \
            "$EXPECTED_ACTIVE_RELEASE" "$CANDIDATE_SHA" ../candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ inputs.operation == 'START' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Run the complete candidate gate
        if: ${{ inputs.operation == 'START' }}
        working-directory: candidate
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run contracts:generate
          npm run build:packages
          npm run check
          npm run db:migrate:check

  build:
    needs: validate-source
    if: ${{ needs.validate-source.outputs.start == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [web, api, worker, realtime, migrator]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Fetch the immutable candidate without submodule traversal
        env:
          CANDIDATE_SHA: ${{ inputs.bootstrap_candidate_sha }}
        run: sh control/deploy/jetson/fetch-immutable-b0-candidate.sh "$CANDIDATE_SHA" candidate
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: candidate
          file: candidate/apps/${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/z6v6e6r/phub-${{ matrix.service }}:b0-${{ inputs.bootstrap_candidate_sha }}
          build-args: |
            PHUB_RELEASE=${{ inputs.bootstrap_candidate_sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=b0-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=b0-${{ matrix.service }}
      - name: Retain the immutable manifest digest
        run: |
          install -d -m 700 digests
          printf '%s' '${{ steps.image.outputs.digest }}' > 'digests/${{ matrix.service }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: b0-digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}
          retention-days: 30

  operate:
    needs: [validate-source, build]
    if: >-
      ${{
        always() &&
        needs.validate-source.result == 'success' &&
        (
          (needs.validate-source.outputs.start == 'true' && needs.build.result == 'success') ||
          (needs.validate-source.outputs.start == 'false' && needs.build.result == 'skipped')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: staging
    env:
      SSH_OPTIONS: -o ConnectTimeout=10 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ inputs.operation == 'START' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control/package-lock.json
      - name: Install control-owned handshake dependencies
        if: ${{ inputs.operation == 'START' }}
        working-directory: control
        run: npm ci --ignore-scripts
      - name: Fetch the immutable candidate without submodule traversal
        if: ${{ inputs.operation == 'START' }}
        env:
          CANDIDATE_SHA: ${{ inputs.bootstrap_candidate_sha }}
        run: sh control/deploy/jetson/fetch-immutable-b0-candidate.sh "$CANDIDATE_SHA" candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.operation == 'START' }}
        with:
          pattern: b0-digest-*
          path: digests
          merge-multiple: true
      - name: Join the staging tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.STAGING_HOST }}
      - name: Configure audited SSH
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - id: identity
        name: Bind the original or current workflow identity
        env:
          OPERATION: ${{ inputs.operation }}
          ORIGINAL_CONTROL_SHA: ${{ inputs.original_control_sha }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          ORIGINAL_RUN_ATTEMPT: ${{ inputs.original_run_attempt }}
          CURRENT_CONTROL_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -eu
          if test "$OPERATION" = START; then
            control_sha=$CURRENT_CONTROL_SHA run_id=$CURRENT_RUN_ID run_attempt=$CURRENT_RUN_ATTEMPT
          else
            control_sha=$ORIGINAL_CONTROL_SHA run_id=$ORIGINAL_RUN_ID run_attempt=$ORIGINAL_RUN_ATTEMPT
          fi
          printf 'control_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$control_sha" "$run_id" "$run_attempt" >> "$GITHUB_OUTPUT"
          printf 'bundle=/opt/phub/b0-candidates/%s-%s\n' "$run_id" "$run_attempt" >> "$GITHUB_OUTPUT"
      - name: Assemble the redacted durable B0 bundle
        if: ${{ inputs.operation == 'START' }}
        env:
          CANDIDATE_SHA: ${{ inputs.bootstrap_candidate_sha }}
          CONTROL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -d -m 700 b0-bundle
          printf 'RELEASE=%s\nREGISTRY=ghcr.io/z6v6e6r\n' "$CANDIDATE_SHA" > b0-bundle/image-digests.env
          for service in web api worker realtime migrator; do
            digest=$(cat "digests/$service")
            printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            printf '%s_IMAGE_DIGEST=%s\n' "$(printf '%s' "$service" | tr '[:lower:]' '[:upper:]')" "$digest" >> b0-bundle/image-digests.env
          done
          find candidate/packages/database/migrations -maxdepth 1 -type f -name '*.sql' -print \
            | LC_ALL=C sort \
            | while IFS= read -r migration; do
                checksum=$(sha256sum "$migration")
                printf '%s|%s\n' "${checksum%% *}" "$(basename "$migration")"
              done > b0-bundle/migrations.manifest
          git -C control rev-parse 'HEAD^{tree}' > b0-bundle/control-tree
          git -C candidate rev-parse 'HEAD^{tree}' > b0-bundle/candidate-tree
          install -m 500 control/deploy/jetson/bootstrap-legacy-runtime-secret-contours.sh b0-bundle/
          install -m 400 control/deploy/jetson/provision-runtime-secret-files.mjs b0-bundle/
          install -m 500 control/deploy/jetson/backup-application.sh b0-bundle/
          install -m 500 control/deploy/jetson/rollback-application.sh b0-bundle/
          install -m 500 control/deploy/jetson/verify-legacy-runtime-secret-bootstrap-runtime.sh b0-bundle/
          install -m 400 candidate/deploy/compose.staging.yaml b0-bundle/
          chmod 600 b0-bundle/image-digests.env b0-bundle/migrations.manifest b0-bundle/control-tree b0-bundle/candidate-tree
      - name: Attest the exact public legacy release before writes
        if: ${{ inputs.operation == 'START' }}
        env:
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
        run: |
          set -euo pipefail
          manifest=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 15 https://lk.nano.padlhub.su/manifest.json)
          printf '%s' "$manifest" | EXPECTED_ACTIVE_RELEASE="$EXPECTED_ACTIVE_RELEASE" node -e '
            let value=""; process.stdin.on("data", chunk => { value += chunk; });
            process.stdin.on("end", () => { if (JSON.parse(value).release !== process.env.EXPECTED_ACTIVE_RELEASE) process.exit(1); });
          '
      - name: Publish the durable controller bundle without executing it
        if: ${{ inputs.operation == 'START' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          BUNDLE: ${{ steps.identity.outputs.bundle }}
        run: |
          set -euo pipefail
          ssh $SSH_OPTIONS "phub-deploy@$HOST" "test ! -e '$BUNDLE' && install -d -m 700 '$BUNDLE'"
          scp $SSH_OPTIONS b0-bundle/* "phub-deploy@$HOST:$BUNDLE/"
          ssh $SSH_OPTIONS "phub-deploy@$HOST" "chmod 500 '$BUNDLE/bootstrap-legacy-runtime-secret-contours.sh' '$BUNDLE/backup-application.sh' '$BUNDLE/rollback-application.sh' '$BUNDLE/verify-legacy-runtime-secret-bootstrap-runtime.sh'; chmod 400 '$BUNDLE/provision-runtime-secret-files.mjs' '$BUNDLE/compose.staging.yaml'; chmod 600 '$BUNDLE/image-digests.env' '$BUNDLE/migrations.manifest' '$BUNDLE/control-tree' '$BUNDLE/candidate-tree'"
      - id: start
        name: Perform the coordinated API and realtime B0 cutover
        if: ${{ inputs.operation == 'START' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          BUNDLE: ${{ steps.identity.outputs.bundle }}
          CONTROL_SHA: ${{ steps.identity.outputs.control_sha }}
          RUN_ID: ${{ steps.identity.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.identity.outputs.run_attempt }}
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
          CANDIDATE_SHA: ${{ inputs.bootstrap_candidate_sha }}
        run: |
          set -euo pipefail
          install -d -m 700 b0-evidence
          ssh $SSH_OPTIONS "phub-deploy@$HOST" \
            "sh '$BUNDLE/bootstrap-legacy-runtime-secret-contours.sh' start '$EXPECTED_ACTIVE_RELEASE' '$CANDIDATE_SHA' '$CONTROL_SHA' '$RUN_ID' '$RUN_ATTEMPT' BOOTSTRAP_STAGING_RUNTIME_SECRETS '$BUNDLE'" \
            | tee b0-evidence/transition.txt
      - name: Verify the isolated secret files without exposing their values
        if: ${{ inputs.operation == 'START' && steps.start.outcome == 'success' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh $SSH_OPTIONS "phub-deploy@$HOST" \
            'sh -s -- /etc/phub/staging.env /etc/phub/realtime.env phub-deploy false' \
            < control/deploy/jetson/verify-runtime-env-isolation.sh
      - name: Prove an authenticated API ticket reaches realtime
        if: ${{ inputs.operation == 'START' && steps.start.outcome == 'success' }}
        working-directory: control
        env:
          STAGING_REALTIME_SMOKE_ACCESS_TOKEN: ${{ secrets.STAGING_REALTIME_SMOKE_ACCESS_TOKEN }}
        run: |
          test -n "$STAGING_REALTIME_SMOKE_ACCESS_TOKEN"
          node --import tsx scripts/verify-realtime-ticket-handshake.ts \
            --base-url=https://lk.nano.padlhub.su --tenant-key=nano
      - name: Attest the exact candidate through public ingress
        if: ${{ inputs.operation == 'START' && steps.start.outcome == 'success' }}
        env:
          CANDIDATE_SHA: ${{ inputs.bootstrap_candidate_sha }}
        run: |
          set -euo pipefail
          manifest=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 15 https://lk.nano.padlhub.su/manifest.json)
          printf '%s' "$manifest" | CANDIDATE_SHA="$CANDIDATE_SHA" node -e '
            let value=""; process.stdin.on("data", chunk => { value += chunk; });
            process.stdin.on("end", () => { if (JSON.parse(value).release !== process.env.CANDIDATE_SHA) process.exit(1); });
          '
      - id: finalize
        name: Finalize only after public and authenticated attestation
        if: ${{ inputs.operation == 'START' && steps.start.outcome == 'success' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          BUNDLE: ${{ steps.identity.outputs.bundle }}
          CONTROL_SHA: ${{ steps.identity.outputs.control_sha }}
          RUN_ID: ${{ steps.identity.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.identity.outputs.run_attempt }}
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
          CANDIDATE_SHA: ${{ inputs.bootstrap_candidate_sha }}
        run: |
          set -euo pipefail
          for path in /healthz /health/live /health/ready; do
            curl --fail --silent --show-error --connect-timeout 10 --max-time 15 --output /dev/null "https://lk.nano.padlhub.su$path"
          done
          ssh $SSH_OPTIONS "phub-deploy@$HOST" \
            "sh '$BUNDLE/bootstrap-legacy-runtime-secret-contours.sh' finalize '$EXPECTED_ACTIVE_RELEASE' '$CANDIDATE_SHA' '$CONTROL_SHA' '$RUN_ID' '$RUN_ATTEMPT' FINALIZE_STAGING_RUNTIME_SECRETS '$BUNDLE'" \
            | tee -a b0-evidence/transition.txt
      - name: Observe the finalized candidate for five minutes
        if: ${{ inputs.operation == 'START' && steps.finalize.outcome == 'success' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          BUNDLE: ${{ steps.identity.outputs.bundle }}
          CANDIDATE_SHA: ${{ inputs.bootstrap_candidate_sha }}
        run: |
          set -euo pipefail
          for sample in $(seq 0 10); do
            for path in /healthz /health/live /health/ready; do
              curl --fail --silent --show-error --connect-timeout 10 --max-time 15 --output /dev/null "https://lk.nano.padlhub.su$path"
            done
            manifest=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 15 https://lk.nano.padlhub.su/manifest.json)
            printf '%s' "$manifest" | CANDIDATE_SHA="$CANDIDATE_SHA" node -e '
              let value=""; process.stdin.on("data", chunk => { value += chunk; });
              process.stdin.on("end", () => { if (JSON.parse(value).release !== process.env.CANDIDATE_SHA) process.exit(1); });
            '
            ssh $SSH_OPTIONS "phub-deploy@$HOST" \
              "sh '$BUNDLE/verify-legacy-runtime-secret-bootstrap-runtime.sh' '$CANDIDATE_SHA'" \
              | tee -a b0-evidence/observation.txt
            test "$sample" -eq 10 || sleep 30
          done
      - name: Recover the explicitly selected interrupted B0 run
        if: ${{ inputs.operation == 'RECOVER' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          BUNDLE: ${{ steps.identity.outputs.bundle }}
          CONTROL_SHA: ${{ steps.identity.outputs.control_sha }}
          RUN_ID: ${{ steps.identity.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.identity.outputs.run_attempt }}
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
          CANDIDATE_SHA: ${{ inputs.bootstrap_candidate_sha }}
        run: |
          set -euo pipefail
          install -d -m 700 b0-evidence
          ssh $SSH_OPTIONS "phub-deploy@$HOST" \
            "sh '$BUNDLE/bootstrap-legacy-runtime-secret-contours.sh' recover '$EXPECTED_ACTIVE_RELEASE' '$CANDIDATE_SHA' '$CONTROL_SHA' '$RUN_ID' '$RUN_ATTEMPT' RECOVER_STAGING_RUNTIME_SECRETS '$BUNDLE'" \
            | tee b0-evidence/recovery.txt
      - name: Recover automatically after a failed START
        if: ${{ always() && inputs.operation == 'START' && (failure() || cancelled()) }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          BUNDLE: ${{ steps.identity.outputs.bundle }}
          CONTROL_SHA: ${{ steps.identity.outputs.control_sha }}
          RUN_ID: ${{ steps.identity.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.identity.outputs.run_attempt }}
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
          CANDIDATE_SHA: ${{ inputs.bootstrap_candidate_sha }}
        run: |
          set -euo pipefail
          install -d -m 700 b0-evidence
          if ssh $SSH_OPTIONS "phub-deploy@$HOST" 'test -e /etc/phub/.runtime-secret-isolation.transition.json || test -e /etc/phub/.runtime-secret-isolation.transition.json.next || test -e /etc/phub/.runtime-secret-bootstrap.finalized.json'; then
            ssh $SSH_OPTIONS "phub-deploy@$HOST" \
              "sh '$BUNDLE/bootstrap-legacy-runtime-secret-contours.sh' recover '$EXPECTED_ACTIVE_RELEASE' '$CANDIDATE_SHA' '$CONTROL_SHA' '$RUN_ID' '$RUN_ATTEMPT' RECOVER_STAGING_RUNTIME_SECRETS '$BUNDLE'" \
              | tee -a b0-evidence/recovery.txt
          else
            printf '%s\n' 'legacy_runtime_secret_bootstrap recovery=no-marker status=not-required' | tee -a b0-evidence/recovery.txt
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: b0-runtime-secret-${{ github.run_id }}-${{ github.run_attempt }}
          path: b0-evidence
          if-no-files-found: ignore
          retention-days: 30
