  /{tenantKey}/game-operations/{operationId}:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/OperationId'
    get:
      tags: [games]
      operationId: getGameOperation
      summary: Get durable game command progress
      description: |
        Returns one durable operation state, its safe next action and latest committed game card.
        A managed commercial `CREATE_GAME` whose game is still `PROVISIONING` returns
        `status = UNKNOWN` with `nextAction = WAIT_FOR_RECONCILIATION`; it is never reported as
        `FAILED`, and the client keeps reading this operation instead of sending a new
        `POST /games`.
      responses:
        '200':
          description: Current operation state, safe next action and latest committed game card.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCommandResult'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable

  /{tenantKey}/game-operations/{operationId}/reconcile:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/OperationId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [games]
      operationId: reconcilePaidJoinOperation
      summary: Reconcile the original paid JOIN from its trusted owner receipt
      description: |
        Requires Idempotency-Key join-reconcile:{operationId}. Reads only the original owner
        operation, validates its immutable server binding and applies CONFIRM_PAYMENT atomically.
        Never dispatches booking, debit or release; missing/ambiguous proof stays unresolved.
      responses:
        '200':
          description: Current operation state, safe next action and latest committed game card.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCommandResult'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable

  /{tenantKey}/recommendations/bookings:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
    get:
      tags: [bookings]
      operationId: listBookingRecommendations
      summary: List server-ranked booking opportunities for the authenticated user
      description: |
        Reads one versioned PadlHub projection result. The server applies level, explicit
        station/time preferences and eligible completed activity history to Games, trainings and
        tournaments without exposing scores, provider identifiers or subscription state.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 6
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned by the preceding recommendation page.
          schema:
            type: string
            minLength: 16
            maxLength: 512
      responses:
        '200':
          description: Ranked, explainable recommendations from current Games projections.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRecommendationPage'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable client key. Replays return the stored result; payload reuse is rejected.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    GameId:
      name: gameId
      in: path
      required: true
      description: Stable PadlHub game UUID.
      schema:
        type: string
        format: uuid
    SubmissionId:
      name: submissionId
      in: path
      required: true
      description: Stable PadlHub result submission UUID.
      schema:
        type: string
        format: uuid
    OperationId:
      name: operationId
      in: path
      required: true
      description: Stable PadlHub game operation UUID.
      schema:
        type: string
        format: uuid

  responses:
    GameCommandAccepted:
      description: The idempotent command was committed and durable processing continues.
      headers:
        X-Correlation-ID:
          $ref: ../../common/components.yaml#/components/headers/CorrelationId
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameCommandResult'
    GameCommandCompleted:
      description: Stored result of the completed idempotent command.
      headers:
        X-Correlation-ID:
          $ref: ../../common/components.yaml#/components/headers/CorrelationId
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameCommandResult'
    GameCommandRejected:
      description: The game state, revision, policy or idempotency payload conflicts with the command.
      headers:
        X-Correlation-ID:
          $ref: ../../common/components.yaml#/components/headers/CorrelationId
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameCommandError'

  schemas:
    GameCardPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/GameCardView'
        nextCursor:
          type: [string, 'null']
          minLength: 16
          maxLength: 512
