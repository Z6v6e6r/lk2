          retention-days: 30
      - name: Roll back a failed staging application release
        if: ${{ (failure() || cancelled()) && steps.application-backup.outputs.ready == 'true' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          if ssh "phub-deploy@$HOST" \
            'PHUB_MEDIA_ROLLBACK_MODE=pre-cutover sh /opt/phub/verify-media-rollback-safe.sh'; then
            ssh "phub-deploy@$HOST" \
              "PHUB_ROLLBACK_BACKUP_ROOT=/opt/phub/backups/releases sh /opt/phub/rollback-application.sh '$STAGING_RELEASE_BACKUP_DIR' --confirm=ROLLBACK_STAGING_RELEASE"
          else
            guard_status="$?"
            case "$guard_status" in
              42)
                compatibility_floor=client-media
                compatible_guard_mode=compatible-client
                ;;
              43)
                compatibility_floor=community-logo
                compatible_guard_mode=compatible-logo
                ;;
              *)
                echo "Media rollback precheck failed without a confirmed compatibility transition (exit=$guard_status)" >&2
                exit "$guard_status"
