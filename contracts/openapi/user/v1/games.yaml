          type: string
          format: uuid
        type:
          type: string
          enum:
            - CREATE_GAME
            - PUBLISH_GAME
            - JOIN_GAME
            - LEAVE_GAME
            - JOIN_WAITLIST
            - LEAVE_WAITLIST
            - CANCEL_GAME
            - SUBMIT_RESULT
            - CONFIRM_RESULT
            - DISPUTE_RESULT
        status:
          type: string
          enum: [ACCEPTED, PROCESSING, UNKNOWN, SUCCEEDED, FAILED]
          description: UNKNOWN preserves an unresolved owner outcome; it is never retried as a new purchase.
        gameId:
          type: [string, 'null']
          format: uuid
        aggregateRevision:
          type: [integer, 'null']
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        nextAction:
          $ref: '#/components/schemas/GameNextAction'
        error:
          oneOf:
            - $ref: '#/components/schemas/GameOperationError'
            - type: 'null'
        commercial:
          oneOf:
            - $ref: '#/components/schemas/GameOperationCommercial'
            - type: 'null'
    GameOperationCommercial:
      type: object
      additionalProperties: false
      required: [attemptState, reservation, price, receipt, reason]
      properties:
        attemptState:
          type: string
          enum:
            [
              NOT_ATTEMPTED,
              DISPATCH_STARTED,
              WARN_OBSERVED,
              OWNER_PENDING,
              OWNER_CONFIRMED,
              UNKNOWN,
              FAILED,
            ]
        quote:
          oneOf:
            - $ref: '#/components/schemas/GameCommercialCreateQuote'
            - type: 'null'
        reservation:
          oneOf:
            - $ref: '#/components/schemas/GameOperationReservation'
            - type: 'null'
        price:
          oneOf:
            - $ref: '#/components/schemas/GameOperationPrice'
            - type: 'null'
        receipt:
          oneOf:
            - $ref: '#/components/schemas/GameOperationReceipt'
            - type: 'null'
        reason:
          oneOf:
            - $ref: '#/components/schemas/GameErrorCode'
            - type: 'null'
    GameCommercialCreateQuote:
      type: object
      additionalProperties: false
      description: |
        Server-owned commercial create quote. `basis = ADVISORY` is the WARN observation: it is
        recorded for observation and never binds the create result. `basis = OWNER` is the
        authoritative owner decision. The server validates outcome/price/reason relations before
        publishing this view; clients must treat it as read-only evidence, not as a price decision.
      required: [basis, decisionId, outcome, price, reasonCodes, evaluatedAt, expiresAt]
      properties:
        basis:
          type: string
          enum: [ADVISORY, OWNER]
        decisionId:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,199}$'
        outcome:
          type: string
          enum:
            [
              ALLOWED,
              SERVICE_BLOCKED,
              SUBSCRIPTION_SELECTION_REQUIRED,
              PRICE_CONFIRMATION_REQUIRED,
              UNAVAILABLE,
            ]
        price:
          oneOf:
            - type: object
              additionalProperties: false
              required: [amountMinor, currency, expiresAt]
              properties:
                amountMinor:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                currency:
                  type: string
                  const: RUB
                expiresAt:
                  type: string
                  format: date-time
            - type: 'null'
        reasonCodes:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Z][A-Z0-9_]{2,127}$'
        evaluatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    GameOperationReservation:
      type: object
      additionalProperties: false
      required: [id, state, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [ACTIVE, CONFIRMED, EXPIRED, CANCELLED]
        expiresAt:
          type: string
          format: date-time
    GameOperationPrice:
      type: object
      additionalProperties: false
      required: [amountMinor, currency, consent]
      properties:
        amountMinor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        currency:
          type: string
          const: RUB
        consent:
          type: string
          enum: [SETTLED, REQUIRED]
    GameOperationReceipt:
      type: object
      additionalProperties: false
      required: [provider, status, confirmedAt]
      properties:
        provider:
          type: string
          const: VIVA
        status:
          type: string
          const: CONFIRMED
        confirmedAt:
          type: string
          format: date-time
    GameNextAction:
      oneOf:
        - $ref: '#/components/schemas/GameNextActionNone'
        - $ref: '#/components/schemas/GameNextActionPayment'
        - $ref: '#/components/schemas/GameNextActionReconciliation'
      discriminator:
        propertyName: type
        mapping:
          NONE: '#/components/schemas/GameNextActionNone'
          OPEN_PAYMENT: '#/components/schemas/GameNextActionPayment'
          WAIT_FOR_RECONCILIATION: '#/components/schemas/GameNextActionReconciliation'
    GameNextActionReconciliation:
      type: object
      additionalProperties: false
      required: [type, retryAfterSeconds]
      description: The outcome is unresolved; the client repeats readback and never starts a new purchase.
      properties:
        type:
          type: string
          const: WAIT_FOR_RECONCILIATION
        retryAfterSeconds:
          type: integer
          minimum: 1
          maximum: 3600
    GameNextActionNone:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          const: NONE
    GameNextActionPayment:
      type: object
      additionalProperties: false
      required: [type, url, expiresAt]
      properties:
        type:
          type: string
          const: OPEN_PAYMENT
        url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
        expiresAt:
          type: string
          format: date-time
    GameOperationError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/GameErrorCode'
        message:
          type: string
          maxLength: 500
    GameCommandError:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
