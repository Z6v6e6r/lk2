      - name: Record production promotion eligibility
        if: ${{ inputs.deployment_profile == 'FULL_LIVE_HOME' }}
        run: |
          install -d -m 700 promotion-eligibility
          {
            echo 'PROFILE=FULL_LIVE_HOME'
            echo "RELEASE=$GITHUB_SHA"
