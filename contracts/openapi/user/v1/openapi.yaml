  /{tenantKey}/communities/{communityId}/direct-invites:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: communityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [communities]
      operationId: listCommunityDirectInvites
      summary: List bounded DIRECT invite metadata for community staff
      description: |
        Requires capability derived from an ACTIVE OWNER or ADMIN membership. Results never contain
        a plaintext token or token hash. The opaque cursor is bound to the community and stable
        server-owned order so staff can revoke an invite after reloading the management surface.
        Every response is emitted with `Cache-Control: no-store`.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 16
            maxLength: 1024
      responses:
        '200':
          description: One bounded page of invite metadata without tokens.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: '#/components/headers/SensitiveNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDirectInvitePage'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          description: '`COMMUNITY_DIRECT_INVITE_LIST_FORBIDDEN`; no active OWNER/ADMIN capability.'
          content:
            application/json:
              schema:
                $ref: ../../common/components.yaml#/components/schemas/ApiError
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
    post:
      tags: [communities]
      operationId: createCommunityDirectInvite
      summary: Create a reusable seven-day DIRECT membership invite
      description: |
        Requires the capability derived from an ACTIVE OWNER or ADMIN membership in this community.
        The actor, tenant, issuer membership, target role and expiry are server-owned. The invite is
        reusable until the server-fixed expiry exactly seven days after creation, always grants the
        MEMBER role, and is not bound to a client-selected user. The plaintext URL-safe token is
        returned only by this command (including an idempotent replay of the same command); only its
        non-reversible hash is retained after the response. The request contains only the current
        issuer membership revision; callers cannot set issuer, actor, user, role, status, expiry or
        usage limits and cannot select or request a quota grant. At most five unexpired ACTIVE invite
        links may exist per community, and at most twenty successful ISSUE commands are accepted in
        the preceding rolling 24 hours. If CUP has created an eligible one-time 24-hour grant, the
        server selects and consumes it atomically only when this otherwise-authorized OWNER/ADMIN
        command exceeds a quota; no grant ID or override flag is accepted from the User API. Every
        response is emitted with `Cache-Control: no-store`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityDirectInviteCreateRequest'
      responses:
        '201':
          description: New invite and its sensitive token, or the original idempotent replay.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
            X-Idempotent-Replayed:
              description: Whether this result was replayed from stored command state.
              schema:
                type: boolean
            Cache-Control:
              $ref: '#/components/headers/SensitiveNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDirectInviteCreated'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          description: '`COMMUNITY_DIRECT_INVITE_CREATE_FORBIDDEN`; no active OWNER/ADMIN capability.'
          content:
            application/json:
              schema:
                $ref: ../../common/components.yaml#/components/schemas/ApiError
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '409':
          description: |
            `COMMUNITY_MEMBERSHIP_REVISION_CONFLICT` when issuer membership changed, or the stable
            idempotency conflict code when a key is reused for another command.
          content:
            application/json:
              schema:
                $ref: ../../common/components.yaml#/components/schemas/ApiError
        '429':
          description: |
            No eligible server-side grant was consumed:
            `COMMUNITY_DIRECT_INVITE_ACTIVE_LIMIT_EXCEEDED` or
            `COMMUNITY_DIRECT_INVITE_DAILY_LIMIT_EXCEEDED`; includes the bounded `Retry-After`
            seconds calculated from current server state.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
            Retry-After:
              description: Seconds before a bounded retry.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: ../../common/components.yaml#/components/schemas/ApiError
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/community-direct-invites/preview:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
    post:
      tags: [communities]
      operationId: previewCommunityDirectInvite
      summary: Preview a DIRECT invite without changing membership
      description: |
        Requires an authenticated PadlHub user. A share link may carry the cryptographically verified
        opaque token only in its client-side URL fragment. The fragment must be removed before
        navigation and the token sent to this endpoint only in the JSON body, never in a server path,
        query, referrer or log. A valid token reveals a bounded minimal community preview even for
        HIDDEN visibility, plus the current invite and caller membership revisions.
        Preview never redeems the invite: an explicit redeem command is required. Revoked or expired
        invites, unknown tokens, and invites whose issuer is no longer an ACTIVE OWNER or ADMIN are
        indistinguishable and return `COMMUNITY_DIRECT_INVITE_NOT_FOUND`. BANNED membership is
        fail-closed and returns `COMMUNITY_DIRECT_INVITE_REDEEM_FORBIDDEN` without preview data.
        Every response is emitted with `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityDirectInviteTokenRequest'
      responses:
        '200':
          description: Minimal authenticated preview; no membership state was changed.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
            Cache-Control:
              $ref: '#/components/headers/SensitiveNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDirectInvitePreview'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          description: '`COMMUNITY_DIRECT_INVITE_REDEEM_FORBIDDEN`; BANNED membership remains blocked.'
          content:
            application/json:
              schema:
                $ref: ../../common/components.yaml#/components/schemas/ApiError
        '404':
          description: '`COMMUNITY_DIRECT_INVITE_NOT_FOUND`; invalid invites are not distinguishable.'
          content:
            application/json:
              schema:
                $ref: ../../common/components.yaml#/components/schemas/ApiError
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/community-direct-invites/redeem:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
    post:
      tags: [communities]
      operationId: redeemCommunityDirectInvite
      summary: Explicitly confirm and redeem a DIRECT invite
      description: |
        The authenticated JWT subject is always the beneficiary and the token is accepted only in
        the JSON body. A valid invite activates or restores membership with the fixed MEMBER role;
        an existing ACTIVE membership is never downgraded. A PENDING JOIN or REJOIN request is not
        auto-resolved and returns `COMMUNITY_DIRECT_INVITE_REQUEST_PENDING`. The server rechecks that
        the invite issuer is still an ACTIVE OWNER or ADMIN before committing membership,
        idempotency, audit and outbox state. BANNED membership fails closed with
        `COMMUNITY_DIRECT_INVITE_REDEEM_FORBIDDEN`. The client cannot provide an issuer, actor, user,
        role, status, expiry or usage limit. Every response is emitted with
        `Cache-Control: no-store`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityDirectInviteRedeemRequest'
      responses:
        '200':
          description: Current own membership state after confirmation or its idempotent replay.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
            X-Idempotent-Replayed:
              description: Whether this result was replayed from stored command state.
              schema:
                type: boolean
            Cache-Control:
              $ref: '#/components/headers/SensitiveNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityOwnMembershipState'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          description: '`COMMUNITY_DIRECT_INVITE_REDEEM_FORBIDDEN`; BANNED membership remains blocked.'
          content:
            application/json:
              schema:
                $ref: ../../common/components.yaml#/components/schemas/ApiError
        '404':
          description: '`COMMUNITY_DIRECT_INVITE_NOT_FOUND`; invalid invites are not distinguishable.'
          content:
            application/json:
              schema:
                $ref: ../../common/components.yaml#/components/schemas/ApiError
        '409':
          description: |
            `COMMUNITY_MEMBERSHIP_REVISION_CONFLICT`, `COMMUNITY_DIRECT_INVITE_REVISION_CONFLICT`,
            or `COMMUNITY_DIRECT_INVITE_REQUEST_PENDING`; preview state is stale or a join request
            must be resolved first.
          content:
            application/json:
              schema:
                $ref: ../../common/components.yaml#/components/schemas/ApiError
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/community-direct-invites/{inviteId}/revoke:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [communities]
      operationId: revokeCommunityDirectInvite
      summary: Revoke a DIRECT invite by its PadlHub UUID
      description: |
        The invite resolves its community server-side. Authorization is capability-derived and
        requires an ACTIVE OWNER or ADMIN membership in that community; no finer client-visible
        revocation policy is encoded. The actor, tenant, role and target status are never accepted
        from the client; only the expected invite revision is supplied. Revocation, idempotency,
        audit and outbox state commit atomically. Every response is emitted with
        `Cache-Control: no-store`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityDirectInviteRevokeRequest'
      responses:
        '200':
          description: Revoked invite state or the original idempotent replay.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
            X-Idempotent-Replayed:
              description: Whether this result was replayed from stored command state.
              schema:
                type: boolean
            Cache-Control:
              $ref: '#/components/headers/SensitiveNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityDirectInviteState'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          description: '`COMMUNITY_DIRECT_INVITE_REVOKE_FORBIDDEN`; no active OWNER/ADMIN capability.'
          content:
            application/json:
              schema:
                $ref: ../../common/components.yaml#/components/schemas/ApiError
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '409':
          description: |
            `COMMUNITY_DIRECT_INVITE_REVISION_CONFLICT` when invite state changed, or the stable
            idempotency conflict code when a key is reused for another command.
          content:
            application/json:
              schema:
                $ref: ../../common/components.yaml#/components/schemas/ApiError
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable
  /{tenantKey}/communities/{communityId}/members/me/pin:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: communityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [communities]
      operationId: setMyCommunityMembershipPin
      summary: Pin or unpin the authenticated user's active membership
      description: |
        Applies a LOCAL_ONLY membership command. The actor is always the JWT subject; clients cannot
        supply a phone, user identifier, role or source system. State, idempotency result, audit event
        and outbox event are committed atomically. The command remains unavailable while Communities
        are running from the legacy read mode.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityMembershipPinRequest'
      responses:
        '200':
          description: Stored membership pin state. An idempotent replay returns the same revision.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
            X-Idempotent-Replayed:
              description: Whether this response was replayed from the stored command result.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityMembershipPinState'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
