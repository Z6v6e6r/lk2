name: Build and deploy staging

on:
  workflow_dispatch:
    inputs:
      deploy_confirmation:
        description: Type DEPLOY_STAGING to deploy the main branch to staging
        required: false
        type: string
      deployment_profile:
        description: Select an explicitly bounded staging deployment profile
        required: true
        type: choice
        default: FULL_LIVE_HOME
        options:
          - FULL_LIVE_HOME
          - MEDIA_BINARY_ONLY
          - COMMUNITIES_LEGACY_READ_ONLY
          - CLIENT_ASSISTED_VIVA
          - MESSAGING_TEST
          - CHAT_PUSH_FOUNDATION
          - CHAT_PUSH_FOUNDATION_RECOVERY
      foundation_maintenance_confirmation:
        description: Type the exact APPLY or RESUME confirmation required by the selected foundation profile
        required: false
        type: string
      foundation_expected_candidate_sha:
        description: Exact 40-character main SHA expected for the foundation candidate
        required: false
        type: string
      foundation_expected_active_release_sha:
        description: Exact 40-character release SHA currently active on staging
        required: false
        type: string
      foundation_tenant_keys:
        description: Complete comma-separated approved staging tenant-key inventory
        required: false
        type: string
      foundation_no_booking_producer_confirmation:
        description: Type NO_BOOKING_PRODUCER_ACTIVE after checking every external producer
        required: false
        type: string
      foundation_original_run_id:
        description: Original foundation run ID, required only by the recovery profile
        required: false
        type: string
      foundation_original_run_attempt:
        description: Original foundation run attempt, required only by the recovery profile
        required: false
        type: string
      messaging_player_a_id:
        description: First active PadlHub player UUID required by MESSAGING_TEST
        required: false
        type: string
      messaging_player_b_id:
        description: Second active PadlHub player UUID required by MESSAGING_TEST
        required: false
        type: string
      routing_tenant_key:
        description: Active staging tenant whose routing plan is refreshed before Viva activation
        required: false
        type: string
      routing_actor_id:
        description: Operator UUID recorded for the just-in-time routing refresh
        required: false
        type: string
      routing_apply_confirmation:
        description: Type APPLY_ROUTING_PLAN to authorize the audited just-in-time routing refresh
        required: false
        type: string
      expected_active_release:
        description: Exact currently serving 40-character release required by media baseline/binary-only operations
        required: false
        type: string
      diagnose_home:
        description: Read-only live Home source diagnostics
        required: true
        type: boolean
        default: false
      diagnose_media:
        description: Strict read-only media, migration, storage and capacity baseline before any build or deploy
        required: true
        type: boolean
        default: false
      diagnostic_phone_last4:
        description: Optional comma-separated phone suffixes for read-only player/delegation diagnostics
        required: false
        type: string
      access_target_user_id:
        description: Target PadlHub user UUID for an isolated audited access operation
        required: false
        type: string
      access_roles:
        description: Complete comma-separated desired role set
        required: false
        type: string
      access_permissions:
        description: Complete comma-separated desired permission set
        required: false
        type: string
      access_actor_id:
        description: Active PadlHub operator UUID recorded in the audit log
        required: false
        type: string
      access_apply_confirmation:
        description: Leave empty for dry-run or type APPLY_USER_ACCESS to apply
        required: false
        type: string
      recover_udisks:
        description: Restart a leaking udisks2 service, then run diagnostics
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      access_apply: ${{ steps.request.outputs.access_apply }}
    steps:
      - id: request
        name: Validate requested staging operation
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.deploy_confirmation }}
          DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile }}
          FOUNDATION_MAINTENANCE_CONFIRMATION: ${{ inputs.foundation_maintenance_confirmation }}
          FOUNDATION_EXPECTED_CANDIDATE_SHA: ${{ inputs.foundation_expected_candidate_sha }}
          FOUNDATION_EXPECTED_ACTIVE_RELEASE_SHA: ${{ inputs.foundation_expected_active_release_sha }}
          FOUNDATION_TENANT_KEYS: ${{ inputs.foundation_tenant_keys }}
          FOUNDATION_NO_BOOKING_PRODUCER_CONFIRMATION: ${{ inputs.foundation_no_booking_producer_confirmation }}
          FOUNDATION_ORIGINAL_RUN_ID: ${{ inputs.foundation_original_run_id }}
          FOUNDATION_ORIGINAL_RUN_ATTEMPT: ${{ inputs.foundation_original_run_attempt }}
          MESSAGING_PLAYER_A_ID: ${{ inputs.messaging_player_a_id }}
          MESSAGING_PLAYER_B_ID: ${{ inputs.messaging_player_b_id }}
          ROUTING_TENANT_KEY: ${{ inputs.routing_tenant_key }}
          ROUTING_ACTOR_ID: ${{ inputs.routing_actor_id }}
          ROUTING_APPLY_CONFIRMATION: ${{ inputs.routing_apply_confirmation }}
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
          DIAGNOSE_HOME: ${{ inputs.diagnose_home }}
          DIAGNOSE_MEDIA: ${{ inputs.diagnose_media }}
          DIAGNOSTIC_PHONE_LAST4: ${{ inputs.diagnostic_phone_last4 }}
          ACCESS_TARGET_USER_ID: ${{ inputs.access_target_user_id }}
          ACCESS_ROLES: ${{ inputs.access_roles }}
          ACCESS_PERMISSIONS: ${{ inputs.access_permissions }}
          ACCESS_ACTOR_ID: ${{ inputs.access_actor_id }}
          ACCESS_APPLY_CONFIRMATION: ${{ inputs.access_apply_confirmation }}
          RECOVER_UDISKS: ${{ inputs.recover_udisks }}
          REQUEST_REF: ${{ github.ref }}
          REQUEST_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -eu
          diagnostics_requested=false
          if [ "$DIAGNOSE_HOME" = 'true' ] || [ "$DIAGNOSE_MEDIA" = 'true' ] || [ "$RECOVER_UDISKS" = 'true' ] || [ -n "$DIAGNOSTIC_PHONE_LAST4" ]; then
            diagnostics_requested=true
          fi
          access_requested=false
          if [ -n "$ACCESS_TARGET_USER_ID$ACCESS_ROLES$ACCESS_PERMISSIONS$ACCESS_ACTOR_ID$ACCESS_APPLY_CONFIRMATION" ]; then
            access_requested=true
          fi
          foundation_inputs_requested=false
          if [ -n "$FOUNDATION_MAINTENANCE_CONFIRMATION$FOUNDATION_EXPECTED_CANDIDATE_SHA$FOUNDATION_EXPECTED_ACTIVE_RELEASE_SHA$FOUNDATION_TENANT_KEYS$FOUNDATION_NO_BOOKING_PRODUCER_CONFIRMATION$FOUNDATION_ORIGINAL_RUN_ID$FOUNDATION_ORIGINAL_RUN_ATTEMPT" ]; then
            foundation_inputs_requested=true
          fi
          if { [ "$DEPLOYMENT_PROFILE" = CHAT_PUSH_FOUNDATION ] || [ "$DEPLOYMENT_PROFILE" = CHAT_PUSH_FOUNDATION_RECOVERY ]; } \
            && { [ "$access_requested" = true ] || [ "$diagnostics_requested" = true ]; }; then
            echo '::error::Foundation maintenance cannot be combined with diagnostics or user-access operations.'
            exit 1
          fi
          if [ "$access_requested" = 'true' ]; then
            if [ "$diagnostics_requested" = 'true' ] || [ -n "$DEPLOY_CONFIRMATION" ] \
              || [ "$foundation_inputs_requested" = true ] || [ -n "$EXPECTED_ACTIVE_RELEASE" ]; then
              echo '::error::User-access operation cannot be combined with diagnostics or deployment.'
              exit 1
            fi
            if ! printf '%s' "$ACCESS_TARGET_USER_ID" | grep -Eiq '^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'; then
              echo '::error::Target user ID must be a UUID.'
              exit 1
            fi
            if ! printf '%s' "$ACCESS_ACTOR_ID" | grep -Eiq '^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'; then
              echo '::error::Access actor ID must be a UUID.'
              exit 1
            fi
            for access_values in "$ACCESS_ROLES" "$ACCESS_PERMISSIONS"; do
              if ! printf '%s' "$access_values" | grep -Eq '^[a-z][a-z0-9._-]{1,63}(,[a-z][a-z0-9._-]{1,63})*$'; then
                echo '::error::Roles and permissions must be complete comma-separated access identifiers.'
                exit 1
              fi
            done
            case "$ACCESS_APPLY_CONFIRMATION" in
              '') printf '%s\n' 'access_apply=false' >> "$GITHUB_OUTPUT" ;;
              APPLY_USER_ACCESS) printf '%s\n' 'access_apply=true' >> "$GITHUB_OUTPUT" ;;
              *)
                echo '::error::Access apply requires the exact APPLY_USER_ACCESS confirmation.'
                exit 1
                ;;
            esac
            printf '%s\n' 'mode=user-access' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$diagnostics_requested" = 'true' ]; then
            if [ -n "$DEPLOY_CONFIRMATION" ] || [ "$foundation_inputs_requested" = true ]; then
              echo '::error::Diagnostics cannot be combined with a deployment confirmation.'
              exit 1
            fi
            if [ "$DIAGNOSE_MEDIA" = 'true' ] && [ "$RECOVER_UDISKS" = 'true' ]; then
              echo '::error::Strict media diagnostics are read-only and cannot restart udisks.'
              exit 1
            fi
            printf '%s\n' 'mode=diagnostics' >> "$GITHUB_OUTPUT"
            if [ -n "$DIAGNOSTIC_PHONE_LAST4" ] && ! printf '%s' "$DIAGNOSTIC_PHONE_LAST4" | grep -Eq '^[0-9]{4}(,[0-9]{4}){0,9}$'; then
              echo '::error::Player diagnostics require one to ten comma-separated four-digit phone suffixes.'
              exit 1
            fi
            if [ "$DIAGNOSE_MEDIA" = 'true' ]; then
              if ! printf '%s' "$EXPECTED_ACTIVE_RELEASE" | grep -Eq '^[0-9a-f]{40}$'; then
                echo '::error::Media diagnostics require the exact current 40-character staging release.'
                exit 1
              fi
            elif [ -n "$EXPECTED_ACTIVE_RELEASE" ]; then
              echo '::error::Expected active release is valid only for media diagnostics or MEDIA_BINARY_ONLY.'
              exit 1
            fi
            exit 0
          fi
          if [ "$DEPLOY_CONFIRMATION" != 'DEPLOY_STAGING' ]; then
            echo '::error::Deployment requires the exact DEPLOY_STAGING confirmation.'
            exit 1
          fi
          if [ "$REQUEST_REF" != 'refs/heads/main' ]; then
            echo '::error::Staging deployment is allowed only from refs/heads/main.'
            exit 1
          fi
          case "$DEPLOYMENT_PROFILE" in
            FULL_LIVE_HOME | CLIENT_ASSISTED_VIVA)
              if [ -n "$FOUNDATION_MAINTENANCE_CONFIRMATION$FOUNDATION_EXPECTED_CANDIDATE_SHA$FOUNDATION_EXPECTED_ACTIVE_RELEASE_SHA$FOUNDATION_TENANT_KEYS$FOUNDATION_NO_BOOKING_PRODUCER_CONFIRMATION$FOUNDATION_ORIGINAL_RUN_ID$FOUNDATION_ORIGINAL_RUN_ATTEMPT" ]; then
                echo '::error::Viva-backed deployment cannot include foundation-maintenance inputs.'
                exit 1
              fi
              if ! printf '%s' "$ROUTING_TENANT_KEY" | grep -Eq '^[a-z0-9][a-z0-9-]{1,62}$'; then
                echo '::error::Viva-backed deployment requires a valid staging routing tenant key.'
                exit 1
              fi
              if ! printf '%s' "$ROUTING_ACTOR_ID" | grep -Eiq '^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'; then
                echo '::error::Viva-backed deployment routing actor ID must be a UUID.'
                exit 1
              fi
              if [ "$ROUTING_APPLY_CONFIRMATION" != 'APPLY_ROUTING_PLAN' ]; then
                echo '::error::Viva-backed deployment requires the exact APPLY_ROUTING_PLAN confirmation.'
                exit 1
              fi
              if [ -n "$MESSAGING_PLAYER_A_ID$MESSAGING_PLAYER_B_ID" ]; then
                echo '::error::Viva-backed deployment cannot include messaging-test players.'
                exit 1
              fi
              ;;
            COMMUNITIES_LEGACY_READ_ONLY)
              if [ -n "$ROUTING_TENANT_KEY$ROUTING_ACTOR_ID$ROUTING_APPLY_CONFIRMATION$MESSAGING_PLAYER_A_ID$MESSAGING_PLAYER_B_ID$FOUNDATION_MAINTENANCE_CONFIRMATION$FOUNDATION_EXPECTED_CANDIDATE_SHA$FOUNDATION_EXPECTED_ACTIVE_RELEASE_SHA$FOUNDATION_TENANT_KEYS$FOUNDATION_NO_BOOKING_PRODUCER_CONFIRMATION$FOUNDATION_ORIGINAL_RUN_ID$FOUNDATION_ORIGINAL_RUN_ATTEMPT" ]; then
                echo '::error::Communities read-only deployment cannot refresh routing or include messaging-test players.'
                exit 1
              fi
              ;;
            MEDIA_BINARY_ONLY)
              if [ -n "$ROUTING_TENANT_KEY$ROUTING_ACTOR_ID$ROUTING_APPLY_CONFIRMATION$MESSAGING_PLAYER_A_ID$MESSAGING_PLAYER_B_ID" ] \
                || [ "$foundation_inputs_requested" = true ]; then
                echo '::error::Media binary-only deployment cannot refresh routing, include messaging-test players, or include foundation-maintenance inputs.'
                exit 1
              fi
              if ! printf '%s' "$EXPECTED_ACTIVE_RELEASE" | grep -Eq '^[0-9a-f]{40}$'; then
                echo '::error::Media binary-only deployment requires the exact current 40-character staging release.'
                exit 1
              fi
              ;;
            MESSAGING_TEST)
              if [ -n "$ROUTING_TENANT_KEY$ROUTING_ACTOR_ID$ROUTING_APPLY_CONFIRMATION" ]; then
                echo '::error::Messaging-test deployment cannot refresh or activate Live Home routing.'
                exit 1
              fi
              for player_id in "$MESSAGING_PLAYER_A_ID" "$MESSAGING_PLAYER_B_ID"; do
                if ! printf '%s' "$player_id" | grep -Eiq '^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'; then
                  echo '::error::Messaging-test player IDs must be UUIDs.'
                  exit 1
                fi
              done
              if [ "$MESSAGING_PLAYER_A_ID" = "$MESSAGING_PLAYER_B_ID" ]; then
                echo '::error::Messaging-test deployment requires two distinct players.'
                exit 1
              fi
              if [ -n "$FOUNDATION_MAINTENANCE_CONFIRMATION$FOUNDATION_EXPECTED_CANDIDATE_SHA$FOUNDATION_EXPECTED_ACTIVE_RELEASE_SHA$FOUNDATION_TENANT_KEYS$FOUNDATION_NO_BOOKING_PRODUCER_CONFIRMATION$FOUNDATION_ORIGINAL_RUN_ID$FOUNDATION_ORIGINAL_RUN_ATTEMPT" ]; then
                echo '::error::Messaging-test deployment cannot include foundation-maintenance inputs.'
                exit 1
              fi
              ;;
            CHAT_PUSH_FOUNDATION | CHAT_PUSH_FOUNDATION_RECOVERY)
              for foundation_value in "$FOUNDATION_MAINTENANCE_CONFIRMATION" \
                "$FOUNDATION_EXPECTED_CANDIDATE_SHA" \
                "$FOUNDATION_EXPECTED_ACTIVE_RELEASE_SHA" \
                "$FOUNDATION_TENANT_KEYS" \
                "$FOUNDATION_NO_BOOKING_PRODUCER_CONFIRMATION" \
                "$FOUNDATION_ORIGINAL_RUN_ID" \
                "$FOUNDATION_ORIGINAL_RUN_ATTEMPT"; do
                if [ "$(printf '%s' "$foundation_value" | tr -d '\r\n')" != "$foundation_value" ]; then
                  echo '::error::Foundation inputs must each be exactly one line.'
                  exit 1
                fi
              done
              if [ -n "$ROUTING_TENANT_KEY$ROUTING_ACTOR_ID$ROUTING_APPLY_CONFIRMATION$MESSAGING_PLAYER_A_ID$MESSAGING_PLAYER_B_ID" ]; then
                echo '::error::Foundation maintenance cannot refresh routing or include messaging-test players.'
                exit 1
              fi
              if [ "$DEPLOYMENT_PROFILE" = CHAT_PUSH_FOUNDATION ]; then
                if [ "$FOUNDATION_MAINTENANCE_CONFIRMATION" != APPLY_CHAT_PUSH_FOUNDATION_STAGING ]; then
                  echo '::error::Foundation maintenance requires the exact APPLY_CHAT_PUSH_FOUNDATION_STAGING confirmation.'
                  exit 1
                fi
                if [ -n "$FOUNDATION_ORIGINAL_RUN_ID$FOUNDATION_ORIGINAL_RUN_ATTEMPT" ]; then
                  echo '::error::Initial foundation maintenance cannot include recovery identity inputs.'
                  exit 1
                fi
              else
                if [ "$FOUNDATION_MAINTENANCE_CONFIRMATION" != RESUME_CHAT_PUSH_FOUNDATION_STAGING ]; then
                  echo '::error::Foundation recovery requires the exact RESUME_CHAT_PUSH_FOUNDATION_STAGING confirmation.'
                  exit 1
                fi
                if ! printf '%s' "$FOUNDATION_ORIGINAL_RUN_ID" | grep -Eq '^[0-9]+$' \
                  || [ "$FOUNDATION_ORIGINAL_RUN_ATTEMPT" != 1 ]; then
                  echo '::error::Foundation recovery requires the original numeric run ID and attempt 1.'
                  exit 1
                fi
              fi
              if [ "$FOUNDATION_NO_BOOKING_PRODUCER_CONFIRMATION" != NO_BOOKING_PRODUCER_ACTIVE ]; then
                echo '::error::Foundation maintenance requires an explicit no-booking-producer attestation.'
                exit 1
              fi
              if ! printf '%s' "$FOUNDATION_EXPECTED_CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
                echo '::error::Foundation candidate SHA must be a full commit SHA.'
                exit 1
              fi
              if [ "$DEPLOYMENT_PROFILE" = CHAT_PUSH_FOUNDATION ] \
                && [ "$FOUNDATION_EXPECTED_CANDIDATE_SHA" != "$REQUEST_SHA" ]; then
                echo '::error::Initial foundation candidate SHA must exactly match the dispatched main SHA.'
                exit 1
              fi
              if ! printf '%s' "$FOUNDATION_EXPECTED_ACTIVE_RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
                echo '::error::Foundation expected active release must be a full SHA.'
                exit 1
              fi
              if ! printf '%s' "$FOUNDATION_TENANT_KEYS" | grep -Eq '^[a-z0-9][a-z0-9-]{1,62}(,[a-z0-9][a-z0-9-]{1,62})*$'; then
                echo '::error::Foundation tenant inventory must be a complete comma-separated key list.'
                exit 1
              fi
              if [ "$RUN_ATTEMPT" != 1 ] || [ "$ACTOR" != "$TRIGGERING_ACTOR" ]; then
                echo '::error::Foundation maintenance cannot be rerun or triggered under another actor.'
                exit 1
              fi
              if [ "$WORKFLOW_SHA" != "$REQUEST_SHA" ]; then
                echo '::error::Foundation workflow definition must come from the candidate SHA.'
                exit 1
              fi
              ;;
            *)
              echo '::error::Unknown deployment profile.'
              exit 1
              ;;
          esac
          if [ "$DEPLOYMENT_PROFILE" != 'MEDIA_BINARY_ONLY' ] && [ -n "$EXPECTED_ACTIVE_RELEASE" ]; then
            echo '::error::Expected active release is valid only for media diagnostics or MEDIA_BINARY_ONLY.'
            exit 1
          fi
          printf '%s\n' 'mode=deploy' >> "$GITHUB_OUTPUT"
      - name: Require full commit pins for every third-party Action
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_SHA: ${{ github.sha }}
        run: |
          set -eu
          workflow_source="$RUNNER_TEMP/staging-workflow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yaml"
          trap 'rm -f "$workflow_source"' EXIT HUP INT TERM
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github.raw+json' \
            "$API_URL/repos/$REPOSITORY/contents/.github/workflows/deploy-staging.yaml?ref=$REQUEST_SHA" \
            > "$workflow_source"
          node - "$workflow_source" <<'NODE'
          const { readFileSync } = require('node:fs');
          const source = readFileSync(process.argv[2], 'utf8');
          const useLines = source.split(/\r?\n/).filter((line) => /^\s*(?:-\s*)?uses\s*:/.test(line));
          if (useLines.length === 0) process.exit(1);
          for (const line of useLines) {
            if (/^\s*(?:-\s*)?uses\s*:\s*\.\//.test(line)) continue;
            if (!/^\s*(?:-\s*)?uses\s*:\s*[A-Za-z0-9_.\/-]+@[0-9a-f]{40}\s*(?:#.*)?$/.test(line)) {
              console.error('STAGING_ACTION_REVISION_NOT_PINNED');
              process.exit(1);
            }
          }
          process.stdout.write(`Staging Action pins verified: ${useLines.length}\n`);
          NODE

  authorize-foundation-maintenance:
    needs: validate-request
    if: ${{ needs.validate-request.outputs.mode == 'deploy' && (inputs.deployment_profile == 'CHAT_PUSH_FOUNDATION' || inputs.deployment_profile == 'CHAT_PUSH_FOUNDATION_RECOVERY') }}
    runs-on: ubuntu-latest
    environment: staging-foundation-maintenance
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require the independently protected maintenance environment
        env:
          MAINTENANCE_READY: ${{ vars.STAGING_FOUNDATION_MAINTENANCE_READY_V1 }}
          ALLOWED_OPERATOR_IDS: ${{ vars.STAGING_FOUNDATION_OPERATOR_IDS }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -eu
          [ "$MAINTENANCE_READY" = 'APPROVED_WITH_REQUIRED_REVIEWER_V1' ] || {
            echo '::error::The protected staging-foundation-maintenance Environment is not attested.'
            exit 1
          }
          printf '%s' "$ALLOWED_OPERATOR_IDS" | grep -Eq '^[0-9]+(,[0-9]+)*$' || {
            echo '::error::Foundation operator allowlist is absent or invalid.'
            exit 1
          }
          case ",$ALLOWED_OPERATOR_IDS," in
            *",$ACTOR_ID,"*) ;;
            *) echo '::error::Actor is not authorized for foundation maintenance.'; exit 1 ;;
          esac
      - name: Bind recovery to the original failed workflow run
        if: ${{ inputs.deployment_profile == 'CHAT_PUSH_FOUNDATION_RECOVERY' }}
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          ORIGINAL_RUN_ID: ${{ inputs.foundation_original_run_id }}
          CANDIDATE_SHA: ${{ inputs.foundation_expected_candidate_sha }}
        run: |
          set -eu
          run_json="$RUNNER_TEMP/foundation-original-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          trap 'rm -f "$run_json"' EXIT HUP INT TERM
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$API_URL/repos/$REPOSITORY/actions/runs/$ORIGINAL_RUN_ID" > "$run_json"
          node - "$run_json" "$ORIGINAL_RUN_ID" "$CANDIDATE_SHA" <<'NODE'
          const { readFileSync } = require('node:fs');
          const run = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const allowedConclusions = new Set(['failure', 'cancelled', 'timed_out', 'action_required', 'stale', 'startup_failure']);
          if (
            String(run.id) !== process.argv[3] ||
            run.head_sha !== process.argv[4] ||
            run.head_branch !== 'main' ||
            run.event !== 'workflow_dispatch' ||
            run.run_attempt !== 1 ||
            run.path !== '.github/workflows/deploy-staging.yaml' ||
            run.status !== 'completed' ||
            !allowedConclusions.has(run.conclusion)
          ) {
            console.error('FOUNDATION_ORIGINAL_RUN_MISMATCH');
            process.exit(1);
          }
          process.stdout.write('Foundation original failed run verified\n');
          NODE
      - name: Require full commit pins for every third-party Action before maintenance
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_SHA: ${{ github.sha }}
        run: |
          set -eu
          workflow_source="$RUNNER_TEMP/foundation-workflow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yaml"
          trap 'rm -f "$workflow_source"' EXIT HUP INT TERM
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github.raw+json' \
            "$API_URL/repos/$REPOSITORY/contents/.github/workflows/deploy-staging.yaml?ref=$REQUEST_SHA" \
            > "$workflow_source"
          node - "$workflow_source" <<'NODE'
          const { readFileSync } = require('node:fs');
          const source = readFileSync(process.argv[2], 'utf8');
          const useLines = source.split(/\r?\n/).filter((line) => /^\s*(?:-\s*)?uses\s*:/.test(line));
          if (useLines.length === 0) process.exit(1);
          for (const line of useLines) {
            if (/^\s*(?:-\s*)?uses\s*:\s*\.\//.test(line)) continue;
            if (!/^\s*(?:-\s*)?uses\s*:\s*[A-Za-z0-9_.\/-]+@[0-9a-f]{40}\s*(?:#.*)?$/.test(line)) {
              console.error('FOUNDATION_ACTION_REVISION_NOT_PINNED');
              process.exit(1);
            }
          }
          process.stdout.write(`Foundation Action pins verified: ${useLines.length}\n`);
          NODE

  set-user-access:
    needs: validate-request
    if: ${{ needs.validate-request.outputs.mode == 'user-access' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Join the staging tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.STAGING_HOST }}
      - name: Configure audited SSH
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Refuse an unresolved runtime-secret transition
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh -o ConnectTimeout=10 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "phub-deploy@$HOST" 'sh -s -- /etc/phub /opt/phub' \
            < deploy/jetson/verify-runtime-secret-transition-clear.sh
      - name: Install the reviewed user-access operator
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          scp deploy/jetson/run-user-access.sh \
            "phub-deploy@$HOST:/opt/phub/run-user-access.sh.next"
          scp scripts/set-user-access.ts \
            "phub-deploy@$HOST:/opt/phub/set-user-access.ts.next"
          ssh "phub-deploy@$HOST" '
            set -eu
            mv /opt/phub/run-user-access.sh.next /opt/phub/run-user-access.sh
            chmod 0755 /opt/phub/run-user-access.sh
            mv /opt/phub/set-user-access.ts.next /opt/phub/set-user-access.ts
            chmod 0644 /opt/phub/set-user-access.ts
          '
      - name: Preview the complete user-access replacement without writes
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          TENANT_KEY: local-padel
          ACTOR_ID: ${{ inputs.access_actor_id }}
          TARGET_USER_ID: ${{ inputs.access_target_user_id }}
          ACCESS_ROLES: ${{ inputs.access_roles }}
          ACCESS_PERMISSIONS: ${{ inputs.access_permissions }}
        run: |
          ssh "phub-deploy@$HOST" /opt/phub/run-user-access.sh \
            "$TENANT_KEY" "$ACTOR_ID" "$TARGET_USER_ID" \
            "$ACCESS_ROLES" "$ACCESS_PERMISSIONS" false
      - name: Apply the audited complete user-access replacement
        if: ${{ needs.validate-request.outputs.access_apply == 'true' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          TENANT_KEY: local-padel
          ACTOR_ID: ${{ inputs.access_actor_id }}
          TARGET_USER_ID: ${{ inputs.access_target_user_id }}
          ACCESS_ROLES: ${{ inputs.access_roles }}
          ACCESS_PERMISSIONS: ${{ inputs.access_permissions }}
        run: |
          ssh "phub-deploy@$HOST" /opt/phub/run-user-access.sh \
            "$TENANT_KEY" "$ACTOR_ID" "$TARGET_USER_ID" \
            "$ACCESS_ROLES" "$ACCESS_PERMISSIONS" true

  diagnose-home:
    needs: validate-request
    if: ${{ needs.validate-request.outputs.mode == 'diagnostics' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Join the staging tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.STAGING_HOST }}
      - name: Configure audited SSH
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Refuse an unresolved runtime-secret transition
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh -o ConnectTimeout=10 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "phub-deploy@$HOST" 'sh -s -- /etc/phub /opt/phub' \
            < deploy/jetson/verify-runtime-secret-transition-clear.sh
      - name: Inspect active release metadata without values
        continue-on-error: true
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
            'sh -s -- /opt/phub/release.env' < deploy/jetson/inspect-release-env.sh
      - name: Inspect migration 0057 state read-only
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          checksum_line="$(sha256sum packages/database/migrations/0057_messaging_runtime.sql)"
          expected_checksum="${checksum_line%% *}"
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
            sh -s -- "$expected_checksum" < deploy/jetson/diagnose-migration-0057.sh
      - name: Inspect selected test-player delegations read-only
        if: ${{ inputs.diagnostic_phone_last4 != '' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          DIAGNOSTIC_PHONE_LAST4: ${{ inputs.diagnostic_phone_last4 }}
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
            sh -s -- "$DIAGNOSTIC_PHONE_LAST4" < deploy/jetson/diagnose-test-player-delegations.sh
      - name: Inspect recent messaging API failures read-only
        if: ${{ inputs.diagnostic_phone_last4 != '' }}
        continue-on-error: true
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" '
            set +e
            docker logs --since 45m --tail 600 phub-staging-api-1 2>&1 \
              | sed -E "s/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g" \
              | grep -Ei "conversation|messaging|error|failed|correlation" \
              | tail -120
            exit 0
          '
      - name: Recover leaked udisks memory
        if: ${{ inputs.recover_udisks }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" '
            set -eu
            echo udisks_before
            systemctl status udisks2 --no-pager || true
            pid="$(pidof udisksd || true)"
            if [ -n "$pid" ]; then
              grep -E "^(Rss|Pss|Swap):" "/proc/$pid/smaps_rollup" || true
            fi
            sudo -n systemctl restart udisks2
            sleep 5
            echo udisks_after
            systemctl status udisks2 --no-pager || true
            free -m
          '
      - name: Inspect live Home source readiness
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" '
            set +e
            echo host_resources
            uptime
            free -m
            df -h /
            echo vmstat
            timeout 8 vmstat 1 5
            echo top_processes
            ps -eo state,pid,ppid,comm,%cpu,%mem,rss --sort=-%cpu | head -25
            echo docker_memory
            timeout 10 docker stats --no-stream --format \
              "container={{.Name}} cpu={{.CPUPerc}} memory={{.MemUsage}} block={{.BlockIO}}"
            echo unhealthy_healthchecks
            for container in phub-staging-api-1 phub-staging-realtime-1 phub-staging-worker-1; do
              docker inspect --format \
                "container={{.Name}} status={{.State.Health.Status}} failing_streak={{.State.Health.FailingStreak}} checks={{range .State.Health.Log}}{{.End}} exit={{.ExitCode}} output={{json .Output}}; {{end}}" \
                "$container"
            done
            exit 0
          '
      - name: Inspect Live Home source failures read-only
        continue-on-error: true
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
            sh -s < deploy/jetson/diagnose-live-home-source-failures.sh
      - name: Inspect public staging ingress
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          set +e
          for path in /healthz /manifest.json /health/live /health/ready; do
            echo "public_path=$path"
            curl \
              --connect-timeout 10 \
              --max-time 15 \
              --silent \
              --show-error \
              --write-out '\npublic_http_status=%{http_code}\n' \
              "${BASE_URL%/}$path"
          done
          canonical_base_url=https://lk.nano.padlhub.su
          manifest="$(curl --fail --silent --show-error --max-time 15 "$canonical_base_url/manifest.json")"
          entry_path="$(printf '%s' "$manifest" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).entry));
          ')"
          style_path="$(printf '%s' "$manifest" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).styles[0]));
          ')"
          for asset_path in "$entry_path" "$style_path"; do
            curl \
              --fail \
              --silent \
              --show-error \
              --range 0-65535 \
              --max-time 20 \
              --output /dev/null \
              --write-out "hop=github-public path=${asset_path} status=%{http_code} bytes=%{size_download} speed=%{speed_download} seconds=%{time_total}\n" \
              "$canonical_base_url$asset_path"
          done
          exit 0

  media-baseline:
    needs: validate-request
    if: >-
      ${{
        (needs.validate-request.outputs.mode == 'diagnostics' && inputs.diagnose_media) ||
        (needs.validate-request.outputs.mode == 'deploy' && inputs.deployment_profile == 'MEDIA_BINARY_ONLY')
      }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    outputs:
      compatibility_floor: ${{ steps.attest.outputs.compatibility_floor }}
      routing_fingerprint: ${{ steps.attest.outputs.routing_fingerprint }}
      runtime_config_fingerprint: ${{ steps.attest.outputs.runtime_config_fingerprint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Join the staging tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.STAGING_HOST }}
      - name: Configure audited SSH
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Refuse an unresolved runtime-secret transition
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh -o ConnectTimeout=10 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "phub-deploy@$HOST" 'sh -s -- /etc/phub /opt/phub' \
            < deploy/jetson/verify-runtime-secret-transition-clear.sh
      - name: Verify current runtime secret isolation read-only
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
            'sh -s -- /etc/phub/staging.env /etc/phub/realtime.env phub-deploy false' \
            < deploy/jetson/verify-runtime-env-isolation.sh
      - id: attest
        name: Attest media baseline before build or staging writes
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
        run: |
          set -euo pipefail
          install -d -m 700 media-baseline
          migration_manifest=media-baseline/candidate-migrations.manifest
          find packages/database/migrations -maxdepth 1 -type f -name '*.sql' -print \
            | LC_ALL=C sort \
            | while IFS= read -r migration; do
                checksum_line="$(sha256sum "$migration")"
                printf '%s|%s\n' "${checksum_line%% *}" "$(basename "$migration")"
              done > "$migration_manifest"
          migration_manifest_base64="$(base64 -w 0 "$migration_manifest")"
          candidate_compose_base64="$(base64 -w 0 deploy/compose.staging.yaml)"
          candidate_tree="$(git rev-parse 'HEAD^{tree}')"
          attestation=media-baseline/attestation.txt
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
            sh -s -- "$EXPECTED_ACTIVE_RELEASE" "$GITHUB_SHA" "$candidate_tree" \
            "$migration_manifest_base64" "$candidate_compose_base64" \
            < deploy/jetson/verify-media-staging-baseline.sh \
            | tee "$attestation"

          manifest="$(curl --fail --silent --show-error --max-time 15 \
            "https://lk.nano.padlhub.su/manifest.json")"
          printf '%s' "$manifest" | EXPECTED_ACTIVE_RELEASE="$EXPECTED_ACTIVE_RELEASE" node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const manifest = JSON.parse(input);
              if (manifest.release !== process.env.EXPECTED_ACTIVE_RELEASE) process.exit(1);
            });
          '
          printf 'public_manifest release=%s status=matched\n' "$EXPECTED_ACTIVE_RELEASE" | tee -a "$attestation"

          run_guard() {
            mode="$1"
            floor="$2"
            if [ -n "$floor" ]; then
              ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
                "PHUB_ROLLBACK_COMPATIBILITY_FLOOR=$floor PHUB_MEDIA_ROLLBACK_MODE=$mode sh -s" \
                < deploy/jetson/verify-media-rollback-safe.sh
            else
              ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
                "PHUB_MEDIA_ROLLBACK_MODE=$mode sh -s" \
                < deploy/jetson/verify-media-rollback-safe.sh
            fi
          }

          set +e
          run_guard pre-cutover '' >> "$attestation" 2>&1
          guard_status=$?
          set -e
          case "$guard_status" in
            0)
              compatibility_floor=ordinary
              ;;
            42)
              compatibility_floor=client-media
              run_guard compatible-client client-media >> "$attestation" 2>&1
              ;;
            43)
              cat "$attestation"
              echo '::error::MEDIA_BINARY_ONLY is pre-cutover only; stable community-logo state requires its dedicated rollout path.'
              exit 1
              ;;
            *)
              cat "$attestation"
              echo "::error::Media baseline guard failed closed (exit=$guard_status)."
              exit "$guard_status"
              ;;
          esac
          printf 'compatibility_floor=%s\n' "$compatibility_floor" | tee -a "$attestation"

          routing_fingerprint="$(sed -n 's/^routing_fingerprint=//p' "$attestation" | tail -n 1)"
          runtime_config_fingerprint="$(sed -n 's/^runtime_config_fingerprint=//p' "$attestation" | tail -n 1)"
          printf '%s' "$routing_fingerprint" | grep -Eq '^[0-9a-f]{32}$'
          printf '%s' "$runtime_config_fingerprint" | grep -Eq '^[0-9a-f]{64}$'
          {
            printf 'compatibility_floor=%s\n' "$compatibility_floor"
            printf 'routing_fingerprint=%s\n' "$routing_fingerprint"
            printf 'runtime_config_fingerprint=%s\n' "$runtime_config_fingerprint"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: media-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: media-baseline
          if-no-files-found: ignore
          retention-days: 30

  verify:
    needs: [validate-request, authorize-foundation-maintenance, media-baseline]
    if: >-
      ${{
        always() &&
        needs.validate-request.outputs.mode == 'deploy' &&
        (
          (inputs.deployment_profile != 'CHAT_PUSH_FOUNDATION' && inputs.deployment_profile != 'CHAT_PUSH_FOUNDATION_RECOVERY') ||
          needs.authorize-foundation-maintenance.result == 'success'
        ) &&
        (inputs.deployment_profile != 'MEDIA_BINARY_ONLY' || needs.media-baseline.result == 'success')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.deployment_profile == 'CHAT_PUSH_FOUNDATION_RECOVERY' && inputs.foundation_expected_candidate_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run contracts:generate
      - run: npm run check

  build:
    needs: [validate-request, verify]
    if: ${{ needs.validate-request.outputs.mode == 'deploy' && needs.verify.result == 'success' && inputs.deployment_profile != 'CHAT_PUSH_FOUNDATION_RECOVERY' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [web, api, worker, realtime, migrator]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/z6v6e6r/phub-${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            PHUB_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - run: |
          mkdir -p digests
          printf '%s' '${{ steps.image.outputs.digest }}' > digests/${{ matrix.service }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}
          retention-days: 30

  deploy:
    needs: [validate-request, media-baseline, verify, build]
    if: >-
      ${{
        always() &&
        needs.validate-request.outputs.mode == 'deploy' &&
        needs.verify.result == 'success' &&
        (
          (inputs.deployment_profile == 'CHAT_PUSH_FOUNDATION_RECOVERY' && needs.build.result == 'skipped') ||
          (inputs.deployment_profile != 'CHAT_PUSH_FOUNDATION_RECOVERY' && needs.build.result == 'success')
        ) &&
        (inputs.deployment_profile != 'MEDIA_BINARY_ONLY' || needs.media-baseline.result == 'success') &&
        (
          (inputs.deployment_profile != 'CHAT_PUSH_FOUNDATION' && inputs.deployment_profile != 'CHAT_PUSH_FOUNDATION_RECOVERY') ||
          (
            github.run_attempt == 1 &&
            github.actor == github.triggering_actor &&
            github.ref == 'refs/heads/main' &&
            github.workflow_sha == github.sha
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      STAGING_RELEASE_BACKUP_DIR: /opt/phub/backups/releases/pre-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.deployment_profile == 'CHAT_PUSH_FOUNDATION_RECOVERY' && inputs.foundation_expected_candidate_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.deployment_profile != 'CHAT_PUSH_FOUNDATION_RECOVERY' }}
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.deployment_profile == 'CHAT_PUSH_FOUNDATION_RECOVERY' }}
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
          run-id: ${{ inputs.foundation_original_run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact current-run image digest artifacts
        run: |
          set -eu
          test ! -L digests
          test "$(find digests -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 5
          test -z "$(find digests -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          for service in web api worker realtime migrator; do
            digest_file="digests/$service"
            test -f "$digest_file" && test ! -L "$digest_file"
            digest="$(cat "$digest_file")"
            printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            test "$(wc -c < "$digest_file" | tr -d ' ')" -eq 71
          done
      - name: Join the staging tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.STAGING_HOST }}
      - name: Configure audited SSH
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Refuse an unresolved runtime-secret transition
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh -o ConnectTimeout=10 -o ConnectionAttempts=1 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "phub-deploy@$HOST" 'sh -s -- /etc/phub /opt/phub' \
            < deploy/jetson/verify-runtime-secret-transition-clear.sh
      - name: Verify API and realtime secret isolation
        env:
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
            'sh -s -- /etc/phub/staging.env /etc/phub/realtime.env phub-deploy false' \
            < deploy/jetson/verify-runtime-env-isolation.sh
      - name: Verify the active staging release and closed foundation gates before snapshot
        if: ${{ inputs.deployment_profile == 'CHAT_PUSH_FOUNDATION' }}
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          EXPECTED_ACTIVE_RELEASE: ${{ inputs.foundation_expected_active_release_sha }}
          SMOKE_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          ssh "phub-deploy@$HOST" '
            set -eu
            cd /opt/phub
            test "$(awk -F= '\''$1 == "RELEASE" { count += 1 } END { print count + 0 }'\'' release.env)" -eq 1
            active_release="$(sed -n s/^RELEASE=//p release.env)"
            test "$active_release" = "${{ inputs.foundation_expected_active_release_sha }}"
            for service in api worker realtime; do
              container_id="$(docker compose --env-file infrastructure.env --env-file release.env ps --status running -q "$service")"
              test -n "$container_id"
              test "$(docker inspect --format "{{.State.Health.Status}}" "$container_id")" = healthy
            done
          '
          ssh -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "phub-deploy@$HOST" \
            'cd /opt/phub && PHUB_APP_ROOT=/opt/phub sh -s -- preflight' \
            < deploy/jetson/verify-chat-push-foundation-runtime.sh
          curl --fail --silent --show-error "${SMOKE_BASE_URL%/}/manifest.json" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const manifest = JSON.parse(input);
              if (manifest.release !== process.env.EXPECTED_ACTIVE_RELEASE) process.exit(1);
