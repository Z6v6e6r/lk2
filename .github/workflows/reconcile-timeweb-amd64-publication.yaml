name: Reconcile existing immutable Timeweb amd64 publication

on:
  workflow_dispatch:
    inputs:
      expected_workflow_sha:
        description: Exact reviewed main SHA containing this reconciliation workflow
        required: true
        type: string
      expected_source_sha:
        description: Exact approved source SHA contained in the immutable publication artifact
        required: true
        type: string
      publication_run_id:
        description: Exact successful publication run ID to read back from GHCR
        required: true
        type: string
      publication_workflow_sha:
        description: Exact main SHA that executed the successful publication workflow
        required: true
        type: string
      prior_reconciliation_run_id:
        description: Leave empty for the first read-back; use its successful run ID for the second
        required: false
        default: ''
        type: string
      confirmation:
        description: Type RECONCILE_TIMEWEB_AMD64_PUBLICATION to inspect only the exact five images
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: timeweb-amd64-publication-reconciliation-${{ inputs.publication_run_id }}
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api_index_digest: ${{ steps.publication.outputs.api_index_digest }}
      migrator_index_digest: ${{ steps.publication.outputs.migrator_index_digest }}
      realtime_index_digest: ${{ steps.publication.outputs.realtime_index_digest }}
      web_index_digest: ${{ steps.publication.outputs.web_index_digest }}
      worker_index_digest: ${{ steps.publication.outputs.worker_index_digest }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate exact first-attempt reconciliation request
        env:
          ACTOR: ${{ github.actor }}
          APPROVED_SOURCE_SHA: 595e954bb8f53367baf034d7f39b255af0fda5fd
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIOR_RECONCILIATION_RUN_ID: ${{ inputs.prior_reconciliation_run_id }}
          PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
          PUBLICATION_WORKFLOW_SHA: ${{ inputs.publication_workflow_sha }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_REF: ${{ github.ref }}
          REQUEST_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$REQUEST_REF" = refs/heads/main
          test "$REPOSITORY" = Z6v6e6r/lk2
          test "$WORKFLOW_SHA" = "$REQUEST_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA"
          test "$RUN_ATTEMPT" = 1
          test "$ACTOR" = "$TRIGGERING_ACTOR"
          test "$CONFIRMATION" = RECONCILE_TIMEWEB_AMD64_PUBLICATION
          printf '%s' "$EXPECTED_SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$EXPECTED_WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$PUBLICATION_WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$PUBLICATION_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          test "$EXPECTED_SOURCE_SHA" = "$APPROVED_SOURCE_SHA"
          if test -n "$PRIOR_RECONCILIATION_RUN_ID"; then
            printf '%s' "$PRIOR_RECONCILIATION_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
            test "$PRIOR_RECONCILIATION_RUN_ID" != "$GITHUB_RUN_ID"
          fi
          publication_run="$RUNNER_TEMP/timeweb-amd64-publication-run.json"
          { printf 'header = "Authorization: Bearer %s"\n' "$GITHUB_TOKEN"; } \
            | curl --disable --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 --proto '=https' --tlsv1.2 \
              --config - \
              "https://api.github.com/repos/Z6v6e6r/lk2/actions/runs/$PUBLICATION_RUN_ID" \
              --output "$publication_run"
          jq -e --arg workflowSha "$PUBLICATION_WORKFLOW_SHA" '
            .repository.full_name == "Z6v6e6r/lk2" and
            .path == ".github/workflows/publish-timeweb-amd64-images.yaml" and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .head_sha == $workflowSha and
            .run_attempt == 1 and
            .status == "completed" and
            .conclusion == "success"
          ' "$publication_run" >/dev/null
          publication_artifacts="$RUNNER_TEMP/timeweb-amd64-publication-artifacts.json"
          { printf 'header = "Authorization: Bearer %s"\n' "$GITHUB_TOKEN"; } \
            | curl --disable --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 --proto '=https' --tlsv1.2 \
              --config - \
              "https://api.github.com/repos/Z6v6e6r/lk2/actions/runs/$PUBLICATION_RUN_ID/artifacts?per_page=100" \
              --output "$publication_artifacts"
          jq -e --arg name "timeweb-amd64-publication-$PUBLICATION_RUN_ID-1" '
            [.artifacts[] | select(
              .name == $name and
              .expired == false and
              (.digest | test("^sha256:[0-9a-f]{64}$"))
            )] | length == 1
          ' "$publication_artifacts" >/dev/null
          if test -n "$PRIOR_RECONCILIATION_RUN_ID"; then
            prior_run="$RUNNER_TEMP/timeweb-amd64-prior-reconciliation-run.json"
            { printf 'header = "Authorization: Bearer %s"\n' "$GITHUB_TOKEN"; } \
              | curl --disable --fail --silent --show-error \
                --connect-timeout 10 --max-time 30 --proto '=https' --tlsv1.2 \
                --config - \
                "https://api.github.com/repos/Z6v6e6r/lk2/actions/runs/$PRIOR_RECONCILIATION_RUN_ID" \
                --output "$prior_run"
            jq -e --arg workflowSha "$EXPECTED_WORKFLOW_SHA" '
              .repository.full_name == "Z6v6e6r/lk2" and
              .path == ".github/workflows/reconcile-timeweb-amd64-publication.yaml" and
              .event == "workflow_dispatch" and
              .head_branch == "main" and
              .head_sha == $workflowSha and
              .run_attempt == 1 and
              .status == "completed" and
              .conclusion == "success"
            ' "$prior_run" >/dev/null
            prior_artifacts="$RUNNER_TEMP/timeweb-amd64-prior-reconciliation-artifacts.json"
            { printf 'header = "Authorization: Bearer %s"\n' "$GITHUB_TOKEN"; } \
              | curl --disable --fail --silent --show-error \
                --connect-timeout 10 --max-time 30 --proto '=https' --tlsv1.2 \
                --config - \
                "https://api.github.com/repos/Z6v6e6r/lk2/actions/runs/$PRIOR_RECONCILIATION_RUN_ID/artifacts?per_page=100" \
                --output "$prior_artifacts"
            jq -e --arg name "timeweb-amd64-publication-reconciliation-manifest-$PRIOR_RECONCILIATION_RUN_ID-1" '
              [.artifacts[] | select(
                .name == $name and
                .expired == false and
                (.digest | test("^sha256:[0-9a-f]{64}$"))
              )] | length == 1
            ' "$prior_artifacts" >/dev/null
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: timeweb-amd64-publication-${{ inputs.publication_run_id }}-1
          path: publication-reference
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.publication_run_id }}
      - id: publication
        name: Bind reconciliation inputs to the immutable publication artifact
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
          PUBLICATION_WORKFLOW_SHA: ${{ inputs.publication_workflow_sha }}
        run: |
          set -euo pipefail
          cd publication-reference
          sha256sum --check --strict timeweb-amd64-publication-checksums.txt
          manifest=timeweb-amd64-publication-manifest.json
          jq -e --arg runId "$PUBLICATION_RUN_ID" --arg sourceSha "$EXPECTED_SOURCE_SHA" --arg workflowSha "$PUBLICATION_WORKFLOW_SHA" '
            .schemaVersion == 1 and
            .kind == "phub-timeweb-amd64-publication" and
            .sourceSha == $sourceSha and
            .workflowSha == $workflowSha and
            .repository == "Z6v6e6r/lk2" and
            .platform == "linux/amd64" and
            .runId == $runId and
            .runAttempt == "1" and
            .authorizesDeploy == false and
            .authorizesVpsProvisioning == false and
            .authorizesDatabaseMutation == false and
            ([.images[].service] | sort) == ["api","migrator","realtime","web","worker"] and
            all(.images[];
              .sourceSha == $sourceSha and
              .workflowSha == $workflowSha and
              .platform == "linux/amd64" and
              .runId == $runId and .runAttempt == "1" and
              .repository == ("ghcr.io/z6v6e6r/phub-" + .service) and
              .publicationTag == ("amd64-sha-" + $sourceSha + "-" + $runId + "-1") and
              (.indexDigest | test("^sha256:[0-9a-f]{64}$"))
            )
          ' "$manifest" >/dev/null
          for service in web api worker realtime migrator; do
            digest="$(jq -er --arg service "$service" '.images[] | select(.service == $service) | .indexDigest' "$manifest")"
            printf '%s_index_digest=%s\n' "$service" "$digest" >> "$GITHUB_OUTPUT"
          done

  reconcile-custody:
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            index_digest: ${{ needs.validate-request.outputs.api_index_digest }}
          - service: worker
            index_digest: ${{ needs.validate-request.outputs.worker_index_digest }}
          - service: realtime
            index_digest: ${{ needs.validate-request.outputs.realtime_index_digest }}
          - service: migrator
            index_digest: ${{ needs.validate-request.outputs.migrator_index_digest }}
          - service: web
            index_digest: ${{ needs.validate-request.outputs.web_index_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Buildx reader
        env:
          BUILDX_SHA256: 48af8a397ebd60178778bf63611dbcebe5f5e7a9be90eb9147b24b9587455778
          BUILDX_VERSION: v0.36.1
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/docker-buildx"
          plugin="$HOME/.docker/cli-plugins/docker-buildx"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$download" \
            "https://github.com/docker/buildx/releases/download/$BUILDX_VERSION/buildx-$BUILDX_VERSION.linux-amd64"
          printf '%s  %s\n' "$BUILDX_SHA256" "$download" | sha256sum --check --strict
          install -D -m 0755 "$download" "$plugin"
          printf '%s  %s\n' "$BUILDX_SHA256" "$plugin" | sha256sum --check --strict
          docker buildx version \
            | grep -Fx 'github.com/docker/buildx v0.36.1 1d8dde89b8aba914e05e45366770736fea1fd690'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile only the exact existing tag and index digest
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_INDEX_DIGEST: ${{ matrix.index_digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
          PUBLICATION_WORKFLOW_SHA: ${{ inputs.publication_workflow_sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          source scripts/timeweb-amd64-registry-custody-retry.sh
          source_sha="$EXPECTED_SOURCE_SHA"
          source_tree=3f4c1e63dd30eb60251533b95f1970fd96754a08
          original_builder="https://github.com/Z6v6e6r/lk2/actions/runs/$PUBLICATION_RUN_ID/attempts/1"
          original_workflow_sha="$PUBLICATION_WORKFLOW_SHA"
          test "$(git rev-parse "$source_sha^{tree}")" = "$source_tree"
          tag="amd64-sha-$source_sha-$PUBLICATION_RUN_ID-1"
          repository="ghcr.io/z6v6e6r/phub-$SERVICE"
          mkdir -p reconciliation-evidence/attestations reconciliation-evidence/statements
          phub_ghcr_custody_retry "$SERVICE-root-index" phub_ghcr_custody_read_exact_json "$repository:$tag" "$EXPECTED_INDEX_DIGEST" reconciliation-evidence/oci-index.json
          runtime_digest="$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64" and ((.platform.variant // "") == ""))] | if length == 1 then .[0].digest else empty end' reconciliation-evidence/oci-index.json)"
          runtime_size="$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64" and ((.platform.variant // "") == ""))] | if length == 1 then .[0].size else empty end' reconciliation-evidence/oci-index.json)"
          printf '%s' "$runtime_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s' "$runtime_size" | grep -Eq '^[1-9][0-9]*$'
          attestation_count="$(jq '[.manifests[] | select(.platform.os == "unknown" and .platform.architecture == "unknown" and .annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length' reconciliation-evidence/oci-index.json)"
          test "$attestation_count" -ge 1
          jq -r --arg runtime "$runtime_digest" '.manifests[] | select(.platform.os == "unknown" and .platform.architecture == "unknown" and .annotations["vnd.docker.reference.type"] == "attestation-manifest" and .annotations["vnd.docker.reference.digest"] == $runtime) | .digest' reconciliation-evidence/oci-index.json \
            > reconciliation-evidence/attestation-digests.txt
          test "$(wc -l < reconciliation-evidence/attestation-digests.txt | tr -d ' ')" -eq "$attestation_count"
          while IFS= read -r digest; do
            printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            phub_ghcr_custody_retry "$SERVICE-attestation-manifest-${digest#sha256:}" phub_ghcr_custody_read_exact_json "$repository@$digest" "$digest" "reconciliation-evidence/attestations/${digest#sha256:}.json"
          done < reconciliation-evidence/attestation-digests.txt
          jq -s -e --arg runtime "$runtime_digest" --argjson runtimeSize "$runtime_size" '
            length >= 1 and all(.[];
              .schemaVersion == 2 and
              .mediaType == "application/vnd.oci.image.manifest.v1+json" and
              .artifactType == "application/vnd.docker.attestation.manifest.v1+json" and
              .subject.mediaType == "application/vnd.oci.image.manifest.v1+json" and
              .subject.digest == $runtime and .subject.size == $runtimeSize and
              .config.mediaType == "application/vnd.oci.empty.v1+json" and
              .config.digest == "sha256:44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" and
              .config.size == 2 and .config.data == "e30="
            ) and
            ([.[].layers[]] | length == 2) and
            all(.[].layers[]; .mediaType == "application/vnd.in-toto+json" and (.digest | test("^sha256:[0-9a-f]{64}$"))) and
            ([.[].layers[].annotations["in-toto.io/predicate-type"]] | sort == ["https://slsa.dev/provenance/v1", "https://spdx.dev/Document"])
          ' reconciliation-evidence/attestations/*.json >/dev/null
          jq -s -r '.[].layers[] | [.digest, .annotations["in-toto.io/predicate-type"], .size, .mediaType] | @tsv' reconciliation-evidence/attestations/*.json \
            | sort -u > reconciliation-evidence/attestation-layers.tsv
          test "$(wc -l < reconciliation-evidence/attestation-layers.tsv | tr -d ' ')" -eq 2
          registry_token="$({ printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$GITHUB_TOKEN"; } | curl --fail --silent --show-error --config - "https://ghcr.io/token?service=ghcr.io&scope=repository%3Az6v6e6r%2Fphub-$SERVICE%3Apull" | jq -r '.token // empty')"
          printf '%s' "$registry_token" | grep -Eq '^[A-Za-z0-9._~+/-]+=*$'
          while IFS=$'\t' read -r digest predicate statement_size statement_media_type; do
            phub_ghcr_custody_retry "$SERVICE-attestation-statement-${digest#sha256:}" \
              phub_ghcr_custody_fetch_exact_statement_blob \
              "$SERVICE" "$digest" "$statement_size" "$statement_media_type" \
              "$registry_token" "reconciliation-evidence/statements/${digest#sha256:}.json"
            test "$(jq -r '.predicateType' "reconciliation-evidence/statements/${digest#sha256:}.json")" = "$predicate"
          done < reconciliation-evidence/attestation-layers.tsv
          unset registry_token
          jq -s -e --arg runtime "${runtime_digest#sha256:}" --arg source "$source_sha" --arg service "$SERVICE" --arg builder "$original_builder" '
            def reviewed_base($name; $tag; $sha):
              (.digest | type == "object" and keys == ["sha256"] and .sha256 == $sha) and
              (.uri == "pkg:docker/\($name)@\($tag)?platform=linux%2Famd64" or .uri == "pkg:docker/docker.io/library/\($name)@\($tag)?platform=linux%2Famd64");
            def reviewed_scanner($sha):
              (.digest | type == "object" and keys == ["sha256"] and .sha256 == $sha) and
              (.uri == "pkg:docker/docker/buildkit-syft-scanner?digest=sha256:\($sha)&platform=linux%2Famd64" or .uri == "pkg:docker/docker.io/docker/buildkit-syft-scanner?digest=sha256:\($sha)&platform=linux%2Famd64");
            length == 2 and ([.[].predicateType] | sort) == ["https://slsa.dev/provenance/v1", "https://spdx.dev/Document"] and
            all(.[]; ._type == "https://in-toto.io/Statement/v1" and (.subject | length) == 1 and .subject[0].digest == {"sha256": $runtime}) and
            (map(select(.predicateType == "https://slsa.dev/provenance/v1"))[0].predicate) as $p |
            $p.buildDefinition.buildType == "https://github.com/moby/buildkit/blob/master/docs/attestations/slsa-definitions.md" and
            $p.runDetails.builder.id == $builder and
            $p.runDetails.metadata.buildkit_completeness.resolvedDependencies == true and
            $p.buildDefinition.externalParameters.configSource.uri == "https://github.com/Z6v6e6r/lk2.git#\($source)" and
            $p.buildDefinition.externalParameters.configSource.digest == {"sha1": $source} and
            $p.buildDefinition.externalParameters.configSource.path == "apps/\($service)/Dockerfile" and
            ($p.buildDefinition.resolvedDependencies | type == "array") and
            ([$p.buildDefinition.resolvedDependencies[] | select(.uri == "https://github.com/Z6v6e6r/lk2.git#\($source)" and .digest == {"sha1": $source})] | length) == 1 and
            ([$p.buildDefinition.resolvedDependencies[] | select(reviewed_base("node"; "22-bookworm-slim"; "d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436"))] | length) == 1 and
            ([$p.buildDefinition.resolvedDependencies[] | select(reviewed_scanner("ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9"))] | length) == 1 and
            (if $service == "web" then
              ($p.buildDefinition.resolvedDependencies | length) == 4 and
              ([$p.buildDefinition.resolvedDependencies[] | select(reviewed_base("nginx"; "1.27-alpine"; "65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10"))] | length) == 1
            else ($p.buildDefinition.resolvedDependencies | length) == 3 end) and
            (map(select(.predicateType == "https://spdx.dev/Document"))[0].predicate.packages | type == "array" and length > 0)
          ' reconciliation-evidence/statements/*.json >/dev/null
          read_buildx_presentation() {
            template=$1
            destination=$2
            temporary="$destination.attempt-$$"
            rm -f "$temporary"
            docker buildx imagetools inspect "$repository@$EXPECTED_INDEX_DIGEST" \
              --format "$template" > "$temporary"
            jq -e 'type == "object"' "$temporary" >/dev/null
            mv "$temporary" "$destination"
          }
          phub_ghcr_custody_retry "$SERVICE-buildx-provenance" \
            read_buildx_presentation '{{json .Provenance.SLSA}}' \
            reconciliation-evidence/provenance.json
          phub_ghcr_custody_retry "$SERVICE-buildx-sbom" \
            read_buildx_presentation '{{json .SBOM.SPDX}}' \
            reconciliation-evidence/sbom.spdx.json
          jq -e 'type == "object" and (.buildDefinition | type == "object")' \
            reconciliation-evidence/provenance.json >/dev/null
          jq -e 'type == "object" and .SPDXID == "SPDXRef-DOCUMENT"' \
            reconciliation-evidence/sbom.spdx.json >/dev/null
          jq -s -e '
            (map(select(.predicateType == "https://slsa.dev/provenance/v1"))[0].predicate) == $provenance[0] and
            (map(select(.predicateType == "https://spdx.dev/Document"))[0].predicate) == $sbom[0]
          ' --slurpfile provenance reconciliation-evidence/provenance.json \
            --slurpfile sbom reconciliation-evidence/sbom.spdx.json \
            reconciliation-evidence/statements/*.json >/dev/null
          phub_ghcr_custody_retry "$SERVICE-runtime-manifest" phub_ghcr_custody_read_exact_json "$repository@$runtime_digest" "$runtime_digest" reconciliation-evidence/runtime-manifest.json
          runtime_reference="$repository@$runtime_digest"
          phub_ghcr_custody_retry "$SERVICE-runtime-pull" docker pull --platform linux/amd64 "$runtime_reference"
          test "$(docker image inspect "$runtime_reference" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          printf '%s' "$(docker image inspect "$runtime_reference" --format '{{.Id}}')" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "$(docker image inspect "$runtime_reference" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$source_sha"
          test "$(docker image inspect "$runtime_reference" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = https://github.com/Z6v6e6r/lk2
          image_user="$(docker image inspect "$runtime_reference" --format '{{.Config.User}}')"
          case "$SERVICE" in
            web)
              test -z "$image_user"
              docker run --rm --entrypoint /bin/sh "$runtime_reference" -ec 'test -s /usr/share/nginx/html/index.html && nginx -t'
              container_id="$(docker run --rm -d -p 127.0.0.1::8080 "$runtime_reference")"
              trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
              port="$(docker port "$container_id" 8080/tcp | sed -n 's/.*://p')"
              printf '%s' "$port" | grep -Eq '^[0-9]+$'
              for attempt in {1..30}; do
                if curl --fail --silent --show-error "http://127.0.0.1:$port/healthz" | grep --quiet '^ok$'; then break; fi
                test "$attempt" -lt 30 || { docker logs "$container_id"; exit 1; }
                sleep 1
              done
              curl --fail --silent --show-error "http://127.0.0.1:$port/" | grep --quiet '<div id="phub-app"></div>'
              docker rm -f "$container_id" >/dev/null
              trap - EXIT
              ;;
            api|worker)
              test "$image_user" = appuser
              docker run --rm --entrypoint /bin/sh "$runtime_reference" -ec "test \"\$(id -u)\" = 1001 && test -s /app/apps/$SERVICE/dist/main.js"
              docker run --rm --entrypoint node "$runtime_reference" --check "/app/apps/$SERVICE/dist/main.js"
              docker run --rm --entrypoint node "$runtime_reference" --input-type=module -e "import sharp from 'sharp'; if (process.platform !== 'linux' || process.arch !== 'x64') process.exit(1); const output = await sharp({create:{width:1,height:1,channels:4,background:{r:0,g:0,b:0,alpha:1}}}).webp().toBuffer(); if (output.length === 0) process.exit(1);"
              ;;
            realtime)
              test "$image_user" = appuser
              docker run --rm --entrypoint /bin/sh "$runtime_reference" -ec 'test "$(id -u)" = 1001 && test -s /app/apps/realtime/dist/main.js'
              docker run --rm --entrypoint node "$runtime_reference" --check /app/apps/realtime/dist/main.js
              docker run --rm --entrypoint node "$runtime_reference" -e "if (process.platform !== 'linux' || process.arch !== 'x64') process.exit(1)"
              ;;
            migrator)
              test "$image_user" = appuser
              docker run --rm --entrypoint /bin/sh "$runtime_reference" -ec 'test "$(id -u)" = 1001 && test -s /app/apps/migrator/dist/main.js && test -d /app/migrations'
              docker run --rm --entrypoint node "$runtime_reference" --check /app/apps/migrator/dist/main.js
              docker run --rm --entrypoint node "$runtime_reference" -e "if (process.platform !== 'linux' || process.arch !== 'x64') process.exit(1)"
              ;;
            *) exit 64 ;;
          esac
          jq -n --arg service "$SERVICE" --arg repository "$repository" --arg tag "$tag" --arg index "$EXPECTED_INDEX_DIGEST" --arg runtime "$runtime_digest" --arg source "$source_sha" --arg tree "$source_tree" --arg workflow "$original_workflow_sha" --arg builder "$original_builder" '{schemaVersion:1,kind:"phub-timeweb-amd64-reconciliation-image",service:$service,repository:$repository,publicationTag:$tag,indexDigest:$index,runtimeDigest:$runtime,sourceSha:$source,sourceTree:$tree,originalWorkflowSha:$workflow,originalBuilder:$builder,architecture:"amd64",provenanceVerified:true,sbomVerified:true,reconciliationVerified:true,authorizesDeploy:false,authorizesVpsProvisioning:false,authorizesDatabaseMutation:false}' > reconciliation-evidence/image.json
          (
            cd reconciliation-evidence
            find . -type f ! -name '*-checksums.txt' -print0 | sort -z \
              | xargs -0 sha256sum > evidence-checksums.txt
          )
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timeweb-amd64-reconciliation-${{ matrix.service }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reconciliation-evidence
          if-no-files-found: error
          retention-days: 90

  reconciliation-manifest:
    needs: [validate-request, reconcile-custody]
    if: ${{ needs.reconcile-custody.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ inputs.expected_workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: timeweb-amd64-reconciliation-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: reconciliation-evidence/images
      - if: ${{ inputs.prior_reconciliation_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: timeweb-amd64-publication-reconciliation-manifest-${{ inputs.prior_reconciliation_run_id }}-1
          path: prior-reconciliation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.prior_reconciliation_run_id }}
      - name: Emit non-authorizing reconciliation manifest
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          PRIOR_RECONCILIATION_RUN_ID: ${{ inputs.prior_reconciliation_run_id }}
          PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
          PUBLICATION_WORKFLOW_SHA: ${{ inputs.publication_workflow_sha }}
          RECONCILIATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(find reconciliation-evidence/images -name image.json | wc -l | tr -d ' ')" -eq 5
          while IFS= read -r checksum; do
            (cd "$(dirname "$checksum")" && sha256sum --check --strict evidence-checksums.txt)
          done < <(find reconciliation-evidence/images -name evidence-checksums.txt | sort)
          jq -s --arg originalRunId "$PUBLICATION_RUN_ID" --arg publicationWorkflowSha "$PUBLICATION_WORKFLOW_SHA" --arg reconciliationWorkflowSha "$RECONCILIATION_WORKFLOW_SHA" --arg reconciliationRunId "$GITHUB_RUN_ID" --arg reconciliationRunAttempt "$GITHUB_RUN_ATTEMPT" '{schemaVersion:1,kind:"phub-timeweb-amd64-publication-reconciliation",originalRunId:$originalRunId,originalRunAttempt:"1",publicationWorkflowSha:$publicationWorkflowSha,reconciliationWorkflowSha:$reconciliationWorkflowSha,reconciliationRunId:$reconciliationRunId,reconciliationRunAttempt:$reconciliationRunAttempt,authorizesDeploy:false,authorizesVpsProvisioning:false,authorizesDatabaseMutation:false,images:sort_by(.service)}' reconciliation-evidence/images/*/image.json > timeweb-amd64-publication-reconciliation-manifest.json
          jq -e --arg sourceSha "$EXPECTED_SOURCE_SHA" '
            .authorizesDeploy == false and
            .authorizesVpsProvisioning == false and
            .authorizesDatabaseMutation == false and
            ([.images[].service] | sort) == ["api","migrator","realtime","web","worker"] and
            ([.images[].sourceSha] | unique) == [$sourceSha] and
            ([.images[].provenanceVerified] | all) and
            ([.images[].sbomVerified] | all) and
            ([.images[].reconciliationVerified] | all) and
            ([.images[].architecture] | unique) == ["amd64"] and
            ([.images[].indexDigest | test("^sha256:[0-9a-f]{64}$")] | all)
          ' timeweb-amd64-publication-reconciliation-manifest.json >/dev/null
          if test -n "$PRIOR_RECONCILIATION_RUN_ID"; then
            (
              cd prior-reconciliation
              sha256sum --check --strict timeweb-amd64-publication-reconciliation-checksums.txt
            )
            prior_manifest=prior-reconciliation/timeweb-amd64-publication-reconciliation-manifest.json
            jq -e --arg priorRunId "$PRIOR_RECONCILIATION_RUN_ID" --arg publicationRunId "$PUBLICATION_RUN_ID" --arg publicationWorkflowSha "$PUBLICATION_WORKFLOW_SHA" --arg reconciliationWorkflowSha "$RECONCILIATION_WORKFLOW_SHA" --arg sourceSha "$EXPECTED_SOURCE_SHA" '
              .schemaVersion == 1 and
              .kind == "phub-timeweb-amd64-publication-reconciliation" and
              .originalRunId == $publicationRunId and .originalRunAttempt == "1" and
              .publicationWorkflowSha == $publicationWorkflowSha and
              .reconciliationWorkflowSha == $reconciliationWorkflowSha and
              .reconciliationRunId == $priorRunId and .reconciliationRunAttempt == "1" and
              .authorizesDeploy == false and
              .authorizesVpsProvisioning == false and
              .authorizesDatabaseMutation == false and
              ([.images[].sourceSha] | unique) == [$sourceSha] and
              ([.images[].provenanceVerified] | all) and
              ([.images[].sbomVerified] | all) and
              ([.images[].reconciliationVerified] | all) and
              ([.images[].architecture] | unique) == ["amd64"]
            ' "$prior_manifest" >/dev/null
            jq -e --slurpfile prior "$prior_manifest" '
              .originalRunId == $prior[0].originalRunId and
              .publicationWorkflowSha == $prior[0].publicationWorkflowSha and
              .reconciliationWorkflowSha == $prior[0].reconciliationWorkflowSha and
              .images == $prior[0].images
            ' timeweb-amd64-publication-reconciliation-manifest.json >/dev/null
            node scripts/build-timeweb-release-manifest.js \
              timeweb-amd64-publication-reconciliation-manifest.json \
              "$PRIOR_RECONCILIATION_RUN_ID" \
              "$GITHUB_RUN_ID" \
              release-manifest.json \
              release-manifest.sha256
            node scripts/verify-timeweb-release-manifest.js release-manifest.json
          fi
          {
            printf '%s\0' timeweb-amd64-publication-reconciliation-manifest.json
            find reconciliation-evidence/images -type f -print0
            if test -d prior-reconciliation; then find prior-reconciliation -type f -print0; fi
            if test -f release-manifest.json; then
              printf '%s\0' release-manifest.json release-manifest.sha256
            fi
          } | sort -z | xargs -0 sha256sum \
            > timeweb-amd64-publication-reconciliation-checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timeweb-amd64-publication-reconciliation-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            timeweb-amd64-publication-reconciliation-manifest.json
            timeweb-amd64-publication-reconciliation-checksums.txt
            release-manifest.json
            release-manifest.sha256
            reconciliation-evidence/images
            prior-reconciliation
          if-no-files-found: error
          retention-days: 90
