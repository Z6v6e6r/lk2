        schema:
          type: string
          format: uuid
    get:
      tags: [messaging]
      operationId: listConversationMessages
      summary: Read ordered messages after a known sequence
      description: |
        Current membership is checked on every request. The client uses afterSequence for polling
        and, in M2, for deterministic realtime gap recovery.
      parameters:
        - name: afterSequence
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Messages ordered by ascending server-issued sequence.
          headers:
            X-Correlation-ID:
