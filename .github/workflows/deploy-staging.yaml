              "PHUB_ROLLBACK_COMPATIBILITY_FLOOR=$compatibility_floor PHUB_ROLLBACK_BACKUP_ROOT=/opt/phub/backups/releases sh /opt/phub/prepare-compatible-worker-rollback.sh '$STAGING_RELEASE_BACKUP_DIR' PREPARE_COMPATIBLE_WORKER_ROLLBACK"
            ssh "phub-deploy@$HOST" \
              "PHUB_ROLLBACK_COMPATIBILITY_FLOOR=$compatibility_floor PHUB_MEDIA_ROLLBACK_MODE=$compatible_guard_mode sh /opt/phub/verify-media-rollback-safe.sh"
            ssh "phub-deploy@$HOST" \
              "PHUB_ROLLBACK_COMPATIBILITY_FLOOR=$compatibility_floor PHUB_ROLLBACK_REQUIRE_COMPATIBLE_WORKER=true PHUB_ROLLBACK_BACKUP_ROOT=/opt/phub/backups/releases sh /opt/phub/rollback-application.sh '$STAGING_RELEASE_BACKUP_DIR' --confirm=ROLLBACK_STAGING_RELEASE"
          fi
