          } > promotion-eligibility/production-promotion-eligibility.env
          chmod 600 promotion-eligibility/production-promotion-eligibility.env
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.deployment_profile == 'FULL_LIVE_HOME' }}
