name: Publish immutable Timeweb amd64 images

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check the exact source or perform the separately approved publication
        required: true
        type: choice
        default: source_check_only
        options:
          - source_check_only
          - publish
      expected_source_sha:
        description: Exact approved 40-character source SHA to publish
        required: true
        type: string
      expected_workflow_sha:
        description: Exact reviewed main SHA containing this publication workflow
        required: true
        type: string
      confirmation:
        description: Leave empty for validation or type PUBLISH_TIMEWEB_AMD64_595E954
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: timeweb-amd64-image-publication
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact first-attempt main request
        env:
          ACTOR: ${{ github.actor }}
          APPROVED_SOURCE_SHA: 595e954bb8f53367baf034d7f39b255af0fda5fd
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          OPERATION: ${{ inputs.operation }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_REF: ${{ github.ref }}
          REQUEST_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$REQUEST_REF" = refs/heads/main || {
            echo '::error::Image publication is allowed only from the main workflow.'
            exit 1
          }
          test "$WORKFLOW_SHA" = "$REQUEST_SHA" || {
            echo '::error::The workflow must execute from the current main commit.'
            exit 1
          }
          test "$REPOSITORY" = Z6v6e6r/lk2
          test "$RUN_ATTEMPT" = 1
          test "$ACTOR" = "$TRIGGERING_ACTOR"
          printf '%s' "$EXPECTED_SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$EXPECTED_WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_SHA" || {
            echo '::error::The separately reviewed workflow SHA is required.'
            exit 1
          }
          test "$EXPECTED_SOURCE_SHA" = "$APPROVED_SOURCE_SHA" || {
            echo '::error::This single-purpose workflow may publish only source@595e954.'
            exit 1
          }
          case "$OPERATION" in
            source_check_only)
              test -z "$CONFIRMATION" || {
                echo '::error::A source-only check cannot include a publication confirmation.'
                exit 1
              }
              ;;
            publish)
              test "$CONFIRMATION" = PUBLISH_TIMEWEB_AMD64_595E954 || {
                echo '::error::The exact publication confirmation is required.'
                exit 1
              }
              ;;
            *) exit 64 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source ancestry from the reviewed main workflow
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          REQUEST_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUEST_SHA"
          test "$(git rev-parse "$EXPECTED_SOURCE_SHA^{tree}")" = 3f4c1e63dd30eb60251533b95f1970fd96754a08
          git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" HEAD

  verify-source:
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_source_sha }}
      - name: Verify exact clean source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse 'HEAD^{tree}')" = 3f4c1e63dd30eb60251533b95f1970fd96754a08
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run contracts:generate
      - run: npm run check

  build-and-publish:
    needs: [validate-request, verify-source]
    if: ${{ inputs.operation == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    environment: timeweb-amd64-publication
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, worker, realtime, migrator]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_source_sha }}
      - name: Verify exact clean source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse 'HEAD^{tree}')" = 3f4c1e63dd30eb60251533b95f1970fd96754a08
      - id: buildx
        name: Install the checksum-verified Buildx binary and create the pinned builder
        env:
          BUILDX_SHA256: 48af8a397ebd60178778bf63611dbcebe5f5e7a9be90eb9147b24b9587455778
          BUILDX_VERSION: v0.36.1
          BUILDKIT_IMAGE: moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/docker-buildx"
          plugin="$HOME/.docker/cli-plugins/docker-buildx"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$download" \
            "https://github.com/docker/buildx/releases/download/$BUILDX_VERSION/buildx-$BUILDX_VERSION.linux-amd64"
          printf '%s  %s\n' "$BUILDX_SHA256" "$download" | sha256sum --check --strict
          install -D -m 0755 "$download" "$plugin"
          printf '%s  %s\n' "$BUILDX_SHA256" "$plugin" | sha256sum --check --strict
          builder_name="phub-timeweb-publish-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx create \
            --name "$builder_name" \
            --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" \
            --use
          printf 'name=%s\n' "$builder_name" >> "$GITHUB_OUTPUT"
      - name: Verify the pinned Buildx and BuildKit runtime before registry login
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          docker buildx version \
            | grep -Fx 'github.com/docker/buildx v0.36.1 1d8dde89b8aba914e05e45366770736fea1fd690'
          docker buildx inspect --bootstrap \
            | grep -Eq '^BuildKit version:[[:space:]]+v0\.32\.2$'
          container_id="$(docker ps --filter "name=buildx_buildkit_$BUILDER_NAME" \
            --format '{{.ID}}')"
          printf '%s' "$container_id" | grep -Eq '^[0-9a-f]{12,64}$'
          test "$(docker inspect --format '{{.Config.Image}}' "$container_id")" \
            = 'moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8'
      - name: Verify reviewed base-image digests before registry login
        env:
          EXPECTED_NGINX_AMD64_DIGEST: sha256:62223d644fa234c3a1cc785ee14242ec47a77364226f1c811d2f669f96dc2ac8
          EXPECTED_NGINX_INDEX_DIGEST: sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          EXPECTED_NODE_AMD64_DIGEST: sha256:a17d50af28002a160548bd4225b3cfcb12c5efcb171f79e68758f2885fb1b066
          EXPECTED_NODE_INDEX_DIGEST: sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436
          EXPECTED_SBOM_AMD64_DIGEST: sha256:187e1892a7752c9384c59aba9517dd8e40610b748c72773e87b63720514463c2
          EXPECTED_SBOM_INDEX_DIGEST: sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
        run: |
          set -euo pipefail
          verify_base() {
            image=$1
            expected_index_digest=$2
            expected_amd64_digest=$3
            manifest_file="$RUNNER_TEMP/$(printf '%s' "$image" | tr '/:' '--').manifest.json"
            docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' > "$manifest_file"
            observed_index_digest="$(jq -r '.digest // empty' "$manifest_file")"
            observed_amd64_digest="$(jq -r '
              [.manifests[] | select(
                .platform.os == "linux" and
                .platform.architecture == "amd64" and
                ((.platform.variant // "") == "")
              )] | if length == 1 then .[0].digest else empty end
            ' "$manifest_file")"
            test "$observed_index_digest" = "$expected_index_digest"
            test "$observed_amd64_digest" = "$expected_amd64_digest"
          }
          verify_base node:22-bookworm-slim \
            "$EXPECTED_NODE_INDEX_DIGEST" "$EXPECTED_NODE_AMD64_DIGEST"
          verify_base nginx:1.27-alpine \
            "$EXPECTED_NGINX_INDEX_DIGEST" "$EXPECTED_NGINX_AMD64_DIGEST"
          verify_base docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9 \
            "$EXPECTED_SBOM_INDEX_DIGEST" "$EXPECTED_SBOM_AMD64_DIGEST"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite the unique publication tag
        env:
          IMAGE_TAG: ghcr.io/z6v6e6r/phub-${{ matrix.service }}:amd64-sha-${{ inputs.expected_source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            echo '::error::The unique publication tag already exists.'
            exit 1
          fi
      - id: image
        name: Build and publish immutable linux/amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: https://github.com/Z6v6e6r/lk2.git#${{ inputs.expected_source_sha }}
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/z6v6e6r/phub-${{ matrix.service }}:amd64-sha-${{ inputs.expected_source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.expected_source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=amd64-sha-${{ inputs.expected_source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            PHUB_RELEASE=${{ inputs.expected_source_sha }}
          provenance: mode=max,version=v1
          sbom: generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          cache-from: type=gha,scope=timeweb-amd64-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=timeweb-amd64-${{ matrix.service }}
      - name: Capture the immediate non-authorizing push receipt
        if: ${{ steps.image.outputs.digest != '' }}
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REFERENCE: ghcr.io/z6v6e6r/phub-${{ matrix.service }}
          SERVICE: ${{ matrix.service }}
          SOURCE_SHA: ${{ inputs.expected_source_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          mkdir -p publication-receipt
          jq -n \
            --arg service "$SERVICE" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --arg repository "$IMAGE_REFERENCE" \
            --arg indexDigest "$IMAGE_DIGEST" \
            --arg publicationTag "amd64-sha-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schemaVersion: 1,
              kind: "phub-timeweb-amd64-immediate-push-receipt",
              service: $service,
              sourceSha: $sourceSha,
              workflowSha: $workflowSha,
              repository: $repository,
              indexDigest: $indexDigest,
              publicationTag: $publicationTag,
              platform: "linux/amd64",
              runId: $runId,
              runAttempt: $runAttempt,
              verified: false,
              complete: false,
              authorizesDeploy: false
            }' > "publication-receipt/$SERVICE-push-receipt.json"
      - name: Preserve the immediate non-authorizing push receipt
        if: ${{ steps.image.outputs.digest != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timeweb-amd64-push-receipt-${{ matrix.service }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-receipt
          if-no-files-found: error
          retention-days: 90
      - name: Verify registry custody and runtime image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REFERENCE: ghcr.io/z6v6e6r/phub-${{ matrix.service }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_NGINX_INDEX_DIGEST: sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          EXPECTED_NODE_INDEX_DIGEST: sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436
          EXPECTED_SBOM_INDEX_DIGEST: sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          SERVICE: ${{ matrix.service }}
          SOURCE_SHA: ${{ inputs.expected_source_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          # GHCR can expose the pushed root index before its linked attestations.
          # Retry only exact digest-addressed reads; never substitute a tag or digest.
          retry_helper="$RUNNER_TEMP/timeweb-amd64-registry-custody-retry.sh"
          git show "$WORKFLOW_SHA:scripts/timeweb-amd64-registry-custody-retry.sh" > "$retry_helper"
          source "$retry_helper"
          printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "${#IMAGE_DIGEST}" -eq 71
          mkdir -p publication-evidence
          phub_ghcr_custody_retry "$SERVICE-root-index" phub_ghcr_custody_read_exact_json \
            "$IMAGE_REFERENCE@$IMAGE_DIGEST" "$IMAGE_DIGEST" \
            "publication-evidence/$SERVICE-oci-index.json"
          runtime_digest="$(jq -r '
            [.manifests[] | select(
              .platform.os == "linux" and
              .platform.architecture == "amd64" and
              ((.platform.variant // "") == "")
            )] | if length == 1 then .[0].digest else empty end
          ' "publication-evidence/$SERVICE-oci-index.json")"
          printf '%s' "$runtime_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          runtime_size="$(jq -r '
            [.manifests[] | select(
              .platform.os == "linux" and
              .platform.architecture == "amd64" and
              ((.platform.variant // "") == "")
            )] | if length == 1 then .[0].size else empty end
          ' "publication-evidence/$SERVICE-oci-index.json")"
          printf '%s' "$runtime_size" | grep -Eq '^[1-9][0-9]*$'
          attestation_count="$(jq '[.manifests[] | select(
            .platform.os == "unknown" and
            .platform.architecture == "unknown" and
            .annotations["vnd.docker.reference.type"] == "attestation-manifest"
          )] | length' "publication-evidence/$SERVICE-oci-index.json")"
          test "$attestation_count" -ge 1
          mkdir -p "publication-evidence/$SERVICE-attestation-manifests"
          jq -r --arg runtime "$runtime_digest" '.manifests[] | select(
            .platform.os == "unknown" and
            .platform.architecture == "unknown" and
            .annotations["vnd.docker.reference.type"] == "attestation-manifest" and
            .annotations["vnd.docker.reference.digest"] == $runtime
          ) | .digest' "publication-evidence/$SERVICE-oci-index.json" \
            > "publication-evidence/$SERVICE-attestation-digests.txt"
          test "$(wc -l < "publication-evidence/$SERVICE-attestation-digests.txt" | tr -d ' ')" -eq "$attestation_count"
          while IFS= read -r attestation_digest; do
            printf '%s' "$attestation_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            phub_ghcr_custody_retry "$SERVICE-attestation-manifest-${attestation_digest#sha256:}" phub_ghcr_custody_read_exact_json \
              "$IMAGE_REFERENCE@$attestation_digest" "$attestation_digest" \
              "publication-evidence/$SERVICE-attestation-manifests/${attestation_digest#sha256:}.json"
          done < "publication-evidence/$SERVICE-attestation-digests.txt"
          jq -s -e --arg runtime "$runtime_digest" --argjson runtimeSize "$runtime_size" '
            length >= 1 and
            all(.[];
              .schemaVersion == 2 and
              .mediaType == "application/vnd.oci.image.manifest.v1+json" and
              .artifactType == "application/vnd.docker.attestation.manifest.v1+json" and
              .subject.mediaType == "application/vnd.oci.image.manifest.v1+json" and
              .subject.digest == $runtime and
              .subject.size == $runtimeSize and
              .config.mediaType == "application/vnd.oci.empty.v1+json" and
              .config.digest == "sha256:44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a" and
              .config.size == 2 and
              .config.data == "e30="
            )
          ' publication-evidence/"$SERVICE"-attestation-manifests/*.json >/dev/null
          jq -s -e '
            [.[].layers[].annotations["in-toto.io/predicate-type"]] | sort | unique == [
              "https://slsa.dev/provenance/v1",
              "https://spdx.dev/Document"
            ]
          ' publication-evidence/"$SERVICE"-attestation-manifests/*.json >/dev/null
          mkdir -p "publication-evidence/$SERVICE-attestation-statements"
          jq -s -e '
            [.[].layers[]] as $layers |
            ($layers | length) == 2 and
            all($layers[];
              .mediaType == "application/vnd.in-toto+json" and
              (.digest | test("^sha256:[0-9a-f]{64}$")) and
              (.annotations["in-toto.io/predicate-type"] == "https://spdx.dev/Document" or
               .annotations["in-toto.io/predicate-type"] == "https://slsa.dev/provenance/v1")
            )
          ' publication-evidence/"$SERVICE"-attestation-manifests/*.json >/dev/null
          jq -s -r '.[].layers[] |
            [.digest, .annotations["in-toto.io/predicate-type"], .size, .mediaType] | @tsv' \
            publication-evidence/"$SERVICE"-attestation-manifests/*.json \
            | sort -u > "publication-evidence/$SERVICE-attestation-layers.tsv"
          cut -f 1 "publication-evidence/$SERVICE-attestation-layers.tsv" \
            > "publication-evidence/$SERVICE-attestation-layer-digests.txt"
          test "$(wc -l < "publication-evidence/$SERVICE-attestation-layer-digests.txt" | tr -d ' ')" -eq 2
          registry_token="$({
            printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$GITHUB_TOKEN"
          } | curl --fail --silent --show-error --config - \
            "https://ghcr.io/token?service=ghcr.io&scope=repository%3Az6v6e6r%2Fphub-$SERVICE%3Apull" \
            | jq -r '.token // empty')"
          printf '%s' "$registry_token" | grep -Eq '^[A-Za-z0-9._~+/-]+=*$'
          while IFS=$'\t' read -r statement_digest predicate_type statement_size statement_media_type; do
            printf '%s' "$statement_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            phub_ghcr_custody_retry "$SERVICE-attestation-statement-${statement_digest#sha256:}" \
              phub_ghcr_custody_fetch_exact_statement_blob \
              "$SERVICE" "$statement_digest" "$statement_size" "$statement_media_type" \
              "$registry_token" \
              "publication-evidence/$SERVICE-attestation-statements/${statement_digest#sha256:}.json"
            test "$(sha256sum "publication-evidence/$SERVICE-attestation-statements/${statement_digest#sha256:}.json" \
              | awk '{print "sha256:" $1}')" = "$statement_digest"
            test "$(jq -r '.predicateType' \
              "publication-evidence/$SERVICE-attestation-statements/${statement_digest#sha256:}.json")" \
              = "$predicate_type"
          done < "publication-evidence/$SERVICE-attestation-layers.tsv"
          unset registry_token
          jq -s -e --arg runtimeSha "${runtime_digest#sha256:}" --arg sourceSha "$SOURCE_SHA" \
            --arg service "$SERVICE" \
            --arg nodeIndexSha "${EXPECTED_NODE_INDEX_DIGEST#sha256:}" \
            --arg nginxIndexSha "${EXPECTED_NGINX_INDEX_DIGEST#sha256:}" \
            --arg scannerIndexSha "${EXPECTED_SBOM_INDEX_DIGEST#sha256:}" \
            --arg builder "https://github.com/Z6v6e6r/lk2/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" '
            def reviewed_base($name; $tag; $sha):
              (.digest |
                type == "object" and
                keys == ["sha256"] and
                .sha256 == $sha
              ) and
              (.uri == "pkg:docker/\($name)@\($tag)?platform=linux%2Famd64" or
               .uri == "pkg:docker/docker.io/library/\($name)@\($tag)?platform=linux%2Famd64");
            def reviewed_scanner($sha):
              (.digest |
                type == "object" and
                keys == ["sha256"] and
                .sha256 == $sha
              ) and
              (.uri == "pkg:docker/docker/buildkit-syft-scanner?digest=sha256:\($sha)&platform=linux%2Famd64" or
               .uri == "pkg:docker/docker.io/docker/buildkit-syft-scanner?digest=sha256:\($sha)&platform=linux%2Famd64");
            def reviewed_source:
              .uri == "https://github.com/Z6v6e6r/lk2.git#\($sourceSha)" and
              (.digest | type == "object" and keys == ["sha1"] and .sha1 == $sourceSha);
            (map(select(.predicateType == "https://slsa.dev/provenance/v1"))[0].predicate) as $provenance |
            ($provenance.buildDefinition.resolvedDependencies // []) as $materials |
            length == 2 and
            ([.[].predicateType] | sort | unique) == [
              "https://slsa.dev/provenance/v1",
              "https://spdx.dev/Document"
            ] and
            all(.[];
              ._type == "https://in-toto.io/Statement/v1" and
              (.subject | length) == 1 and
              (.subject[0].digest | keys) == ["sha256"] and
              .subject[0].digest.sha256 == $runtimeSha
            ) and
            $provenance.buildDefinition.buildType ==
              "https://github.com/moby/buildkit/blob/master/docs/attestations/slsa-definitions.md" and
            $provenance.runDetails.builder.id == $builder and
            $provenance.runDetails.metadata.buildkit_completeness.resolvedDependencies == true and
            $provenance.buildDefinition.externalParameters.configSource.uri ==
              "https://github.com/Z6v6e6r/lk2.git#\($sourceSha)" and
            $provenance.buildDefinition.externalParameters.configSource.digest == {"sha1": $sourceSha} and
            $provenance.buildDefinition.externalParameters.configSource.path ==
              "apps/\($service)/Dockerfile" and
            ($materials | type) == "array" and
            ([$materials[] | select(reviewed_source)] | length) == 1 and
            ([$materials[] | select(reviewed_base("node"; "22-bookworm-slim"; $nodeIndexSha))] |
              length) == 1 and
            ([$materials[] | select(reviewed_scanner($scannerIndexSha))] |
              length) == 1 and
            (if $service == "web" then
              ($materials | length) == 4 and
              ([$materials[] | select(reviewed_base("nginx"; "1.27-alpine"; $nginxIndexSha))] |
                length) == 1
            else
              ($materials | length) == 3
            end) and
            (map(select(.predicateType == "https://spdx.dev/Document"))[0].predicate) as $sbom |
            $sbom.SPDXID == "SPDXRef-DOCUMENT" and
            ($sbom.packages | type == "array" and length > 0)
          ' publication-evidence/"$SERVICE"-attestation-statements/*.json >/dev/null
          read_buildx_presentation() {
            template=$1
            destination=$2
            temporary="$destination.attempt-$$"
            rm -f "$temporary"
            docker buildx imagetools inspect "$IMAGE_REFERENCE@$IMAGE_DIGEST" \
              --format "$template" > "$temporary"
            jq -e 'type == "object"' "$temporary" >/dev/null
            mv "$temporary" "$destination"
          }
          phub_ghcr_custody_retry "$SERVICE-buildx-provenance" \
            read_buildx_presentation '{{json .Provenance.SLSA}}' \
            "publication-evidence/$SERVICE-provenance.json"
          phub_ghcr_custody_retry "$SERVICE-buildx-sbom" \
            read_buildx_presentation '{{json .SBOM.SPDX}}' \
            "publication-evidence/$SERVICE-sbom.spdx.json"
          jq -e 'type == "object" and (.buildDefinition | type == "object")' \
            "publication-evidence/$SERVICE-provenance.json" >/dev/null
          jq -e 'type == "object" and .SPDXID == "SPDXRef-DOCUMENT"' \
            "publication-evidence/$SERVICE-sbom.spdx.json" >/dev/null
          jq -s -e '
            (map(select(.predicateType == "https://slsa.dev/provenance/v1"))[0].predicate) == $provenance[0] and
            (map(select(.predicateType == "https://spdx.dev/Document"))[0].predicate) == $sbom[0]
          ' --slurpfile provenance "publication-evidence/$SERVICE-provenance.json" \
            --slurpfile sbom "publication-evidence/$SERVICE-sbom.spdx.json" \
            publication-evidence/"$SERVICE"-attestation-statements/*.json >/dev/null

          runtime_reference="$IMAGE_REFERENCE@$runtime_digest"
          phub_ghcr_custody_retry "$SERVICE-runtime-manifest" phub_ghcr_custody_read_exact_json \
            "$runtime_reference" "$runtime_digest" \
            "publication-evidence/$SERVICE-runtime-manifest.json"
          test "$(sha256sum "publication-evidence/$SERVICE-runtime-manifest.json" | awk '{print "sha256:" $1}')" = "$runtime_digest"
          phub_ghcr_custody_retry "$SERVICE-runtime-pull" \
            docker pull --platform linux/amd64 "$runtime_reference"
          platform="$(docker image inspect "$runtime_reference" --format '{{.Os}}/{{.Architecture}}')"
          image_id="$(docker image inspect "$runtime_reference" --format '{{.Id}}')"
          image_user="$(docker image inspect "$runtime_reference" --format '{{.Config.User}}')"
          revision="$(docker image inspect "$runtime_reference" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          source="$(docker image inspect "$runtime_reference" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')"
          test "$platform" = linux/amd64
          printf '%s' "$image_id" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "$revision" = "$SOURCE_SHA"
          test "$source" = "https://github.com/$GITHUB_REPOSITORY"

          case "$SERVICE" in
            web)
              test -z "$image_user"
              docker run --rm --entrypoint /bin/sh "$runtime_reference" -ec \
                'test -s /usr/share/nginx/html/index.html && nginx -t'
              container_id="$(docker run --rm -d -p 127.0.0.1::8080 "$runtime_reference")"
              trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
              address="$(docker port "$container_id" 8080/tcp)"
              port="${address##*:}"
              printf '%s' "$port" | grep -Eq '^[0-9]+$'
              for attempt in {1..30}; do
                if curl --fail --silent --show-error "http://127.0.0.1:$port/healthz" \
                  | grep --quiet '^ok$'; then
                  break
                fi
                if test "$attempt" -eq 30; then
                  docker logs "$container_id"
                  exit 1
                fi
                sleep 1
              done
              curl --fail --silent --show-error "http://127.0.0.1:$port/" \
                | grep --quiet '<div id="phub-app"></div>'
              docker rm -f "$container_id" >/dev/null
              trap - EXIT
              ;;
            api|worker)
              test "$image_user" = appuser
              docker run --rm --entrypoint /bin/sh "$runtime_reference" -ec \
                "test \"\$(id -u)\" = 1001 && test -s /app/apps/$SERVICE/dist/main.js"
              docker run --rm --entrypoint node "$runtime_reference" \
                --check "/app/apps/$SERVICE/dist/main.js"
              docker run --rm --entrypoint node "$runtime_reference" --input-type=module -e \
                "import sharp from 'sharp';
                 if (process.platform !== 'linux' || process.arch !== 'x64') process.exit(1);
                 const output = await sharp({
                   create: {
                     width: 1,
                     height: 1,
                     channels: 4,
                     background: { r: 0, g: 0, b: 0, alpha: 1 },
                   },
                 }).webp().toBuffer();
                 if (output.length === 0) process.exit(1);"
              ;;
            realtime)
              test "$image_user" = appuser
              docker run --rm --entrypoint /bin/sh "$runtime_reference" -ec \
                'test "$(id -u)" = 1001 && test -s /app/apps/realtime/dist/main.js'
              docker run --rm --entrypoint node "$runtime_reference" \
                --check /app/apps/realtime/dist/main.js
              docker run --rm --entrypoint node "$runtime_reference" -e \
                "if (process.platform !== 'linux' || process.arch !== 'x64') process.exit(1)"
              ;;
            migrator)
              test "$image_user" = appuser
              docker run --rm --entrypoint /bin/sh "$runtime_reference" -ec \
                'test "$(id -u)" = 1001 && test -s /app/apps/migrator/dist/main.js && test -d /app/migrations'
              docker run --rm --entrypoint node "$runtime_reference" \
                --check /app/apps/migrator/dist/main.js
              docker run --rm --entrypoint node "$runtime_reference" -e \
                "if (process.platform !== 'linux' || process.arch !== 'x64') process.exit(1)"
              ;;
            *) exit 64 ;;
          esac

          git_tree_sha="$(git rev-parse 'HEAD^{tree}')"
          publication_tag="amd64-sha-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          jq -n \
            --arg service "$SERVICE" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg sourceTree "$git_tree_sha" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --arg repository "$IMAGE_REFERENCE" \
            --arg indexDigest "$IMAGE_DIGEST" \
            --arg runtimeDigest "$runtime_digest" \
            --arg publicationTag "$publication_tag" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{
              service: $service,
              sourceSha: $sourceSha,
              sourceTree: $sourceTree,
              workflowSha: $workflowSha,
              repository: $repository,
              indexDigest: $indexDigest,
              runtimeDigest: $runtimeDigest,
              publicationTag: $publicationTag,
              platform: "linux/amd64",
              provenance: "slsa-v1-max",
              sbom: "spdx",
              runId: $runId,
              runAttempt: $runAttempt
            }' > "publication-evidence/$SERVICE-image.json"
          find publication-evidence -type f ! -name '*-evidence-checksums.txt' -print0 \
            | sort -z | xargs -0 sha256sum \
            > "publication-evidence/$SERVICE-evidence-checksums.txt"
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timeweb-amd64-image-${{ matrix.service }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-evidence
          if-no-files-found: error
          retention-days: 90
  publication-inventory:
    needs: [validate-request, verify-source, build-and-publish]
    if: ${{ always() && inputs.operation == 'publish' && needs.validate-request.result == 'success' && needs.verify-source.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install the checksum-verified Buildx binary
        env:
          BUILDX_SHA256: 48af8a397ebd60178778bf63611dbcebe5f5e7a9be90eb9147b24b9587455778
          BUILDX_VERSION: v0.36.1
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/docker-buildx"
          plugin="$HOME/.docker/cli-plugins/docker-buildx"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$download" \
            "https://github.com/docker/buildx/releases/download/$BUILDX_VERSION/buildx-$BUILDX_VERSION.linux-amd64"
          printf '%s  %s\n' "$BUILDX_SHA256" "$download" | sha256sum --check --strict
          install -D -m 0755 "$download" "$plugin"
          printf '%s  %s\n' "$BUILDX_SHA256" "$plugin" | sha256sum --check --strict
          docker buildx version \
            | grep -Fx 'github.com/docker/buildx v0.36.1 1d8dde89b8aba914e05e45366770736fea1fd690'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inventory deterministic run tags without granting release authority
        env:
          BUILD_RESULT: ${{ needs.build-and-publish.result }}
          SOURCE_SHA: ${{ inputs.expected_source_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p publication-inventory/indexes publication-inventory/records
          present=0
          for service in web api worker realtime migrator; do
            repository="ghcr.io/z6v6e6r/phub-$service"
            publication_tag="amd64-sha-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            reference="$repository:$publication_tag"
            index_path="publication-inventory/indexes/$service-oci-index.json"
            if docker buildx imagetools inspect "$reference" --raw > "$index_path" 2>/dev/null; then
              index_digest="$(sha256sum "$index_path" | awk '{print "sha256:" $1}')"
              status=present
              present=$((present + 1))
            else
              rm -f "$index_path"
              index_digest=''
              status=absent
            fi
            jq -n \
              --arg service "$service" \
              --arg repository "$repository" \
              --arg publicationTag "$publication_tag" \
              --arg status "$status" \
              --arg indexDigest "$index_digest" \
              '{
                service: $service,
                repository: $repository,
                publicationTag: $publicationTag,
                status: $status,
                indexDigest: (if $indexDigest == "" then null else $indexDigest end)
              }' > "publication-inventory/records/$service.json"
          done
          complete=false
          if test "$BUILD_RESULT" = success && test "$present" -eq 5; then
            complete=true
          fi
          jq -s \
            --arg sourceSha "$SOURCE_SHA" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --argjson present "$present" \
            --argjson complete "$complete" \
            '{
              schemaVersion: 1,
              kind: "phub-timeweb-amd64-registry-inventory",
              sourceSha: $sourceSha,
              workflowSha: $workflowSha,
              platform: "linux/amd64",
              runId: $runId,
              runAttempt: $runAttempt,
              presentImages: $present,
              expectedImages: 5,
              complete: $complete,
              authorizesDeploy: false,
              images: sort_by(.service)
            }' publication-inventory/records/*.json \
            > publication-inventory/timeweb-amd64-registry-inventory.json
          cat publication-inventory/timeweb-amd64-registry-inventory.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timeweb-amd64-registry-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-inventory
          if-no-files-found: error
          retention-days: 90
      - name: Refuse a complete release when registry inventory is incomplete
        if: ${{ needs.build-and-publish.result == 'success' }}
        run: |
          set -euo pipefail
          jq -e '.complete == true and .presentImages == 5' \
            publication-inventory/timeweb-amd64-registry-inventory.json >/dev/null

  publication-manifest:
    needs: [validate-request, verify-source, build-and-publish, publication-inventory]
    if: ${{ inputs.operation == 'publish' && needs.build-and-publish.result == 'success' && needs.publication-inventory.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: timeweb-amd64-image-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-evidence/images
          merge-multiple: true
      - name: Create and validate internal and canonical publication manifests
        env:
          SOURCE_SHA: ${{ inputs.expected_source_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          node scripts/verify-timeweb-publication-evidence-checksums.js publication-evidence/images
          test "$(find publication-evidence/images -maxdepth 1 -type f -name '*-image.json' | wc -l | tr -d ' ')" -eq 5
          source_tree="$(git rev-parse --verify "$SOURCE_SHA^{tree}")"
          test "$source_tree" = 3f4c1e63dd30eb60251533b95f1970fd96754a08
          jq -s \
            --arg sourceSha "$SOURCE_SHA" \
            --arg sourceTree "$source_tree" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schemaVersion: 1,
              kind: "phub-timeweb-amd64-publication",
              sourceSha: $sourceSha,
              sourceTree: $sourceTree,
              workflowSha: $workflowSha,
              repository: $repository,
              platform: "linux/amd64",
              runId: $runId,
              runAttempt: $runAttempt,
              authorizesDeploy: false,
              authorizesVpsProvisioning: false,
              authorizesDatabaseMutation: false,
              images: sort_by(.service)
            }' publication-evidence/images/*-image.json \
            > timeweb-amd64-publication-manifest.json
          jq -e --arg sourceSha "$SOURCE_SHA" --arg sourceTree "$source_tree" --arg workflowSha "$WORKFLOW_SHA" --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$GITHUB_RUN_ATTEMPT" '
            .sourceSha == $sourceSha and
            .sourceTree == $sourceTree and
            .workflowSha == $workflowSha and
            .repository == "Z6v6e6r/lk2" and
            .platform == "linux/amd64" and
            .runId == $runId and .runAttempt == $runAttempt and
            .authorizesDeploy == false and
            .authorizesVpsProvisioning == false and
            .authorizesDatabaseMutation == false and
            ([.images[].service] | sort) == ["api", "migrator", "realtime", "web", "worker"] and
            ([.images[].indexDigest | test("^sha256:[0-9a-f]{64}$")] | all) and
            ([.images[].runtimeDigest | test("^sha256:[0-9a-f]{64}$")] | all) and
            all(.images[];
              .sourceSha == $sourceSha and
              .sourceTree == $sourceTree and
              .workflowSha == $workflowSha and
              .repository == ("ghcr.io/z6v6e6r/phub-" + .service) and
              .publicationTag == ("amd64-sha-" + $sourceSha + "-" + $runId + "-" + $runAttempt) and
              .platform == "linux/amd64" and
              .provenance == "slsa-v1-max" and
              .sbom == "spdx" and
              .runId == $runId and .runAttempt == $runAttempt
            )
          ' timeweb-amd64-publication-manifest.json >/dev/null
          sha256sum timeweb-amd64-publication-manifest.json \
            publication-evidence/images/*-provenance.json \
            publication-evidence/images/*-sbom.spdx.json \
            > timeweb-amd64-publication-checksums.txt
          node scripts/build-timeweb-release-manifest.js \
            timeweb-amd64-publication-manifest.json \
            release-manifest.json \
            release-manifest.sha256
          node scripts/verify-timeweb-release-manifest.js \
            release-manifest.json \
            --expected-publication-workflow-sha "$WORKFLOW_SHA" \
            --expected-publication-run-id "$GITHUB_RUN_ID" \
            --expected-publication-run-attempt "$GITHUB_RUN_ATTEMPT"
          sha256sum --check --strict release-manifest.sha256
          cat timeweb-amd64-publication-manifest.json
      - id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timeweb-amd64-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            timeweb-amd64-publication-manifest.json
            timeweb-amd64-publication-checksums.txt
            publication-evidence/images/*-oci-index.json
            publication-evidence/images/*-runtime-manifest.json
            publication-evidence/images/*-attestation-digests.txt
            publication-evidence/images/*-attestation-layer-digests.txt
            publication-evidence/images/*-attestation-layers.tsv
            publication-evidence/images/*-attestation-manifests/*.json
            publication-evidence/images/*-attestation-statements/*.json
            publication-evidence/images/*-provenance.json
            publication-evidence/images/*-sbom.spdx.json
            publication-evidence/images/*-image.json
            publication-evidence/images/*-evidence-checksums.txt
          if-no-files-found: error
          retention-days: 90
      - id: canonical
        name: Preserve same-run canonical publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timeweb-amd64-canonical-release-${{ inputs.expected_source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-manifest.json
            release-manifest.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Surface publication evidence custody
        env:
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          CANONICAL_ARTIFACT_DIGEST: ${{ steps.canonical.outputs.artifact-digest }}
          CANONICAL_ARTIFACT_ID: ${{ steps.canonical.outputs.artifact-id }}
          SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          printf '%s' "$ARTIFACT_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s' "$ARTIFACT_ID" | grep -Eq '^[0-9]+$'
          printf '%s' "$CANONICAL_ARTIFACT_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s' "$CANONICAL_ARTIFACT_ID" | grep -Eq '^[0-9]+$'
          {
            echo '## Timeweb amd64 image publication'
            echo
            echo "Source SHA: \`$SOURCE_SHA\`"
            echo 'Platform: `linux/amd64`'
            echo "Evidence artifact ID: \`$ARTIFACT_ID\`"
            echo "Evidence artifact digest: \`sha256:$ARTIFACT_DIGEST\`"
            echo "Canonical artifact ID: \`$CANONICAL_ARTIFACT_ID\`"
            echo "Canonical artifact digest: \`sha256:$CANONICAL_ARTIFACT_DIGEST\`"
            echo 'Authorizes deploy: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
