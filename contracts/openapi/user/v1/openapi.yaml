  /{tenantKey}/communities/{communityId}/ownership-transfers:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - name: communityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [communities]
      operationId: transferCommunityOwnership
      summary: Transfer ownership to an ACTIVE community member
      description: |
        Only the current ACTIVE OWNER may issue this command. The previous owner becomes ADMIN and
        the target becomes OWNER in the same tenant transaction. Optimistic revisions, stored
        idempotency result, audit and outbox prevent split ownership and retry duplication. The
        target must own fewer than three ACTIVE communities; no quota grant applies to transfer.
        The target-scoped owner quota lock is shared with community creation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityOwnershipTransferRequest'
      responses:
        '200':
          description: Applied transfer or the stored idempotent replay.
          headers:
            X-Correlation-ID:
              $ref: ../../common/components.yaml#/components/headers/CorrelationId
            X-Idempotent-Replayed:
              description: Whether this result was replayed from stored command state.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityOwnershipTransferState'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '409':
          $ref: '#/components/responses/CommandConflict'
        '429':
