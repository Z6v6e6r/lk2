name: Test stand

# Builds the five LK2 images for each main commit whose CI ("Pull request checks") succeeded and
# deploys them to the disposable test stand. A manual run deploys the chosen SHA.
# Not a production route: no custody, no backup, broad runtime grants. See deploy/test-stand/README.md.
on:
  workflow_run:
    workflows: ['Pull request checks']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy (default: the selected ref)'
        required: false
      reset:
        description: Wipe the stand database before deploying
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  CANDIDATE_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: test-stand
  cancel-in-progress: false

jobs:
  images:
    # Only a green main push CI run (or an explicit manual run) reaches the stand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        service: [api, worker, realtime, web, migrator]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/z6v6e6r/phub-${{ matrix.service }}:${{ env.CANDIDATE_SHA }}
          build-args: |
            PHUB_RELEASE=${{ env.CANDIDATE_SHA }}
          cache-from: type=gha,scope=test-stand-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=test-stand-${{ matrix.service }}

  # Upstream no longer serves pullable MinIO images, so the stand uses its own build of the same
  # release (deploy/test-stand/minio.Dockerfile). The tag is immutable: built once, then reused.
  minio:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MINIO_IMAGE: ghcr.io/z6v6e6r/phub-test-stand-minio:RELEASE.2025-09-07T16-13-09Z
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for an existing image
        id: existing
        run: |
          if docker manifest inspect "$MINIO_IMAGE" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.existing.outputs.found != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: deploy/test-stand
          file: deploy/test-stand/minio.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.MINIO_IMAGE }}

  deploy:
    needs: [images, minio]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test-stand
    env:
      HOST: ${{ secrets.TEST_STAND_SSH_HOST }}
      SSH_USER: ${{ secrets.TEST_STAND_SSH_USER }}
      SSH_KEY: ${{ secrets.TEST_STAND_SSH_KEY }}
      TAG: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
      RESET: ${{ inputs.reset && '--reset' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Skip when the stand is not configured
        id: configured
        run: |
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "TEST_STAND_SSH_HOST/TEST_STAND_SSH_KEY are not set; images are published, deploy skipped."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Copy stand files and deploy
        if: steps.configured.outputs.ok == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_stand && chmod 600 ~/.ssh/id_stand
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          target="${SSH_USER:-root}@$HOST"
          ssh -i ~/.ssh/id_stand "$target" 'mkdir -p ~/phub-test-stand'
          # stand.env, .secrets/ and .deploy-history live only on the host and are never overwritten.
          scp -i ~/.ssh/id_stand deploy/test-stand/{compose.yaml,Caddyfile,deploy.sh,grant-runtime.sql,stand-runtime.sql,stand.env.example,README.md} \
            "$target:phub-test-stand/"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_stand "$target" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null && cd ~/phub-test-stand && chmod +x deploy.sh && ./deploy.sh $RESET $TAG"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.configured.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Provision the game notification ruleset
        # Idempotent (fixed idempotency key); a --reset wipes it, so every deploy re-applies it
        # through an SSH tunnel to the stand PostgreSQL with the synthetic operator.
        if: steps.configured.outputs.ok == 'true'
        run: |
          set -euo pipefail
          target="${SSH_USER:-root}@$HOST"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run contracts:generate && npm run build:packages
          ssh_stand() { ssh -i ~/.ssh/id_stand -o BatchMode=yes "$target" "$@"; }
          pg_ip=$(ssh_stand "docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \$(docker ps -q -f label=com.docker.compose.project=phub-test -f label=com.docker.compose.service=postgres)")
          pg_password=$(ssh_stand "sed -n 's/^POSTGRES_PASSWORD=//p' ~/phub-test-stand/.secrets/postgres.env")
          echo "::add-mask::$pg_password"
          ssh -i ~/.ssh/id_stand -o BatchMode=yes -o ExitOnForwardFailure=yes -f -N -L "15432:$pg_ip:5432" "$target"
          DATABASE_URL="postgres://postgres:$pg_password@127.0.0.1:15432/phub" \
            npm run notifications:game:provision -- --tenant-key=local-padel \
            --actor-id=00000000-0000-4000-8000-00000000a001 \
            --idempotency-key=test-stand-game-ruleset-v1 --confirm=APPLY_GAME_NOTIFICATION_RULESET
