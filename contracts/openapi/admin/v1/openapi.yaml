components:
  securitySchemes:
    PadlHubAdminJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: PadlHub-issued staff JWT with the dedicated phub-admin audience.
  parameters:
    TenantKey:
      name: tenantKey
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CommunityId:
      name: communityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommunityPostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommunityCommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ApiError:
      description: Stable PadlHub API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    CanonicalLevelAdminView:
      $ref: ./level-eligibility.yaml#/CanonicalLevelAdminView
    LevelEligibilityPolicyAdminView:
      $ref: ./level-eligibility.yaml#/LevelEligibilityPolicyAdminView
    LevelEligibilityPolicyState:
      $ref: ./level-eligibility.yaml#/LevelEligibilityPolicyState
    LevelEligibilityPolicyInput:
      $ref: ./level-eligibility.yaml#/LevelEligibilityPolicyInput
    LevelEligibilityPreviewInput:
      $ref: ./level-eligibility.yaml#/LevelEligibilityPreviewInput
    LevelEligibilityPreviewResult:
      $ref: ./level-eligibility.yaml#/LevelEligibilityPreviewResult
    AdminCommunityMembershipStatus:
      type: string
      enum: [NONE, PENDING, ACTIVE, LEFT, REMOVED, BANNED]
    AdminCommunityJoinRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - communityId
        - requesterUserId
        - kind
        - status
        - membershipStatus
        - membershipRevision
        - requestRevision
        - requestedAt
      properties:
        requestId:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        requesterUserId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [JOIN, REJOIN]
        status:
          type: string
          const: PENDING
        membershipStatus:
          $ref: '#/components/schemas/AdminCommunityMembershipStatus'
        membershipRevision:
          type: integer
          minimum: 0
        requestRevision:
          type: integer
          minimum: 1
        requestedAt:
          type: string
          format: date-time
    AdminCommunityJoinRequestPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AdminCommunityJoinRequest'
        nextCursor:
          type: string
          minLength: 16
          maxLength: 512
    AdminCommunityJoinRequestDecisionRequest:
      type: object
      additionalProperties: false
      required: [expectedMembershipRevision, expectedRequestRevision]
      properties:
        expectedMembershipRevision:
          type: integer
          minimum: 0
        expectedRequestRevision:
          type: integer
          minimum: 1
    AdminCommunityJoinRequestRejectRequest:
      type: object
      additionalProperties: false
      required: [expectedMembershipRevision, expectedRequestRevision, reasonCode]
      properties:
        expectedMembershipRevision:
          type: integer
          minimum: 0
        expectedRequestRevision:
          type: integer
          minimum: 1
        reasonCode:
          type: string
          minLength: 2
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
    AdminCommunityJoinRequestDecisionResult:
      type: object
      additionalProperties: false
      required:
        - outcome
        - requestId
        - communityId
        - requesterUserId
        - requestStatus
        - requestRevision
        - membershipStatus
        - membershipRevision
        - reasonCode
        - decidedAt
        - replayed
      properties:
        outcome:
          type: string
          enum: [APPROVED, REJECTED]
        requestId:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        requesterUserId:
          type: string
          format: uuid
        requestStatus:
          type: string
          enum: [APPROVED, REJECTED]
        requestRevision:
          type: integer
          minimum: 1
        membershipStatus:
          $ref: '#/components/schemas/AdminCommunityMembershipStatus'
        membershipRevision:
          type: integer
          minimum: 0
        reasonCode:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        decidedAt:
          type: string
          format: date-time
        replayed:
          type: boolean
    AdminCommunityDirectInviteQuotaGrantRequest:
      type: object
      additionalProperties: false
      required: [reasonCode, ticketId]
      properties:
        reasonCode:
          type: string
          minLength: 2
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        ticketId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$'
    AdminCommunityDirectInviteQuotaGrant:
      type: object
      additionalProperties: false
      required:
        - id
        - communityId
        - status
        - revision
        - createdAt
        - expiresAt
        - updatedAt
        - consumedAt
        - replayed
      properties:
        id:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        status:
          type: string
          const: ACTIVE
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        consumedAt:
          type: 'null'
        replayed:
          type: boolean
    AdminCommunityCreateQuotaScope:
      type: string
      enum: [DAILY_CREATE_LIMIT, ACTIVE_OWNER_LIMIT]
    AdminCommunityCreateQuotaGrantRequest:
      type: object
      additionalProperties: false
      required: [scopes, reasonCode, ticketId]
      properties:
        scopes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AdminCommunityCreateQuotaScope'
        reasonCode:
          type: string
          minLength: 2
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        ticketId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$'
    AdminCommunityCreateQuotaGrant:
      type: object
      additionalProperties: false
      required:
        - id
        - subjectUserId
        - scopes
        - status
        - revision
        - createdAt
        - expiresAt
        - updatedAt
        - consumedAt
        - replayed
      properties:
        id:
          type: string
          format: uuid
        subjectUserId:
          type: string
          format: uuid
        scopes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AdminCommunityCreateQuotaScope'
        status:
          type: string
          const: ACTIVE
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        consumedAt:
          type: 'null'
        replayed:
          type: boolean
    AdminCommunityPostStatus:
      type: string
      enum: [PENDING_MODERATION, PUBLISHED, ARCHIVED, HIDDEN]
    AdminCommunityMediaVariantName:
      type: string
      enum: [THUMBNAIL, FEED]
    AdminCommunityMediaVariant:
      type: object
      additionalProperties: false
      required: [variant, url, contentType, width, height, byteSize]
      properties:
        variant:
          $ref: '#/components/schemas/AdminCommunityMediaVariantName'
        url:
          type: string
          pattern: '^/user/api/v1/'
        contentType:
          type: string
          const: image/webp
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        byteSize:
          type: integer
          minimum: 1
    AdminCommunityPostMedia:
      type: object
      additionalProperties: false
      required: [id, mediaType, width, height, variants]
      properties:
        id:
          type: string
          format: uuid
        mediaType:
          type: string
          const: IMAGE
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        variants:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/AdminCommunityMediaVariant'
    AdminCommunityMediaReadGrant:
      type: object
      additionalProperties: false
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    AdminCommunityMediaReplayRequest:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
    AdminCommunityMediaReplayResult:
      type: object
      additionalProperties: false
      required: [targetId, operation, replayed]
      properties:
        targetId:
          type: string
          format: uuid
        operation:
          type: string
          enum: [SCAN, GC]
        replayed:
          type: boolean
    AdminCommunityPost:
      type: object
      additionalProperties: false
      required:
        - id
        - communityId
        - authorUserId
        - status
        - body
        - revision
        - createdAt
        - publishedAt
        - updatedAt
        - archivedAt
        - restoreUntil
        - retentionUntil
      properties:
        id:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        authorUserId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AdminCommunityPostStatus'
        body:
          type: string
          minLength: 1
          maxLength: 10000
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: [string, 'null']
          format: date-time
        restoreUntil:
          type: [string, 'null']
          format: date-time
        retentionUntil:
          type: [string, 'null']
          format: date-time
        media:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/AdminCommunityPostMedia'
    AdminCommunityPendingPost:
      type: object
      additionalProperties: false
      required: [post]
      properties:
        post:
          allOf:
            - $ref: '#/components/schemas/AdminCommunityPost'
            - type: object
              properties:
                status:
                  const: PENDING_MODERATION
    AdminCommunityPendingPostPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AdminCommunityPendingPost'
        nextCursor:
          type: string
          minLength: 16
          maxLength: 1024
    AdminCommunityContentRevisionRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
    AdminCommunityContentReasonedRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, reasonCode]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        reasonCode:
          type: string
          minLength: 2
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
    AdminCommunityComment:
      type: object
      additionalProperties: false
      required:
        - id
        - communityId
        - postId
        - authorUserId
        - status
        - body
        - revision
        - createdAt
        - publishedAt
        - updatedAt
        - archivedAt
        - restoreUntil
        - retentionUntil
      properties:
        id:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        authorUserId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PUBLISHED, ARCHIVED, HIDDEN]
        body:
          type: string
          minLength: 1
          maxLength: 2000
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: [string, 'null']
          format: date-time
        restoreUntil:
          type: [string, 'null']
          format: date-time
        retentionUntil:
          type: [string, 'null']
          format: date-time
    GiftCertificateCatalogStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    GiftCertificateFlowStep:
      type: string
      enum: [RECIPIENT_KIND, DESIGN, DENOMINATION, MESSAGE, DELIVERY, REVIEW]
    GiftCertificatePolicy:
      type: object
      additionalProperties: false
      required:
        - validityStart
        - validityDays
        - activationDeadlineDays
        - scheduledDeliveryEnabled
        - emailAttachmentEnabled
      properties:
        validityStart:
          type: string
          enum: [ISSUE, ACTIVATION]
        validityDays:
          type: integer
          minimum: 1
          maximum: 3650
        activationDeadlineDays:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
        scheduledDeliveryEnabled:
          type: boolean
        emailAttachmentEnabled:
          type: boolean
    GiftCertificateDesignInput:
      type: object
      additionalProperties: false
      required:
        [
          key,
          audience,
          title,
          description,
          imageUrl,
          alt,
          codeXPercent,
          codeYPercent,
          amountXPercent,
          amountYPercent,
          active,
          sortOrder,
        ]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,62}$'
        audience:
          type: string
          enum: [FOR_HER, FOR_HIM, UNIVERSAL]
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
