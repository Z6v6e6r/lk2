server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    # iOS reads this file to decide whether the site can be installed on the Home Screen, which is the
    # only context where it allows Web Push. nginx ships no MIME mapping for `.webmanifest`, so it is
    # declared here, and the file must not be pinned in a browser cache because an installed app has to
    # pick up a changed manifest on its next launch.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The service worker carries the notification behaviour itself, so it is revalidated on every launch
    # instead of waiting out a heuristic cache lifetime.
    location = /phub-notification-sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
