paths:
  /{tenantKey}/booking-screen-read-jobs:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
    post:
      tags: [bookings]
      operationId: startBookingScreenReadJob
      summary: Start a server-directed client-assisted screen read
      description: |
        Returns only a fixed, read-only command vocabulary. The browser cannot submit a provider
        URL or choose a source. Provider payloads must be relayed immediately to the matching
        result endpoint and are normalized before recommendation ranking, construction of the
        group-training catalog, or construction of the current user's booking snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingScreenReadJobRequest'
      responses:
        '200':
          description: Short-lived read job and its fixed commands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingScreenReadJob'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../common/components.yaml#/components/responses/Forbidden
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable

  /{tenantKey}/booking-screen-read-jobs/{jobId}/results/{commandId}:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/BookingScreenReadJobId'
      - $ref: '#/components/parameters/BookingScreenReadCommandId'
    post:
      tags: [bookings]
      operationId: submitBookingScreenReadResult
      summary: Relay one bounded provider result to its server-issued command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingScreenReadResultRequest'
      responses:
        '200':
          description: An identical command result was already accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingScreenReadResultAcceptance'
        '202':
          description: Result normalized and accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingScreenReadResultAcceptance'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '413':
          description: Provider result exceeds the bounded relay body limit.
          content:
            application/json:
              schema:
                $ref: ../../common/components.yaml#/components/schemas/ApiError
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests

  /{tenantKey}/booking-screen-read-jobs/{jobId}/complete:
    parameters:
      - $ref: ../../common/components.yaml#/components/parameters/TenantKey
      - $ref: ../../common/components.yaml#/components/parameters/CorrelationId
      - $ref: '#/components/parameters/BookingScreenReadJobId'
    post:
      tags: [bookings]
      operationId: completeBookingScreenReadJob
      summary: Build the requested booking-screen snapshot from accepted results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingScreenReadCompletionRequest'
      responses:
        '200':
          description: Ready or explicitly partial recommendation snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingScreenReadCompletion'
        '400':
          $ref: ../../common/components.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../common/components.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../../common/components.yaml#/components/responses/NotFound
        '429':
          $ref: ../../common/components.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../../common/components.yaml#/components/responses/ServiceUnavailable

components:
  parameters:
    BookingScreenReadJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingScreenReadCommandId:
      name: commandId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    BookingScreenReadJobRequest:
      oneOf:
        - $ref: '#/components/schemas/LegacyBookingScreenReadJobRequest'
        - $ref: '#/components/schemas/EventCatalogReadJobRequest'
      discriminator:
        propertyName: screen
        mapping:
          FOR_ME: '#/components/schemas/LegacyBookingScreenReadJobRequest'
          GROUP_TRAININGS: '#/components/schemas/LegacyBookingScreenReadJobRequest'
          MY_BOOKINGS: '#/components/schemas/LegacyBookingScreenReadJobRequest'
          EVENT_CATALOG: '#/components/schemas/EventCatalogReadJobRequest'
    LegacyBookingScreenReadJobRequest:
      type: object
      additionalProperties: false
      required: [screen]
      properties:
        screen:
          type: string
          enum: [FOR_ME, GROUP_TRAININGS, MY_BOOKINGS]
    EventCatalogReadJobRequest:
      type: object
      additionalProperties: false
      required: [screen, query]
      properties:
        screen:
          type: string
          const: EVENT_CATALOG
        query:
          $ref: '#/components/schemas/EventCatalogQuery'
    BookingScreenReadJob:
      type: object
      additionalProperties: false
      required: [jobId, screen, expiresAt, commands, concurrency]
      properties:
        jobId:
          type: string
          format: uuid
        screen:
          type: string
          enum: [FOR_ME, GROUP_TRAININGS, MY_BOOKINGS, EVENT_CATALOG]
        expiresAt:
          type: string
          format: date-time
        commands:
          type: array
          minItems: 0
          maxItems: 15
          items:
            $ref: '#/components/schemas/BookingScreenReadCommand'
        concurrency:
          type: integer
          minimum: 1
          maximum: 3
    BookingScreenReadCommand:
      oneOf:
        - $ref: '#/components/schemas/BookingScreenScheduleReadCommand'
        - $ref: '#/components/schemas/BookingScreenUpcomingReadCommand'
    BookingScreenScheduleReadCommand:
      type: object
      additionalProperties: false
      required: [commandId, operation, date]
      properties:
        commandId:
          type: string
          format: uuid
        operation:
          type: string
          const: schedule.read
        date:
          type: string
          format: date
    BookingScreenUpcomingReadCommand:
      type: object
      additionalProperties: false
      required: [commandId, operation, detailsOperation, page, size]
      properties:
        commandId:
          type: string
          format: uuid
        operation:
          type: string
          const: bookings.read
        detailsOperation:
          type: string
          const: bookings.details.read
        page:
          type: integer
          const: 0
        size:
          type: integer
          const: 50
    BookingScreenReadResultRequest:
      type: object
      additionalProperties: false
      required: [payload]
      properties:
        payload:
          description: |
            Bounded Viva end-user schedule response or a fixed booking-list/details pair. It is
            normalized immediately and is never returned from a PadlHub public API or retained as
            a source of truth.
          oneOf:
            - type: array
              maxItems: 500
              items: {}
            - type: object
              additionalProperties: true
              properties:
                content:
                  type: array
                  maxItems: 500
                  items: {}
                items:
                  type: array
                  maxItems: 500
                  items: {}
    BookingScreenReadResultAcceptance:
      type: object
      additionalProperties: false
      required: [accepted, replayed, itemCount]
      properties:
        accepted:
          type: boolean
          const: true
        replayed:
          type: boolean
        itemCount:
          type: integer
          minimum: 0
          maximum: 500
    BookingScreenReadCompletionRequest:
      type: object
      additionalProperties: false
      required: [limit]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 500
        phase:
          description: Fixed FOR_ME progressive completion phase; omitted for other screens.
          type: string
          enum: [HOME_INITIAL, HOME_TOURNAMENTS, FULL]
    BookingScreenReadCompletion:
      oneOf:
        - $ref: '#/components/schemas/BookingScreenRecommendationReadCompletion'
        - $ref: '#/components/schemas/BookingScreenTrainingScheduleReadCompletion'
        - $ref: '#/components/schemas/BookingScreenUpcomingReadCompletion'
        - $ref: '#/components/schemas/BookingScreenEventCatalogReadCompletion'
    BookingScreenRecommendationReadCompletion:
      type: object
      additionalProperties: false
      required: [screen, state, completedCommands, totalCommands, page]
      properties:
        screen:
          type: string
          const: FOR_ME
        state:
          type: string
          enum: [READY, PARTIAL]
        completedCommands:
          type: integer
          minimum: 0
          maximum: 14
        totalCommands:
          type: integer
          minimum: 1
          maximum: 14
        page:
          $ref: ./games.yaml#/components/schemas/BookingRecommendationPage
    BookingScreenTrainingScheduleReadCompletion:
      type: object
      additionalProperties: false
      required: [screen, state, completedCommands, totalCommands, trainings]
      properties:
        screen:
          type: string
          const: GROUP_TRAININGS
        state:
          type: string
          enum: [READY, PARTIAL]
        completedCommands:
          type: integer
          minimum: 0
          maximum: 14
        totalCommands:
          type: integer
          minimum: 1
          maximum: 14
        trainings:
          $ref: '#/components/schemas/TrainingSchedulePage'
    TrainingSchedulePage:
      type: object
      additionalProperties: false
      required: [version, generatedAt, staleAt, items]
      properties:
        version:
          type: string
          pattern: '^[0-9a-f]{64}$'
        generatedAt:
          type: string
          format: date-time
        staleAt:
          type: string
          format: date-time
        items:
          type: array
          maxItems: 500
          items:
            $ref: ./games.yaml#/components/schemas/BookingRecommendationActivity
    EventCatalogQuery:
      oneOf:
        - $ref: '#/components/schemas/TrainingEventCatalogQuery'
        - $ref: '#/components/schemas/GamesEventCatalogQuery'
      discriminator:
        propertyName: surface
        mapping:
          TRAININGS: '#/components/schemas/TrainingEventCatalogQuery'
          GAMES: '#/components/schemas/GamesEventCatalogQuery'
    TrainingEventCatalogQuery:
      type: object
      additionalProperties: false
      required: [surface, localDates, kinds, availability, limit]
      properties:
        surface:
          type: string
          const: TRAININGS
        localDates:
          type: array
          minItems: 1
          maxItems: 15
          uniqueItems: true
          items:
            type: string
            format: date
        kinds:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [COACH_GAME, GROUP_TRAINING, SPLIT]
        categoryIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        stationIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        availability:
          type: string
          enum: [EXCLUDE_FULL, INCLUDE_FULL]
        levelFrom:
          $ref: ./games.yaml#/components/schemas/GamePlayerLevel
        levelTo:
          $ref: ./games.yaml#/components/schemas/GamePlayerLevel
        startsAfterLocal:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        limit:
          type: integer
          minimum: 1
          maximum: 50
    GamesEventCatalogQuery:
      type: object
      additionalProperties: false
      required: [surface, localDates, kinds, availability, limit]
      properties:
        surface:
          type: string
          const: GAMES
        localDates:
          type: array
          minItems: 1
          maxItems: 15
          uniqueItems: true
          items:
            type: string
            format: date
        kinds:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [GAME, COACH_GAME, TOURNAMENT]
        categoryIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        stationIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        availability:
          type: string
          enum: [EXCLUDE_FULL, INCLUDE_FULL]
        levelFrom:
          $ref: ./games.yaml#/components/schemas/GamePlayerLevel
        levelTo:
          $ref: ./games.yaml#/components/schemas/GamePlayerLevel
        startsAfterLocal:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        limit:
          type: integer
          minimum: 1
          maximum: 50
    EventCatalogItem:
      oneOf:
        - $ref: '#/components/schemas/EventCatalogTrainingItem'
        - $ref: '#/components/schemas/EventCatalogGameItem'
        - $ref: '#/components/schemas/EventCatalogTournamentItem'
      discriminator:
        propertyName: kind
        mapping:
          GAME: '#/components/schemas/EventCatalogGameItem'
          COACH_GAME: '#/components/schemas/EventCatalogTrainingItem'
          TOURNAMENT: '#/components/schemas/EventCatalogTournamentItem'
          GROUP_TRAINING: '#/components/schemas/EventCatalogTrainingItem'
          SPLIT: '#/components/schemas/EventCatalogTrainingItem'
    EventCatalogTrainingItem:
      type: object
      additionalProperties: false
      required: [kind, activity]
      properties:
        kind:
          type: string
          enum: [COACH_GAME, GROUP_TRAINING, SPLIT]
        activity:
          $ref: ./games.yaml#/components/schemas/BookingRecommendationActivity
    EventCatalogGameItem:
      type: object
      additionalProperties: false
      required: [kind, game]
      properties:
        kind:
          type: string
          const: GAME
        game:
          $ref: ../../public/v1/openapi.yaml#/components/schemas/PublicGameCard
    EventCatalogStation:
      type: object
      additionalProperties: false
      required: [id, name, shortAddress]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 160
        shortAddress:
          type: [string, 'null']
          maxLength: 240
    EventCatalogTournamentItem:
      type: object
      additionalProperties: false
      required: [kind, tournament, station]
      properties:
        kind:
          type: string
          const: TOURNAMENT
        tournament:
          $ref: ../../public/v1/openapi.yaml#/components/schemas/PublicTournamentSummary
        station:
          $ref: '#/components/schemas/EventCatalogStation'
    EventCatalogFacetOption:
      type: object
      additionalProperties: false
      required: [id, name, count]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        count:
          type: integer
          minimum: 0
    EventCatalogKindFacet:
      type: object
      additionalProperties: false
      required: [kind, count]
      properties:
        kind:
          type: string
          enum: [GAME, COACH_GAME, TOURNAMENT, GROUP_TRAINING, SPLIT]
        count:
          type: integer
          minimum: 0
    EventCatalogFacets:
      type: object
      additionalProperties: false
      required: [kinds, categories, stations]
      properties:
        kinds:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/EventCatalogKindFacet'
        categories:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/EventCatalogFacetOption'
        stations:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/EventCatalogFacetOption'
    EventCatalogSourceStatus:
      type: object
      additionalProperties: false
      required: [source, localDate, state, errorCode]
      properties:
        source:
          type: string
          enum: [SCHEDULE, LOCAL_GAMES, TOURNAMENTS]
        localDate:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        state:
          type: string
          enum: [READY, UNAVAILABLE]
        errorCode:
          oneOf:
            - type: string
              pattern: '^[A-Z][A-Z0-9_]*$'
            - type: 'null'
    EventCatalogPage:
      oneOf:
        - $ref: '#/components/schemas/ReadyEventCatalogPage'
        - $ref: '#/components/schemas/PartialEventCatalogPage'
      discriminator:
        propertyName: state
        mapping:
          READY: '#/components/schemas/ReadyEventCatalogPage'
          PARTIAL: '#/components/schemas/PartialEventCatalogPage'
    EventCatalogPageBase:
      type: object
      required:
        - snapshotVersion
        - generatedAt
        - staleAt
        - items
        - nextCursor
        - sourceStatus
      properties:
        snapshotVersion:
          type: string
          pattern: '^[0-9a-f]{64}$'
        generatedAt:
          type: string
          format: date-time
        staleAt:
          type: string
          format: date-time
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/EventCatalogItem'
        nextCursor:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        sourceStatus:
          type: array
          minItems: 1
          maxItems: 17
          items:
            $ref: '#/components/schemas/EventCatalogSourceStatus'
    ReadyEventCatalogPage:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/EventCatalogPageBase'
        - type: object
          required: [state, totalMatched, facets]
          properties:
            state:
              type: string
              const: READY
            totalMatched:
              type: integer
              minimum: 0
            facets:
              $ref: '#/components/schemas/EventCatalogFacets'
    PartialEventCatalogPage:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/EventCatalogPageBase'
        - type: object
          required: [state, totalMatched, facets]
          properties:
            state:
              type: string
              const: PARTIAL
            totalMatched:
              type: 'null'
            facets:
              type: 'null'
    BookingScreenEventCatalogReadCompletion:
      type: object
      additionalProperties: false
      required: [screen, state, completedCommands, totalCommands, catalog]
      properties:
        screen:
          type: string
          const: EVENT_CATALOG
        state:
          type: string
          enum: [READY, PARTIAL]
        completedCommands:
          type: integer
          minimum: 0
          maximum: 15
        totalCommands:
          type: integer
          minimum: 0
          maximum: 15
        catalog:
          $ref: '#/components/schemas/EventCatalogPage'
    BookingScreenUpcomingReadCompletion:
      type: object
      additionalProperties: false
      required: [screen, state, completedCommands, totalCommands, bookings]
      properties:
        screen:
          type: string
          const: MY_BOOKINGS
        state:
          type: string
          enum: [READY, PARTIAL]
        completedCommands:
          type: integer
          minimum: 0
          maximum: 1
        totalCommands:
          type: integer
          const: 1
        bookings:
          $ref: ./openapi.yaml#/components/schemas/UserUpcomingBookings
